function autoRevealCurrentFinalStage(){
  if(!finalState?.unlocked) return;
  const step = finalRevealStep || 0;
  const categoryIndex = step - 1;
  if(categoryIndex >= 0 && categoryIndex < finalState.categories.length && !finalCatRevealed[categoryIndex]){
    revealFinalCategory(categoryIndex);
    return;
  }
  if(step === finalState.categories.length + 3 && !finalChampionRevealed) revealFinalChampion();
}
function autoAdvanceFinal(){
  if(view !== 'final' || !finalState?.unlocked){
    finalAutoPlay = false;
    clearInterval(finalAutoInterval);
    finalAutoInterval = null;
    return;
  }
  const step = finalRevealStep || 0;
  const championStep = finalState.categories.length + 3;
  if(step === championStep && finalChampionRevealed){
    finalAutoPlay = false;
    clearInterval(finalAutoInterval);
    finalAutoInterval = null;
    render();
    return;
  }
  if(step === championStep && !finalChampionRevealed){
    autoRevealCurrentFinalStage();
    return;
  }
  if(step < championStep) advanceFinalReveal();
}

// Total real de cada entrenador: combates ganados (torneos + desafíos) +
// estrellas repartidas en LA FINAL. Es el mismo criterio que usa el
// "Marcador" del Temporizador, así que el podio/campeón de LA FINAL tiene
// que salir de aquí y no solo de las estrellas.
function finalTotalScoreOf(t){
  const pts = finalState.pointsAwarded || {};
  return combatWinsOf(t) + (pts[t]||0);
}
// Un entrenador con la vida a -1 ha perdido su partida (Locke terminado):
// no puede ganar LA FINAL aunque saque más estrellas o combates que nadie.
function hasLostLocke(t){
  return (hearts[t]??0) <= -1;
}
// Orden oficial de LA FINAL: primero los que siguen vivos (por puntuación
// total), y solo después, sin excepción, los que ya perdieron su vida.
function finalRankedTrainers(){
  const pts = finalState.pointsAwarded || {};
  return [...TRAINERS].sort((a,b)=>{
    const lostA = hasLostLocke(a), lostB = hasLostLocke(b);
    if(lostA !== lostB) return lostA ? 1 : -1;
    const diff = finalTotalScoreOf(b) - finalTotalScoreOf(a);
    if(diff !== 0) return diff;
    return (pts[b]||0)-(pts[a]||0); // desempate: quien más estrellas ganó en LA FINAL
  });
}

async function placeDuelBet(matchKey){
  const trainerSel = document.getElementById(`duelbet-trainer-${matchKey}`);
  const pickSel = document.getElementById(`duelbet-pick-${matchKey}`);
  const err = document.getElementById(`duelbet-err-${matchKey}`);
  if(!trainerSel || !pickSel) return;
  const trainer = trainerSel.value;
  const pick = pickSel.value;
  const amount = duelBetChipValue;
  if((tickets[trainer]||0) < amount){ err.textContent = `${NAMES[trainer]} no tiene suficientes tickets.`; return; }
  if((duelBets[matchKey]||[]).some(b=>b.trainer===trainer)){ err.textContent = 'Ya ha apostado en este combate.'; return; }
  await addTickets(trainer, -amount, `Apuesta en combate a favor de ${NAMES[pick]}`);
  duelBets[matchKey] = [...(duelBets[matchKey]||[]), { trainer, pick, amount }];
  render();
  const ok = await saveDuelBets();
  if(!ok) queueRetry('duelBets', saveDuelBets);
}

async function resolveDuelBets(matchKey, winner){
  const bets = duelBets[matchKey] || [];
  for(const b of bets){
    if(b.pick === winner){
      await addTickets(b.trainer, b.amount*2, `Acertó su apuesta del combate (x2)`);
    }
  }
  duelBets[matchKey] = [];
  const ok = await saveDuelBets();
  if(!ok) queueRetry('duelBets', saveDuelBets);
}

async function seedDefaultNormasIfMissing(){

  const existingTexts = new Set(normas.map(n => n.text));
  const toAdd = DEFAULT_NORMAS.filter(t => !existingTexts.has(t));
  let changed = false;
  { const OLD = 'No se pueden usar Pokémon legendarios ni singulares. Las Ultraentes sí están permitidas.'; const n0 = normas.length; normas = normas.filter(n => n.text !== OLD); if(normas.length !== n0) changed = true; }

  // Si alguna de las normas por defecto ya se guardo antes con un entrenador
  // puesto (versiones previas de esta funcion), se lo quitamos.
  normas.forEach(n => {
    if(defaultTextsSet.has(n.text) && n.trainer !== null){
      n.trainer = null;
      changed = true;
    }
  });

  if(toAdd.length > 0){
    const now = Date.now();
    toAdd.forEach((text, i) => {
      normas.push({ id: crypto.randomUUID(), trainer: null, text, ts: now - (toAdd.length - i) });

    changed = true;
  }

  if(!changed) return;
  const ok = await saveNormas();
  if(!ok) queueRetry('normas', saveNormas);
}

/* ---------------- Pending-save safety net ---------------- */
const pendingSaves = new Map(); // key -> retry function
function updateSyncBadge(){
  let el = document.getElementById('sync-badge');
  if(pendingSaves.size === 0){
    if(el) el.remove();
    return;
  }
  if(!el){
    el = document.createElement('div');
    el.id = 'sync-badge';
    el.style.cssText = 'position:fixed;top:14px;right:14px;background:#3a1f24;border:1px solid #7a3138;color:#e8b3ba;padding:7px 14px;border-radius:999px;font-size:11px;font-family:Inter,sans-serif;z-index:200;letter-spacing:.5px;';
    document.body.appendChild(el);
  }
  el.textContent = `⚠ sin guardar (${pendingSaves.size}) — no cierres la pestaña`;
}
let pendingSaveNextAttempt = new Map(); // key -> cuando toca volver a intentarlo (backoff creciente)
let pendingSaveFailCount = new Map();   // key -> fallos seguidos
function queueRetry(key, saveFn){
  pendingSaves.set(key, saveFn);
  if(!pendingSaveNextAttempt.has(key)) pendingSaveNextAttempt.set(key, Date.now());
  updateSyncBadge();
}
async function flushPending(){
  const now = Date.now();
  for(const [key, saveFn] of [...pendingSaves.entries()]){
    if(now < (pendingSaveNextAttempt.get(key) || 0)) continue; // todavia no toca este, en espera
    const ok = await saveFn();
    if(ok){
      pendingSaves.delete(key);
      pendingSaveNextAttempt.delete(key);
      pendingSaveFailCount.delete(key);
    } else {
      const fails = (pendingSaveFailCount.get(key) || 0) + 1;
      pendingSaveFailCount.set(key, fails);
      // 4s, 8s, 16s, 32s... hasta un tope de 2 minutos entre reintentos
      pendingSaveNextAttempt.set(key, now + Math.min(4000 * (2 ** fails), 120000));
    }
  }
  updateSyncBadge();
}
setInterval(flushPending, 4000);

function pushHistory(text){
  history.unshift({id: crypto.randomUUID(), text, ts: Date.now()});
  history = history.slice(0, 300);
  trackedStoreSet('history', 'locke:history', history).then(ok=>{ if(!ok) queueRetry('history', ()=>trackedStoreSet('history', 'locke:history', history)); });
}

/* ---- Popup de novedades al abrir la web: solo una vez, luego no vuelve a
   salir hasta que haya algo nuevo desde la ultima vez que se vio en ESTE
   dispositivo/navegador (se recuerda con localStorage, igual que el volumen). ---- */
const NEWS_SEEN_KEY = 'triolocke_news_last_seen_ts';
// Solo estas categorías cuentan como "novedad" para el popup y para el aviso del
// nav: shinies (✨), capturas nuevas (🆕), intercambios (🔄), evoluciones (🔺),
// lotería (🎉) y hitos de nivel cap superados (🏆). Las muertes (💔) tienen
// SU PROPIO popup dedicado (la baraja de lápidas, ver showTombPopupIfAny)
// así que aquí las dejamos fuera aposta, para no avisar dos veces de lo mismo.
const NEWS_RELEVANT_PREFIXES = ['✨', '🆕', '🔄', '🔺', '🎉', '🏆'];
function isNewsRelevant(text){
  return NEWS_RELEVANT_PREFIXES.some(p => text.startsWith(p));
}
function showNewsPopupIfAny(){
  const lastSeen = parseInt(localStorage.getItem(NEWS_SEEN_KEY) || '0', 10);
  if(!lastSeen){
    // primera vez que se abre la web en este dispositivo: no bombardeamos con
    // todo el historial de golpe, solo marcamos el punto de partida.
    localStorage.setItem(NEWS_SEEN_KEY, String(Date.now()));
    return;
  }
  const nuevas = history.filter(h => h.ts > lastSeen && isNewsRelevant(h.text)).slice(0, 12);
  localStorage.setItem(NEWS_SEEN_KEY, String(Date.now()));
  if(nuevas.length === 0) return;
  openModal(`
    <h3>📰 Novedades</h3>
    <div class="news-list">
      ${nuevas.map(h=>`
        <div class="news-item">
          <span class="news-text">${historyTextForDisplay(h.text)}</span>
          <span class="news-time">${newsRelativeTime(h.ts)}</span>
        </div>
      `).join('')}
    </div>
    <div class="modal-actions">
      <button class="primary" onclick="closeModal()">Vale, enterado</button>
    </div>
  `);
}
function newsRelativeTime(ts){
  const diffMin = Math.round((Date.now() - ts) / 60000);
  if(diffMin < 1) return 'ahora mismo';
  if(diffMin < 60) return `hace ${diffMin} min`;
  const diffH = Math.round(diffMin/60);
  if(diffH < 24) return `hace ${diffH}h`;
  return `hace ${Math.round(diffH/24)}d`;
}

// ===== Popup automático de lápidas al abrir la página =====
// A diferencia de la baraja de la pestaña Cementerio (que muestra TODOS los
// caídos y siempre empieza desde arriba), esto solo salta si hay muertes
// NUEVAS desde la última vez que se abrió la web en este dispositivo -- y
// solo esas, no el cementerio entero.
const CEMETERY_SEEN_KEY = 'triolocke_cemetery_last_seen_ts';
let tombPopupQueue = [];
let tombPopupAnimating = false;

function showTombPopupIfAny(){
  const lastSeen = parseInt(localStorage.getItem(CEMETERY_SEEN_KEY) || '0', 10);
  const all = TRAINERS.flatMap(t => (graveyard[t]||[]).map(g => ({...g, trainer: t})));
  if(!lastSeen){
    // primera vez en este dispositivo: no bombardeamos con TODO el
    // cementerio de golpe, solo marcamos el punto de partida.
    localStorage.setItem(CEMETERY_SEEN_KEY, String(Date.now()));
    return;
  }
  const nuevas = all.filter(g => g.diedAt > lastSeen).sort((a,b)=> b.diedAt - a.diedAt);
  localStorage.setItem(CEMETERY_SEEN_KEY, String(Date.now()));
  if(nuevas.length === 0) return;

  tombPopupQueue = nuevas;
  const tryOpen = () => {
    if(document.getElementById('modal-overlay')){
      // ya hay otro modal abierto (p.ej. el de Novedades): esperamos a que
      // lo cierren para no pisarnos los dos overlays a la vez.
      setTimeout(tryOpen, 300);
      return;
    }
    openModal(`
      <h3>🪦 ${nuevas.length > 1 ? `${nuevas.length} bajas nuevas` : 'Una baja nueva'}</h3>
      <div class="tomb-stack-wrap" id="tomb-popup-wrap" style="margin:16px auto 4px;"></div>
      <div class="modal-actions">
        <button class="ghost" onclick="closeModal()">Cerrar</button>
      </div>
    `, true);
    renderTombPopupStack();
  };
  tryOpen();
}

function renderTombPopupStack(){
  const wrap = document.getElementById('tomb-popup-wrap');
  if(!wrap) return;
  if(tombPopupQueue.length === 0){ closeModal(); return; }
  const visible = tombPopupQueue.slice(0, 5);
  wrap.innerHTML = visible.map((g, depth)=>{
    const { date, loc } = jokeDeathDetails(g);
    const cardId = `tomb-popup-card-${depth}`;
    const isTop = depth === 0;
    const offset = depth * 10;
    const rotate = depth === 0 ? 0 : (depth % 2 === 0 ? 1 : -1) * (depth * 1.5);
    const style = `transform: translateY(${offset}px) scale(${1 - depth*0.04}) rotate(${rotate}deg); z-index:${100-depth};`;
    return `
      <div id="${cardId}" class="tomb-card" style="${style}" ${isTop ? `onclick="dismissTombPopupCard('${cardId}')"` : ''}>
        <div class="tomb-card-rip">R · I · P</div>
        <img loading="lazy" src="${g.sprite}" alt="${g.speciesName}">
        <div class="tomb-card-name">${g.nickname}</div>
        <div class="tomb-card-species">${g.speciesName.replace(/-/g,' ')} · Nv.${g.level}</div>
        <div class="tomb-card-trainer">${NAMES[g.trainer]}</div>
        <div class="tomb-card-divider"></div>
        <div class="tomb-card-line">📅 <b>${date}</b></div>
        <div class="tomb-card-line">📍 <b>${loc}</b></div>
        ${isTop ? '<div class="tomb-card-tap">Toca para pasar a la siguiente</div>' : ''}
      </div>
    `;
  }).join('');
}

function dismissTombPopupCard(cardId){
  if(tombPopupAnimating) return;
  const el = document.getElementById(cardId);
  if(!el) return;
  tombPopupAnimating = true;
  el.classList.add('exiting');
  playSound('cardFlip');
  setTimeout(()=>{
    tombPopupQueue.shift();
    tombPopupAnimating = false;
    renderTombPopupStack();
  }, 420);
}

const MEDAL_SEEN_KEY = 'triolocke_medal_last_seen_ts';

let medalPopupIndex = 0;

function medalHistoryText(t, i, lives){

}
// El sprite de medallas es un data-URI enorme: se inyecta UNA vez como clase CSS
// en vez de repetirlo en cada elemento del historial.
function ensureMedalSpriteStyle(){
  if(document.getElementById('medal-sprite-style')) return;
  const st = document.createElement('style');
  st.id = 'medal-sprite-style';
  st.textContent = `.medal-sprite{ background-image:url(${GAME_BADGE_SPRITE}); }`;
  document.head.appendChild(st);
}
function medalEventOf(h){
  const m = /^medal:([^:]+):(\d+)$/.exec(String((h && h.id) || ''));
  if(!m) return null;
  const index = Number(m[2]);
  if(!TRAINERS.includes(m[1]) || !GAME_BADGES[index]) return null;
  const lv = /(\d+)\/(\d+) vidas/.exec(String(h.text || ''));
  return { trainer:m[1], index, ts:h.ts, lives: lv ? Number(lv[1]) : null, maxLives: lv ? Number(lv[2]) : null };
}
function showMedalPopupIfAny(){
  let lastSeen = parseInt(localStorage.getItem(MEDAL_SEEN_KEY) || '0', 10);
  // dispositivos que ya usaban la web: partimos de su última visita al cementerio
  // (esta función se llama ANTES de showTombPopupIfAny, que es quien la actualiza).
  if(!lastSeen) lastSeen = parseInt(localStorage.getItem(CEMETERY_SEEN_KEY) || '0', 10);
  localStorage.setItem(MEDAL_SEEN_KEY, String(Date.now()));
  if(!lastSeen) return;
  const nuevas = history.map(h => medalEventOf(h)).filter(m => m && m.ts > lastSeen).sort((a,b)=> a.ts - b.ts).slice(-8);

  medalPopupQueue = nuevas;
  medalPopupIndex = 0;

    if(document.getElementById('modal-overlay')){ setTimeout(tryOpen, 400); return; } // esperamos a Novedades / lápidas

async function addTickets(t, amount, reason){
  tickets[t] = Math.max((tickets[t]||0) + amount, 0);
  const sign = amount >= 0 ? '+' : '';
  pushHistory(`🎟️ ${NAMES[t]} ${sign}${amount} tickets (${reason}) → ${tickets[t]} tickets en total`);
  const ok = await saveProfile(t);
  if(!ok){
    queueRetry('profile:'+t, ()=>saveProfile(t));
    // Aviso visible YA (no solo el badge discreto de la esquina): si esto
    // pasa justo tras ganar algo y cierras la pestaña antes de que el
    // reintento en segundo plano acabe, ese premio se pierde de verdad.
    toast(`⚠ No se ha podido guardar (${reason}). Reintentando solo... NO cierres la pestaña todavía.`);
  }
}

const COSMETIC_PRIZES = { 'Una skin aleatoria':'characters', 'Un fondo aleatorio':'backgrounds', 'Una paleta aleatoria':'palettes', 'Un título aleatorio':'titles', 'Un cosmético aleatorio':'any' };
async function grantCosmeticPrize(t, text, source){
  try{
    const got = await FBD.grantCosmetic(t, COSMETIC_PRIZES[text]);
    if(!got){ await addTickets(t, 30, source + ' · ya lo tenía todo'); toast('Ya tenías todo lo de esa categoría: +30 tickets'); return true; }
    const nm = FBD.cosmeticName(got.kind, got.id);
    pushHistory(`🎁 ${NAMES[t]} ha ganado un cosmético: ${nm} (${source})`);
    toast(`🎁 ${NAMES[t]} gana: ${nm}. Míralo en la taquilla, sale con brillo.`);
    return true;
  }catch(e){ return false; }
}
async function addPendingPrize(t, text, source){
  if(COSMETIC_PRIZES[text] && await grantCosmeticPrize(t, text, source)) return;
  pendingPrizes[t] = pendingPrizes[t] || [];
  pendingPrizes[t].unshift({ id: crypto.randomUUID(), text, source, ts: Date.now() });
  pushHistory(`🎁 ${NAMES[t]} tiene un premio pendiente de entregar: ${text} (${source})`);
  const ok = await saveProfile(t);
  if(!ok) queueRetry('profile:'+t, ()=>saveProfile(t));
}

async function removePendingPrize(t, id){
  pendingPrizes[t] = (pendingPrizes[t]||[]).filter(p=>p.id!==id);
  render();
  const ok = await saveProfile(t);
  if(!ok) queueRetry('profile:'+t, ()=>saveProfile(t));
}

function openGiftPrize(fromTrainer, id){
  const prize = (pendingPrizes[fromTrainer]||[]).find(p=>p.id===id);
  if(!prize) return;
  const others = TRAINERS.filter(t=>t!==fromTrainer);
  openModal(`
    <h3>🎁 Regalar premio</h3>
    <div style="font-size:13px;color:var(--silver-dim);margin-bottom:12px;">"${prize.text}" <span style="opacity:.7;">(${prize.source})</span></div>
    <div class="field">
      <label>¿A quién se lo regalas?</label>
      <select id="gift-target-select">
        ${others.map(t=>`<option value="${t}">${NAMES[t]}</option>`).join('')}
      </select>
    </div>
    <div class="modal-actions">
      <button class="ghost" onclick="closeModal()">Cancelar</button>
      <button class="primary" onclick="confirmGiftPrize('${fromTrainer}','${id}')">Regalar</button>
    </div>
  `);
}
async function confirmGiftPrize(fromTrainer, id){
  const targetSel = document.getElementById('gift-target-select');
  if(!targetSel) return;
  const target = targetSel.value;
  const prize = (pendingPrizes[fromTrainer]||[]).find(p=>p.id===id);
  if(!prize) return;

  pendingPrizes[fromTrainer] = (pendingPrizes[fromTrainer]||[]).filter(p=>p.id!==id);
  pendingPrizes[target] = pendingPrizes[target] || [];
  pendingPrizes[target].unshift({
    id: crypto.randomUUID(),
    text: prize.text,
    source: `${prize.source} (regalo de ${NAMES[fromTrainer]})`,
    ts: Date.now(),
  });
  pushHistory(`🎁 ${NAMES[fromTrainer]} le regaló "${prize.text}" a ${NAMES[target]}`);
  closeModal();
  render();

  const ok1 = await saveProfile(fromTrainer);
  if(!ok1) queueRetry('profile:'+fromTrainer, ()=>saveProfile(fromTrainer));
  const ok2 = await saveProfile(target);
  if(!ok2) queueRetry('profile:'+target, ()=>saveProfile(target));
}

// Aplica un premio de ruleta al ganador/perdedor: si es "N tickets" se suma solo al saldo,
// si no, queda como premio físico pendiente de entregar en el perfil.
async function applyPrizeToTrainer(t, prizeLabel, source){
  const m = prizeLabel.match(/^(\d+)\s+tickets?$/i);
  if(m){
    await addTickets(t, parseInt(m[1], 10), source);
  } else if(prizeLabel !== 'Nada'){
    await addPendingPrize(t, prizeLabel, source);
  }
}

// Combates ganados = veces que ha sido campeón final de un torneo (duelHistory).
function combatWinsOf(t){
  return duelHistory.filter(d=> d.champion === t).length;
}
// Compatibilidad reservada para el día en que Tracker Sync publique medallas.
function badgeBitsOf(t){ return (badgeBits[t]||0) & 0xFF; }
function badgeCountOf(t){
  const raw = badgeBitsOf(t); let n = 0;
  for(let i=0;i<GYM_COUNT;i++) if(raw & (1<<i)) n++;
  return n;
}
function milestonesOf(t){
  const raw = badgeBitsOf(t);
  return Array.from({length:GYM_COUNT}, (_,i)=>!!(raw & (1<<i)));
}
function milestoneCountOf(t){ return badgeCountOf(t); }
// Level cap vigente: el nivel más alto del próximo líder de gimnasio.
function currentLevelCap(t){
  if(!trackerBadgesAvailable[t]) return null;
  const badges = milestonesOf(t);
  let best = null;
  badges.forEach((earned, i) => { if(!earned){ const g = GAME_LEVEL_CAPS[i]; if(g && (!best || g.cap < best.cap)) best = g; } });
  return best;
}
function levelCapLabelOf(t){
  if(!trackerBadgesAvailable[t]) return 'cap esperando medallas';
  const cap = currentLevelCap(t);
  if(cap) return `Cap Nv.${cap.cap} · ${cap.leader}`;
  return `${GYM_COUNT} medallas · sin cap de gimnasio`;
}
// Pokémon del equipo que se pasan del level cap actual.
function overCapMonsOf(t){
  const cap = currentLevelCap(t);
  if (!cap) return [];
  return allMonsOf(t).filter(m => m.inTeam && !m.fainted && m.level != null && m.level > cap.cap);
}

// Todos los Pokémon de un entrenador: equipo (con su flag de debilitado real)
// + los que estén en cajas (nunca debilitados, eso solo existe en equipo).
// Sirve tanto para "ver un Pokémon en detalle" como para "elegir con cuál ofertar".
function allMonsOf(t){
  if(_allMonsCache[t]) return _allMonsCache[t];
  const manualMap = manualFainted[t]||{};
  const team = (teams[t]||[]).map(p => ({
    pid: p.pid, nickname: p.isEgg ? 'Huevo' : p.nickname, speciesName: p.isEgg ? 'Huevo' : p.species, sprite: p.sprite,
    level: p.isEgg ? null : p.level, metLocationName: p.metLocationName || null, metLevel: p.isEgg ? null : p.metLevel,
    fainted: p.isEgg ? false : (manualMap.hasOwnProperty(p.pid) ? manualMap[p.pid] : !!p.fainted), inTeam: true,
    isEgg: !!p.isEgg, eggScale: p.eggScale || 1, abilityName: p.isEgg ? null : (p.abilityName || null), abilityId: p.isEgg ? null : (p.abilityId ?? null), shiny: p.isEgg ? false : !!p.shiny,
  }));
  const teamPids = new Set(team.map(m=>m.pid));
  const boxMons = Object.entries(collections[t]||{})
    .filter(([pid, m]) => !teamPids.has(pid) && m && m.inTeam === false)
    .map(([pid, m]) => ({
      pid, nickname: m.nickname || m.speciesName, speciesName: m.speciesName, sprite: m.sprite,
      level: null, metLocationName: m.metLocationName || null, metLevel: m.metLevel,
      fainted: manualMap.hasOwnProperty(pid) ? manualMap[pid] : !!m.fainted, inTeam: false, box: m.box || null, boxName: m.boxName || null,
      abilityName: m.abilityName || null, abilityId: m.abilityId ?? null, shiny: !!m.shiny,
    }));
  _allMonsCache[t] = [...team, ...boxMons];
  return _allMonsCache[t];
}
function availableMonsOf(t){

function getMedalRanking(){

    return hearts[b] - hearts[a];

/* ================================================================
   RIVALIDADES — cara a cara entre dos entrenadores, contando cada
   combate individual (Combate 1 y Final) de cada torneo jugado.
   ================================================================ */
// Devuelve la lista de ganadores de todos los combates directos entre a y b,
// del más reciente al más antiguo (duelHistory ya está ordenado así).
function headToHeadMatches(a, b){
  const winners = [];
  duelHistory.forEach(d=>{
    [d.match1, d.final].forEach(m=>{
      if(!m || !m.winner) return;
      if((m.p1===a && m.p2===b) || (m.p1===b && m.p2===a)) winners.push(m.winner);
    });
  });
  return winners;
}
function headToHeadTally(a, b){
  const winners = headToHeadMatches(a, b);
  const wins = { [a]:0, [b]:0 };
  winners.forEach(w=> wins[w]++);
  return { wins, winners, total: winners.length };
}
// Racha actual dentro de ese cara a cara concreto (ganador de los últimos combates seguidos)
function headToHeadStreak(winners){
  if(winners.length === 0) return null;
  const leader = winners[0];
  let count = 0;
  for(const w of winners){ if(w===leader) count++; else break; }
  return count >= 2 ? { winner: leader, count } : null;
}
const TRAINER_PAIRS = [['iker','joel'], ['iker','alex'], ['joel','alex']].filter(([a,b])=> TRAINERS.includes(a) && TRAINERS.includes(b));

function renderRivalryLine(a, b){
  const { wins, total } = headToHeadTally(a, b);
  const ratings = computeElo().R;
  const pa = Math.round(100 * eloExpected(ratings[a], ratings[b]));
  const swingA = Math.round(ELO_K_COMBAT * (1 - eloExpected(ratings[a], ratings[b])));
  const swingB = Math.round(ELO_K_COMBAT * (1 - eloExpected(ratings[b], ratings[a])));
  const eloLine = `<div class="h2h-line" style="opacity:.9;">⚡ Elo: ${NAMES[a]} ${Math.round(ratings[a])} (${pa}%) · ${NAMES[b]} ${Math.round(ratings[b])} (${100 - pa}%)</div>
    <div class="h2h-line" style="opacity:.8;">En juego: gana ${NAMES[a]} +${swingA} (2-0: +${Math.round(swingA * ELO_MARGIN_20)}) · gana ${NAMES[b]} +${swingB} (2-0: +${Math.round(swingB * ELO_MARGIN_20)}); quien pierde resta lo mismo.</div>`;
  if(total === 0) return `<div class="h2h-line">⚔️ Primer cara a cara en Kanto entre ${NAMES[a]} y ${NAMES[b]}</div>${eloLine}`;
  return `<div class="h2h-line">⚔️ Histórico: ${NAMES[a]} ${wins[a]} - ${wins[b]} ${NAMES[b]}</div>${eloLine}`;
}

function renderRivalriesCard(){
  const rows = TRAINER_PAIRS.map(([a,b])=>{
    const { wins, winners, total } = headToHeadTally(a, b);
    const streak = headToHeadStreak(winners);
    let tag = '';
    if(total === 0){
      tag = `<div class="rivalry-tag neutral">Todavía no se han enfrentado</div>`;
    } else if(wins[a] === wins[b]){
      tag = `<div class="rivalry-tag close">🔥 Muy reñido</div>`;
    } else {
      const leader = wins[a] > wins[b] ? a : b;
      const diff = Math.abs(wins[a]-wins[b]);
      tag = `<div class="rivalry-tag lead">👑 ${NAMES[leader]} domina${diff>=2?' claramente':''}</div>`;
    }
    const kryptonite = streak && streak.count >= 3
      ? `<div class="rivalry-kryptonite">🐍 ${NAMES[streak.winner]} es la kryptonita de ${NAMES[[a,b].find(p=>p!==streak.winner)]} (${streak.count} seguidas)</div>`
      : '';
    const leaderName = total>0 ? (wins[a]>=wins[b] ? a : b) : null;
    return `
      <div class="rivalry-card ${total>0 && wins[a]!==wins[b] ? 'has-leader':''}">
        <div class="rivalry-score">
          <span class="rv-name ${leaderName===a?'rv-lead':''}">${NAMES[a]}</span>
          <span class="rv-pill">${wins[a]} - ${wins[b]}</span>
          <span class="rv-name ${leaderName===b?'rv-lead':''}">${NAMES[b]}</span>
        </div>
        ${tag}
        ${kryptonite}
      </div>
    `;
  }).join('');

  return `
    <div class="section-sub" style="text-align:center;margin-bottom:14px;">Rivalidades</div>
    <div class="rivalries-wrap">${rows}</div>
  `;
}

/* ---------------- Tiempo sin Joel ----------------
   Cuenta desde la ultima actualizacion del Tracker Sync de Joel (snapshot.updated, en
   segundos): solo cuenta que su PARTIDA avance. No se mira el casino ni nada de la web,
   porque alguien podria entrar por error en su perfil. */
function joelLastActivityMs(){
  const snap = trackerSnapshots.joel;
  const u = snap ? Number(snap.updated) : NaN;
  return Number.isFinite(u) && u > 0 ? u * 1000 : 0;
}
function fmtSinceJoel(ms){
  const total = Math.floor(ms / 1000);
  const d = Math.floor(total / 86400);
  const h = Math.floor((total % 86400) / 3600);
  const m = Math.floor((total % 3600) / 60);
  const sec = total % 60;
  const two = n => String(n).padStart(2, '0');
  if(d > 0) return `${d}d ${two(h)}h ${two(m)}m ${two(sec)}s`;
  if(h > 0) return `${h}h ${two(m)}m ${two(sec)}s`;
  return `${m}m ${two(sec)}s`;
}
function updateSinJoel(){
  const el = document.getElementById('sin-joel-time');
  if(!el) return;
  const last = joelLastActivityMs();
  if(!last){ el.textContent = '—'; el.dataset.level = ''; return; }
  const ms = Math.max(0, Date.now() - last);
  el.textContent = fmtSinceJoel(ms);
  el.dataset.level = ms < 30 * 60e3 ? 'ok' : ms < 3 * 3600e3 ? 'warn' : 'bad';
}

// Categorías del historial: mapea el emoji con el que ya empieza cada línea
// (puesto por pushHistory/push_history) a un filtro legible. Cualquier
// prefijo no listado cae en "Otros" -- no hace falta mantener esto muy
// exhaustivo, solo cubre lo que más se acumula.
const HISTORY_CATEGORIES = [
  { key: 'hito',     label: '🏆 Hitos',        prefixes: ['🏆'] },
  { key: 'medallas', label: '🏅 Medallas',     prefixes: ['🏅'] },
  { key: 'vidas',    label: '💔 Vidas',        prefixes: ['💔'] },
  { key: 'capturas', label: '🆕 Capturas',     prefixes: ['🆕', '✨', '🔺'] },
  { key: 'trades',   label: '🔄 Intercambios', prefixes: ['🔄', '🤝', '🔁'] },
  { key: 'casino',   label: '🎰 Casino',       prefixes: ['🎟️', '🎉', '🎁'] },
  { key: 'duelos',   label: '⚔️ Duelos',       prefixes: ['⚔️', '💀'] },
  { key: 'otros',    label: '📋 Otros',        prefixes: [] },
];
function historyCategoryOf(text){
  for(const c of HISTORY_CATEGORIES){
    if(c.prefixes.some(p => text.startsWith(p))) return c.key;
  }
  return 'otros';
}
function historyDayLabel(ts){
  const d = new Date(ts);
  const today = new Date();
  const yesterday = new Date(Date.now() - 86400000);
  const sameDay = (a,b) => a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
  if(sameDay(d, today)) return 'Hoy';
  if(sameDay(d, yesterday)) return 'Ayer';
  return d.toLocaleDateString('es-ES', {day:'2-digit', month:'long', year: d.getFullYear()!==today.getFullYear() ? 'numeric' : undefined});
}

let historyTab = 'news'; // 'news' | 'cemetery'
let historyFilter = 'all';
let historySearch = '';
function setHistoryTab(tab){
  historyTab = tab;

function renderHistoryListOnly(){

  // repintamos la lista, no toda la vista (que sí hace render() completo).
  const listEl = document.getElementById('history-list-wrap');

}
function historyTextForDisplay(text){
  const raw = String(text || '');
  if(!raw.startsWith('🆕') && !raw.startsWith('✨')) return raw;
  return raw.replace(/#(\d{1,3})\b/g, (match, dex) => SPECIES_NAMES[Number(dex)] || match);
}
function historyItemHtml(e){
  const time = new Date(e.ts).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
  const med = medalEventOf(e);
  if(med){
    ensureMedalSpriteStyle();

    const gym = GAME_LEVEL_CAPS[med.index];
    return `<div class="history-item medal-item" style="--mc:${b.color}">

        </span>
        <span class="h-time mono">${time}</span>
      </div>`;
  }
  return `
      <div class="history-item">
        <span class="h-text">${historyTextForDisplay(e.text)}</span>
        <span class="h-time mono">${time}</span>
      </div>`;
}
function buildHistoryListHtml(){
  const q = historySearch.trim().toLowerCase();
  const filtered = history.filter(e => {
    if(historyFilter !== 'all' && historyCategoryOf(e.text) !== historyFilter) return false;
    if(q && !historyTextForDisplay(e.text).toLowerCase().includes(q)) return false;
    return true;
  });
  if(filtered.length === 0){
    return '<div class="empty-state">Nada por aquí con ese filtro.</div>';
  }
  // agrupamos por día, conservando el orden (el array ya viene del más
  // reciente al más antiguo desde pushHistory.unshift).
  const groups = [];
  let currentLabel = null, currentArr = null;
  filtered.forEach(e=>{
    const label = historyDayLabel(e.ts);
    if(label !== currentLabel){
      currentLabel = label;
      currentArr = [];
      groups.push({ label, items: currentArr });
    }
    currentArr.push(e);
  });
  return groups.map(g => `
    <div class="history-day-label">${g.label}</div>
    ${g.items.map(e => historyItemHtml(e)).join('')}
  `).join('');
}
function renderHistory(app){

  if(history.length === 0){
    app.innerHTML = tabsHtml + '<div class="empty-state">Aún no hay nada en el historial.</div>';
    return;
  }
  const presentCats = new Set(history.map(e=>historyCategoryOf(e.text)));
  const chips = [{key:'all', label:'Todo'}, ...HISTORY_CATEGORIES.filter(c=>presentCats.has(c.key))];
  app.innerHTML = tabsHtml + `

// ===== Cementerio: fechas y sitios de "muerte" de coña =====
// El juego casi nunca informa de dónde/cuándo murió un Pokémon de verdad
// (diedAtLocation casi siempre viene vacío), así que en vez de dejarlo en
// blanco le inventamos algo random -- pero SIEMPRE la misma broma para la
// misma lápida (hash determinista sobre sus propios datos), para que no
// cambie cada vez que se re-pinta la pantalla.
const DEATH_JOKE_DATES = [
  '11 de septiembre', '28 de diciembre (Día de los Santos Inocentes)', 'Viernes 13',
  'Nochevieja, a las 23:59', 'un 29 de febrero que no tocaba', '1 de abril',
  'el día del examen final', 'justo antes de evolucionar', 'a las 3 de la mañana sin motivo',
  'durante la final del Mundial', 'el día que subió la luz', 'cuando cortaron la wifi de casa',
  'un martes cualquiera de room2', 'el día que Windows se actualizó solo',
  'hace exactamente 3 años, 2 meses y 14 días', 'justo al cobrar la paga (qué desperdicio)',
  'el mismo día que se estrenó la temporada nueva', 'en pleno directo',
];
const DEATH_JOKE_LOCATIONS = [
  'Nigeria', 'Níger', "Ca n'Anglada", 'Parc Vallès', 'Sabadell', 'Torrequebrada',
  'Torredelosnabos', 'Ascent', 'Bind', 'mid de Ascent', 'larga de Pearl',
  'Heavy Rain City', 'Ciudad Comercio', 'Pueblo Tomate',
];
function jokeHash(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) | 0; }
  return Math.abs(h);
}
function jokeDeathDetails(tomb){
  const seed = `${tomb.trainer}|${tomb.nickname}|${tomb.speciesName}|${tomb.diedAt}`;
  const h = jokeHash(seed);
  const date = DEATH_JOKE_DATES[h % DEATH_JOKE_DATES.length];
  const loc = DEATH_JOKE_LOCATIONS[Math.floor(h/7) % DEATH_JOKE_LOCATIONS.length];
  return { date, loc };
}

let cemeteryTopIndex = 0; // qué lápida está arriba del todo de la baraja ahora mismo
let cemeteryAnimating = false; // true mientras una lápida está volando fuera de pantalla

function dismissTomb(cardId){
  if(cemeteryAnimating) return;
  const el = document.getElementById(cardId);

  cemeteryAnimating = true;
  el.classList.add('exiting');
  playSound('cardFlip');
  setTimeout(()=>{
    cemeteryTopIndex++;
    cemeteryAnimating = false;
    render();
  }, 420);
}

function renderCemeteryTab(app, tabsHtml){
  const all = TRAINERS.flatMap(t => (graveyard[t]||[]).map(g => ({...g, trainer: t})))
    .sort((a,b) => b.diedAt - a.diedAt);
  if(all.length === 0){
    app.innerHTML = tabsHtml + '<div class="empty-state">Todavía no ha caído ninguno. 🙏</div>';
    return;
  }
  if(cemeteryTopIndex >= all.length){
    app.innerHTML = tabsHtml + `
      <div class="section-label">🪦 Cementerio (${all.length})</div>
      <div class="empty-state">Has repasado a todos los caídos. 🙏<br><span style="font-size:11px;opacity:.7;">(vuelve a entrar en esta pestaña para verlos otra vez)</span></div>
    `;
    return;
  }
  const visible = all.slice(cemeteryTopIndex, cemeteryTopIndex + 5); // solo pintamos 5 en el DOM, de sobra para el efecto
  app.innerHTML = tabsHtml + `
    <div class="section-label">🪦 Cementerio (${all.length - cemeteryTopIndex} por ver)</div>
    <div class="tomb-stack-wrap">
      ${visible.map((g, depth)=>{
        const { date, loc } = jokeDeathDetails(g);
        const cardId = `tomb-card-${cemeteryTopIndex + depth}`;
        const isTop = depth === 0;
        const offset = depth * 10;
        const rotate = depth === 0 ? 0 : (depth % 2 === 0 ? 1 : -1) * (depth * 1.5);
        const style = `transform: translateY(${offset}px) scale(${1 - depth*0.04}) rotate(${rotate}deg); z-index:${100-depth};`;
        return `
          <div id="${cardId}" class="tomb-card" style="${style}" ${isTop ? `onclick="dismissTomb('${cardId}')"` : ''}>
            <div class="tomb-card-rip">R · I · P</div>
            <img loading="lazy" src="${g.sprite}" alt="${g.speciesName}">
            <div class="tomb-card-name">${g.nickname}</div>
            <div class="tomb-card-species">${g.speciesName.replace(/-/g,' ')} · Nv.${g.level}</div>
            <div class="tomb-card-trainer">${NAMES[g.trainer]}</div>
            <div class="tomb-card-divider"></div>
            <div class="tomb-card-line">📅 <b>${date}</b></div>
            <div class="tomb-card-line">📍 <b>${loc}</b></div>
            ${isTop ? '<div class="tomb-card-tap">Toca para pasar a la siguiente</div>' : ''}
          </div>
        `;
      }).join('')}
    </div>
    <div class="tomb-stack-hint">${all.length - cemeteryTopIndex} lápida${all.length-cemeteryTopIndex===1?'':'s'} en el mazo</div>
  `;
}

// Devuelve una pregunta que este perfil aun no ha contestado (o null).
async function pickGiovanniQuestion(t){
  const done = await storeGet('locke:quiz:' + t, []);
  if(done === STORE_FETCH_FAILED || !Array.isArray(done)) return null;
  const answered = new Set(done.map(a => a.qid));
  const left = GIOVANNI_QUIZ.filter(q => !answered.has(q.id));
  if(!left.length) return null;
  return { question: left[Math.floor(Math.random() * left.length)], done };
}

// Máximo una tirada al día por perfil (día natural en hora de Madrid): se gaste o no
// la pregunta, ese día no se vuelve a tirar. Se guarda en el backend para que valga
// desde cualquier dispositivo.
function quizTodayKey(){
  return new Intl.DateTimeFormat('sv-SE', { timeZone:'Europe/Madrid' }).format(new Date());
}
async function giovanniDailyRoll(t){
  const key = 'locke:quizRoll:' + t;
  const today = quizTodayKey();
  const last = await storeGet(key, null);
  if(last === STORE_FETCH_FAILED) return false; // sin saber si ya tiró hoy, mejor no tirar
  if(last === today) return false;
  await storeSet(key, today);
  return Math.random() < GIOVANNI_QUIZ_CHANCE;
}

async function answerGiovanniQuiz(i){
  const q = giovanniQuizCurrent;
  if(!q) return;
  giovanniQuizCurrent = null;
  const el = document.getElementById('gq-overlay');
  el.querySelectorAll('.gq-opts button').forEach(b => b.disabled = true);
  const record = { qid:q.id, type:q.type, question:q.q, answer:q.o[i], ts:Date.now() };
  if(q.c !== undefined) record.correct = (i === q.c);
  el.querySelector('.gq-tag').textContent = '';
  const won = record.correct === true;
  const lost = record.correct === false;
  el.querySelector('.gq-q').textContent = won ? `¡Correcto! +${GIOVANNI_QUIZ_TICKETS} tickets. Muchas gracias por contestar.`
    : lost ? `Fallaste: -${GIOVANNI_QUIZ_TICKETS} tickets. Muchas gracias por contestar.`
    : 'Muchas gracias por contestar.';
  el.querySelector('.gq-opts').innerHTML = '<button class="gq-enter" style="grid-column:1/-1" onclick="closeGiovanniQuiz()">Entrar al casino</button>';
  const trainer = giovanniQuizTrainer;
  try{ await storeSet('locke:quiz:' + trainer, [...giovanniQuizDone, record]); }catch(e){}
  if(won || lost){
    try{ await addTickets(trainer, won ? GIOVANNI_QUIZ_TICKETS : -GIOVANNI_QUIZ_TICKETS, (won ? 'acierto' : 'fallo') + ' en el cuestionario de Charizard'); render(); }catch(e){}

function pickWeighted(list){
  const r = Math.random();
  let acc = 0;
  for(const item of list){
    acc += item.chance;
    if(r <= acc) return item;
  }
  return list[list.length-1];
}

  slotMultiplier = n;
  render();

async function pullLever(machineId){
  if(slotSpinning) return;
  const totalCost = SLOT_SPIN_COST * slotMultiplier;
  if((tickets[casinoPlayer]||0) < totalCost){
    slotResultText = `No tienes suficientes tickets (necesitas ${totalCost}).`;
    slotResultClass = 'lose';
    render();
    return;
  }
  slotSpinning = true;
  slotResultText = '';
  slotResultClass = '';
  render();
  playSound('lever');

  // Cobrar el coste total de golpe
  await addTickets(casinoPlayer, -totalCost, `Tirada x${slotMultiplier} de tragaperras`);

  // Se resuelven TODAS las tiradas ya (aunque solo se vea una animación)
  const outcomes = Array.from({length: slotMultiplier}, () => pickWeighted(SLOT_OUTCOMES));
  const mainOutcome = outcomes.find(o => o.type === 'jackpot')
    || outcomes.slice().sort((a,b)=>{
      // para el símbolo de la animación: prioriza el premio más "gordo" que haya salido
      const rank = {jackpot:5, revive:4, egg:3, capture:2, curse:1, nothing:0};
      return rank[b.type]-rank[a.type];
    })[0];

  // Animación: cada carrete cambia de símbolo rápido y va parando en cascada
  const finalSymbols = mainOutcome.symbol
    ? [mainOutcome.symbol, mainOutcome.symbol, mainOutcome.symbol]
    : [
        SLOT_FILLER_SYMBOLS[Math.floor(Math.random()*SLOT_FILLER_SYMBOLS.length)],
        SLOT_FILLER_SYMBOLS[Math.floor(Math.random()*SLOT_FILLER_SYMBOLS.length)],
        SLOT_FILLER_SYMBOLS[Math.floor(Math.random()*SLOT_FILLER_SYMBOLS.length)]
      ];
  // Evitar que "nada" salga igual en los 3 por casualidad (para que se lea bien como "no premio")
  if(!mainOutcome.symbol && finalSymbols[0]===finalSymbols[1] && finalSymbols[1]===finalSymbols[2]){
    finalSymbols[2] = SLOT_FILLER_SYMBOLS.find(s=>s!==finalSymbols[0]) || finalSymbols[2];
  }

  const allSymbols = [...SLOT_FILLER_SYMBOLS, '👑','🥚','❤️‍🩹','🎁','💀'];
  const spinTimers = [];
  [0,1,2].forEach((reelIdx)=>{
    const timer = setInterval(()=>{
      const el = document.getElementById(`slot-reel-${reelIdx}`);
      if(el) el.textContent = allSymbols[Math.floor(Math.random()*allSymbols.length)];
    }, 55);
    spinTimers.push(timer);
  });

  const stopDelays = [400, 650, 900];
  stopDelays.forEach((delay, reelIdx)=>{
    setTimeout(()=>{
      clearInterval(spinTimers[reelIdx]);
      const el = document.getElementById(`slot-reel-${reelIdx}`);
      if(el){
        el.textContent = finalSymbols[reelIdx];
        el.classList.remove('spinning');
        el.classList.remove('landed');
        void el.offsetWidth;
        el.classList.add('landed');
      }
      slotReels[reelIdx] = finalSymbols[reelIdx];
      playSound('reelStop');
    }, delay);
  });

  setTimeout(async ()=>{
    slotSpinning = false;
    if(slotMultiplier === 1){
      await resolveSingleSlotOutcome(machineId, outcomes[0]);
    } else {
      await resolveMultiSlotOutcomes(machineId, outcomes);
    }
  }, 1000);
}

async function resolveMultiSlotOutcomes(machineId, outcomes){
  const machine = SLOT_MACHINES.find(m=>m.id===machineId);
  const tally = {};
  outcomes.forEach(o => { tally[o.type] = (tally[o.type]||0) + 1; });

  const jackpotCount = tally.jackpot || 0;
  const curseCount = tally.curse || 0;
  const captureCount = tally.capture || 0;
  const eggCount = tally.egg || 0;
  const reviveCount = tally.revive || 0;
  const capsuleCount = tally.capsule || 0;

  // Aplicar efectos agregados (secuencial para no pisarse entre tickets/premios)
  for(let i=0;i<captureCount;i++) await addPendingPrize(casinoPlayer, '1 captura extra', 'Tragaperras x' + slotMultiplier + ' · ' + machine.name);
  for(let i=0;i<eggCount;i++) await addPendingPrize(casinoPlayer, 'Huevo random', 'Tragaperras x' + slotMultiplier + ' · ' + machine.name);
  for(let i=0;i<reviveCount;i++) await addPendingPrize(casinoPlayer, 'Revivir un Pokémon muerto a elegir', 'Tragaperras x' + slotMultiplier + ' · ' + machine.name);
  for(let i=0;i<capsuleCount;i++) await addPendingPrize(casinoPlayer, 'Cápsula Habilidad', 'Tragaperras x' + slotMultiplier + ' · ' + machine.name);
  if(curseCount > 0) await addTickets(casinoPlayer, -5*curseCount, `Mala suerte x${curseCount} en la tragaperras`);

  if(jackpotCount > 0) fireConfetti({ count: 180 });
  playSound(jackpotCount>0 ? 'jackpot' : (captureCount+eggCount+reviveCount+capsuleCount)>0 ? 'win' : 'lose');

  const order = ['jackpot','revive','capsule','egg','capture','curse','nothing'];
  const rows = order.filter(t => tally[t] > 0).map(t=>{
    const def = SLOT_OUTCOMES.find(o=>o.type===t);
    const extra = t==='curse' ? ` (−${5*tally[t]} tickets)` : '';
    return `<div class="news-item"><span class="news-text">${def.symbol||'❌'} ${def.label}${extra}</span><span class="news-time">x${tally[t]}</span></div>`;
  }).join('');

  openModal(`
    <h3>🎰 Resultado de ${slotMultiplier} tiradas</h3>
    <div class="news-list">${rows}</div>
    <div class="modal-actions">
      <button class="primary" onclick="closeModal()">Vale</button>
    </div>
  `);
  slotResultText = '';
  slotResultClass = '';
  render();

  if(jackpotCount > 0){
    slotJackpotQueue = jackpotCount - 1;
    slotJackpotMachine = machineId;
    slotJackpotRotation = 0;
    casinoModeLine = pickLine(JACKPOT_LINES);
    render();
  }
}

function spinJackpotWheel(){
  if(slotJackpotSpinning) return;
  const machine = SLOT_MACHINES.find(m=>m.id===slotJackpotMachine);
  const legendaries = machine.legendaries;
  slotJackpotSpinning = true;
  render();

  const idx = Math.floor(Math.random()*legendaries.length);
  const segAngle = 360/legendaries.length;
  const center = idx*segAngle + segAngle/2;
  const fullSpins = 5 + Math.floor(Math.random()*2);
  const target = fullSpins*360 + (360-center);
  slotJackpotRotation += target;
  playSound('spin');

  const wheelEl = document.getElementById('jackpot-wheel');
  if(wheelEl){
    wheelEl.style.transition = 'transform 4.2s cubic-bezier(0.15, 0.85, 0.25, 1)';
    void wheelEl.offsetWidth;
    wheelEl.style.transform = `rotate(${slotJackpotRotation}deg)`;
  }

  setTimeout(async ()=>{
    slotJackpotSpinning = false;
    const won = legendaries[idx];
    playSound('bigwin');
    fireConfetti({ count: 200 });
    await addPendingPrize(casinoPlayer, `Legendario: ${won}`, 'Jackpot tragaperras · ' + machine.name);
    if(slotJackpotQueue > 0){
      // quedan mas jackpots de la misma tirada multiple: se gira otra vez
      slotJackpotQueue -= 1;
      slotJackpotRotation = 0;
      slotResultText = '';
      slotResultClass = '';
      render();
      return;
    }
    slotJackpotMachine = null;
    casinoMachine = null;
    slotResultText = '';
    slotResultClass = '';
    render();
  }, 4300);
}

function rouletteGradient(){
  const segAngle = 360/ROULETTE_WHEEL_ORDER.length;
  const stops = ROULETTE_WHEEL_ORDER.map((n,i)=>{
    const c = rouletteColorOf(n);
    const color = c==='green' ? '#2e8b57' : (c==='red' ? 'var(--roulette-red)' : 'var(--roulette-black)');
    return `${color} ${i*segAngle}deg ${(i+1)*segAngle}deg`;
  }).join(', ');
  return `conic-gradient(${stops})`;
}

// Líneas divisorias finas entre casillas, para que la rueda se vea currada y no plana
function rouletteDividerGradient(){
  const segAngle = 360/ROULETTE_WHEEL_ORDER.length;
  const stops = ROULETTE_WHEEL_ORDER.map((n,i)=>{
    const start = i*segAngle;
    return `transparent ${start}deg ${start+segAngle-0.55}deg, rgba(0,0,0,0.5) ${start+segAngle-0.55}deg ${start+segAngle}deg`;
  }).join(', ');
  return `conic-gradient(${stops})`;
}

function rouletteNumbersHTML(){
  const segAngle = 360/ROULETTE_WHEEL_ORDER.length;
  const radius = 104; // distancia desde el centro, ajustada al radio de la rueda
  return ROULETTE_WHEEL_ORDER.map((n,i)=>{
    const angle = i*segAngle + segAngle/2;
    const bet = rouletteBets.find(b=>b.type==='number' && b.value===n);
    const chip = bet ? `<span class="wheel-chip" title="${bet.amount} tickets en el ${n}">${bet.amount}</span>` : '';
    return `<span class="roulette-number" style="transform: translate(-50%,-50%) rotate(${angle}deg) translateY(-${radius}px) rotate(${-angle}deg);">${n}${chip}</span>`;
  }).join('');
}

function currentBetTotal(){
  return rouletteBets.reduce((s,b)=>s+b.amount, 0);
}
function hasBet(type, value){
  return rouletteBets.some(b=>b.type===type && b.value===value);
}
function betChipHTML(type, value){
  const bet = rouletteBets.find(b=>b.type===type && b.value===value);
  if(!bet) return '';
  const valueArg = type==='number' ? value : `'${value}'`;
  return `<span class="chip-token" onclick="event.stopPropagation(); removeBet('${type}', ${valueArg})" title="Quitar esta apuesta">${bet.amount}</span>`;
}

function setChipValue(v){
  rouletteChipValue = v;
  render();
}
function placeBet(type, value){
  if(rouletteSpinning) return;
  const existing = rouletteBets.find(b=>b.type===type && b.value===value);
  if(existing){ existing.amount += rouletteChipValue; }
  else { rouletteBets.push({ id: crypto.randomUUID(), type, value, amount: rouletteChipValue }); }
  render();
}
function removeBet(type, value){
  if(rouletteSpinning) return;
  rouletteBets = rouletteBets.filter(b=>!(b.type===type && b.value===value));
  render();
}
function clearBets(){
  if(rouletteSpinning) return;
  rouletteBets = [];
  render();
}

async function spinRoulette(){
  if(rouletteSpinning) return;
  if(rouletteBets.length === 0){
    rouletteResultText = 'Coloca al menos una ficha antes de girar.';
    rouletteResultClass = 'lose';
    render();
    return;
  }
  const total = currentBetTotal();
  if((tickets[casinoPlayer]||0) < total){
    rouletteResultText = `No tienes suficientes tickets para esas apuestas (necesitas ${total}).`;
    rouletteResultClass = 'lose';
    render();
    return;
  }

  const betsAtSpinTime = rouletteBets.map(b=>({...b})); // instantánea: se juegan estas, aunque luego se vacíe rouletteBets
  rouletteSpinning = true;
  rouletteResultText = '';
  rouletteResultClass = '';
  render();
  playSound('spin');

  await addTickets(casinoPlayer, -total, 'Apuesta en la ruleta');

  const winIdx = Math.floor(Math.random()*ROULETTE_WHEEL_ORDER.length);
  const winNumber = ROULETTE_WHEEL_ORDER[winIdx];
  const winColor = rouletteColorOf(winNumber);

  const segAngle = 360/ROULETTE_WHEEL_ORDER.length;
  const center = winIdx*segAngle + segAngle/2;
  const fullSpins = 6 + Math.floor(Math.random()*3); // 6, 7 u 8 vueltas completas
  const deltaToPointer = ((360 - center) % 360);
  const target = rouletteWheelAngle + fullSpins*360 + deltaToPointer;

  const wheelEl = document.getElementById('roulette-wheel');
  if(wheelEl){
    wheelEl.classList.add('spinning-disc');
    void wheelEl.offsetWidth;
    wheelEl.style.transform = `translateX(-50%) rotate(${target}deg)`;
  }

  setTimeout(async ()=>{
    rouletteSpinning = false;
    rouletteWheelAngle = target;
    rouletteLastResult = winNumber;
    rouletteBets = []; // ya se han jugado

    let totalPayout = 0;
    const winningLines = [];
    betsAtSpinTime.forEach(b=>{
      if(b.type==='number' && b.value===winNumber){
        const pay = b.amount*35;
        totalPayout += pay;
        winningLines.push(`Nº${b.value} +${pay}`);
      } else if(b.type==='color' && b.value===winColor){
        const mult = winColor==='green' ? 14 : 2;
        const pay = b.amount*mult;
        totalPayout += pay;
        winningLines.push(`${b.value==='red'?'Rojo':b.value==='black'?'Negro':'Verde'} +${pay}`);
      }
    });

    playSound('wheelLand');
    const colorLabel = winColor==='red'?'rojo':winColor==='black'?'negro':'verde';
    if(totalPayout > 0){
      rouletteResultText = `🎉 Salió el ${winNumber} (${colorLabel}) · Aciertos: ${winningLines.join(', ')} · ¡Ganas ${totalPayout} tickets en total! ${pickLine(WIN_REACTIONS)}`;
      rouletteResultClass = 'win';
      playSound(totalPayout >= 100 ? 'bigwin' : 'win');
      fireConfetti({ count: totalPayout >= 100 ? 180 : 100 });
      await addTickets(casinoPlayer, totalPayout, 'Premio de la ruleta');
    } else {
      rouletteResultText = `Salió el ${winNumber} (${colorLabel}). Ninguna de tus apuestas ha acertado. ${pickLine(LOSE_REACTIONS)}`;
      rouletteResultClass = 'lose';
      playSound('lose');
    }
    if(wheelEl) wheelEl.classList.remove('spinning-disc');
    render();
  }, 3000);
}

async function bjStand(){

async function bjDouble(){
  if(bjDealing || bjState.phase!=='playing' || bjState.playerCards.length!==2) return;
  if((tickets[casinoPlayer]||0) < bjBetAmount){ toast('No tienes suficientes tickets para doblar.'); return; }

  bjBetAmount *= 2;
  bjState.playerCards.push(drawCard());
  render();
  const val = bjHandValue(bjState.playerCards);
  if(val > 21){

function bjSleep(ms){ return new Promise(r=>setTimeout(r, ms)); }
async function bjPlayDealer(){
  bjState.hideDealer = false;
  render();
  await bjSleep(500);
  while(bjHandValue(bjState.dealerCards) < 17){
    bjState.dealerCards.push(drawCard());
    render();
    await bjSleep(550);
  }
  const pVal = bjHandValue(bjState.playerCards);
  const dVal = bjHandValue(bjState.dealerCards);
  if(dVal > 21){
    const payout = bjBetAmount * 2;
    bjState.resultText = `¡El crupier se pasa (${dVal})! Ganas → +${payout} tickets.`;
    bjState.resultClass = 'win';
    await addTickets(casinoPlayer, payout, 'Victoria en blackjack');
    playSound('win');

    const payout = bjBetAmount * 2;
    bjState.resultText = `¡Ganas! ${pVal} contra ${dVal} → +${payout} tickets.`;
    bjState.resultClass = 'win';
    await addTickets(casinoPlayer, payout, 'Victoria en blackjack');
    playSound('win');
  } else if(pVal < dVal){
    bjState.resultText = `Pierdes. ${pVal} contra ${dVal}.`;
    bjState.resultClass = 'lose';
    playSound('lose');
  } else {
    bjState.resultText = `Empate a ${pVal}. Recuperas tus ${bjBetAmount} tickets.`;
    bjState.resultClass = 'push';
    await addTickets(casinoPlayer, bjBetAmount, 'Empate en blackjack');
    playSound('coin');
  }
  bjState.phase = 'result';
}

function setMinesChip(v){ minesChipValue = v; render(); }
function minesAddChip(){
  minesBetAmount = (minesBetAmount||0) + minesChipValue;
  render();
}
function minesClearBet(){ minesBetAmount = 0; render(); }
function setMinesCount(n){ minesCount = n; render(); }

async function minesStartRound(){
  const bet = minesBetAmount||0;
  if(bet <= 0){ toast('Elige una apuesta primero.'); return; }
  if((tickets[casinoPlayer]||0) < bet){ toast('No tienes suficientes tickets.'); return; }
  await addTickets(casinoPlayer, -bet, `Apuesta en Mines (${minesCount} minas)`);
  const grid = Array(MINES_GRID_SIZE).fill(false);
  const mineIdxs = new Set();
  while(mineIdxs.size < minesCount) mineIdxs.add(Math.floor(Math.random()*MINES_GRID_SIZE));
  mineIdxs.forEach(i=>grid[i]=true);
  minesState = { phase:'playing', grid, revealed: Array(MINES_GRID_SIZE).fill(false), resultText:'', resultClass:'' };
  playSound('spin');
  render();
}

async function minesReveal(idx){
  if(minesState.phase !== 'playing') return;
  if(minesState.revealed[idx]) return;
  minesState.revealed[idx] = true;
  if(minesState.grid[idx]){
    minesState.phase = 'result';
    minesState.resultText = `💥 ¡Mina! Pierdes los ${minesBetAmount} tickets apostados.`;
    minesState.resultClass = 'lose';
    playSound('lose');
    render();
    return;
  }
  playSound('cardFlip');
  const safeRevealed = minesState.revealed.filter((r,i)=>r && !minesState.grid[i]).length;
  const totalSafe = MINES_GRID_SIZE - minesCount;
  if(safeRevealed >= totalSafe){
    await minesCashOut(); // has destapado todas las casillas seguras posibles
    return;
  }
  render();
}

async function minesCashOut(){
  if(minesState.phase !== 'playing') return;
  const safeRevealed = minesState.revealed.filter((r,i)=>r && !minesState.grid[i]).length;
  if(safeRevealed === 0){ toast('Destapa al menos una casilla antes de retirarte.'); return; }
  const mult = minesMultiplier(minesCount, safeRevealed);
  const payout = Math.round(minesBetAmount * mult);
  minesState.phase = 'result';
  minesState.resultText = `Te retiras con x${mult.toFixed(2)} → ¡ganas ${payout} tickets! ${pickLine(WIN_REACTIONS)}`;
  minesState.resultClass = 'win';
  playSound(payout >= minesBetAmount*3 ? 'bigwin' : 'win');
  if(payout >= minesBetAmount*3) fireConfetti({ count: 120 });
  await addTickets(casinoPlayer, payout, `Retirada en Mines (x${mult.toFixed(2)})`);
  render();
}

function setCrashChip(v){ crashChipValue = v; render(); }
function crashAddChip(){ crashBetAmount = (crashBetAmount||0) + crashChipValue; render(); }
function crashClearBet(){ crashBetAmount = 0; render(); }

async function crashStartRound(){
  const bet = crashBetAmount||0;
  if(bet <= 0){ toast('Elige una apuesta primero.'); return; }
  if((tickets[casinoPlayer]||0) < bet){ toast('No tienes suficientes tickets.'); return; }
  await addTickets(casinoPlayer, -bet, 'Apuesta en Crash');
  const crashPoint = crashRollPoint();
  crashState = { phase:'running', multiplier:1.00, crashPoint, cashedOutAt:null, resultText:'', resultClass:'' };
  render();
  playSound('spin');
  const startTime = Date.now();
  crashInterval = setInterval(()=>{
    const elapsed = (Date.now()-startTime)/1000;
    // curva exponencial suave, tarda unos segundos en pillar velocidad
    const mult = Math.pow(Math.E, elapsed*0.18);
    crashState.multiplier = mult;
    if(mult >= crashState.crashPoint){
      clearInterval(crashInterval); crashInterval = null;
      crashState.multiplier = crashState.crashPoint;
      crashState.phase = 'crashed';
      if(crashState.cashedOutAt === null){
        crashState.resultText = `💥 ¡Explotó en x${crashState.crashPoint.toFixed(2)}! Pierdes los ${crashBetAmount} tickets.`;
        crashState.resultClass = 'lose';
        playSound('lose');
      }
      render();
      return;
    }
    crashPaint();
  }, 80);
}

async function crashCashOut(){
  if(crashState.phase !== 'running') return;
  if(crashInterval){ /* la ronda sigue corriendo visualmente hasta que explote, pero ya has cobrado */ }
  const mult = crashState.multiplier;
  const payout = Math.round(crashBetAmount * mult);
  crashState.cashedOutAt = mult;
  crashState.resultText = `Te retiras en x${mult.toFixed(2)} → ¡ganas ${payout} tickets! ${pickLine(WIN_REACTIONS)}`;
  crashState.resultClass = 'win';
  playSound(payout >= crashBetAmount*3 ? 'bigwin' : 'win');
  if(payout >= crashBetAmount*3) fireConfetti({ count: 120 });
  await addTickets(casinoPlayer, payout, `Retirada en Crash (x${mult.toFixed(2)})`);
  render();
}

// ================= PLINKO (rehecho) =================
// Geometría real: cada fila de clavos tiene un clavo MÁS que la anterior y la
// ficha choca siempre con el clavo que tiene justo debajo, rebotando media
// casilla a izquierda o derecha. Tras las 10 filas cae en una de las 11
// casillas (distribución binomial, igual que antes: mismas probabilidades y
// mismos multiplicadores). El resultado se decide ANTES de animar; la
// animación solo lo "cuenta" clavo a clavo.
const PL = { W:480, H:440, S:40, cx:240, y0:56, dy:34, bucketY:392, bucketH:34 };
let plinkoAnim = null; // mientras cae una ficha: { t0, segs, total, bet, player, bucket, paid, lastIdx }
let plinkoRaf = 0;

function setPlinkoChip(v){ if(plinkoDropping) return; plinkoChipValue = v; render(); }
function plinkoPeg(r, k){ return { x: PL.cx + (k - r/2)*PL.S, y: PL.y0 + r*PL.dy }; }

function plinkoBuildAnim(rights){
  const segs = [];
  const first = plinkoPeg(0, 0);
  segs.push({ x0: PL.cx, y0: 12, x1: first.x, y1: first.y - 11, dur: 180, hop: 0, peg: [0, 0] });
  let prev = { x: first.x, y: first.y - 11 };
  let j = 0; // nº de "derechas" acumuladas
  for(let r = 0; r < PLINKO_ROWS; r++){
    if(rights[r]) j++;
    const nx = PL.cx + (j - (r + 1)/2)*PL.S;
    if(r < PLINKO_ROWS - 1){
      const np = plinkoPeg(r + 1, j);
      segs.push({ x0: prev.x, y0: prev.y, x1: nx, y1: np.y - 11, dur: 190, hop: 9, peg: [r + 1, j] });
      prev = { x: nx, y: np.y - 11 };
    } else {
      segs.push({ x0: prev.x, y0: prev.y, x1: nx, y1: PL.bucketY - 6, dur: 210, hop: 9, peg: null });
      prev = { x: nx, y: PL.bucketY - 6 };
    }
  }
  segs.push({ x0: prev.x, y0: prev.y, x1: prev.x, y1: PL.bucketY + PL.bucketH/2, dur: 140, hop: 0, peg: null });
  return { segs, total: segs.reduce((n, s) => n + s.dur, 0) };
}
function plinkoPosAt(elapsed){
  let t = elapsed;
  for(let i = 0; i < plinkoAnim.segs.length; i++){
    const s = plinkoAnim.segs[i];
    if(t <= s.dur){
      const u = Math.max(0, t / s.dur);
      const ex = s.hop ? u*u*(3 - 2*u) : u;
      const x = s.x0 + (s.x1 - s.x0)*ex;
      const y = s.y0 + (s.y1 - s.y0)*(s.hop ? u : u*u) - s.hop*Math.sin(Math.PI*u);
      return { x, y, idx: i };
    }
    t -= s.dur;
  }
  const last = plinkoAnim.segs[plinkoAnim.segs.length - 1];
  return { x: last.x1, y: last.y1, idx: plinkoAnim.segs.length };
}
function plinkoFrame(){
  if(!plinkoAnim) return;
  const el = performance.now() - plinkoAnim.t0;
  const pos = plinkoPosAt(el);
  const chip = document.getElementById('plinko-chip');
  if(chip){ chip.setAttribute('cx', pos.x.toFixed(1)); chip.setAttribute('cy', pos.y.toFixed(1)); }
  // destello del clavo en cuanto la ficha lo toca
  while(plinkoAnim.lastIdx < pos.idx){
    const s = plinkoAnim.segs[plinkoAnim.lastIdx];
    if(s && s.peg){
      const peg = document.getElementById(`pg-${s.peg[0]}-${s.peg[1]}`);
      if(peg){ peg.classList.add('hit'); setTimeout(()=> peg.classList.remove('hit'), 150); }
    }
    plinkoAnim.lastIdx++;
  }
  if(el >= plinkoAnim.total){ plinkoFinish(); return; }
  plinkoRaf = requestAnimationFrame(plinkoFrame);
}
async function plinkoDrop(){
  if(plinkoDropping) return;
  const bet = plinkoChipValue;
  const player = casinoPlayer;
  if((tickets[player]||0) < bet){ toast('No tienes suficientes tickets.'); return; }
  plinkoDropping = true;
  plinkoLastResult = null;
  const rights = Array.from({ length: PLINKO_ROWS }, () => Math.random() < 0.5);
  const bucket = rights.filter(Boolean).length;
  // el descuento se aplica YA (en memoria) y se guarda en segundo plano; el
  // pago se espera a que ese guardado termine para no pisar el perfil.
  const paid = addTickets(player, -bet, 'Ficha en Plinko').catch(()=>{});
  playSound('spin');
  plinkoAnim = { ...plinkoBuildAnim(rights), bet, player, bucket, paid, t0: performance.now(), lastIdx: 0 };
  render();
  cancelAnimationFrame(plinkoRaf);
  plinkoRaf = requestAnimationFrame(plinkoFrame);
}
async function plinkoFinish(){
  const a = plinkoAnim;
  if(!a) return;
  plinkoAnim = null;
  cancelAnimationFrame(plinkoRaf);
  const mult = PLINKO_MULTS[a.bucket];
  const payout = Math.round(a.bet * mult);
  plinkoDropping = false;
  plinkoLastResult = { bucket: a.bucket, mult, payout };
  render();
  if(payout > 0){
    playSound(payout >= a.bet*3 ? 'bigwin' : (payout >= a.bet ? 'win' : 'lose'));
    if(payout >= a.bet*3) fireConfetti({ count: 100 });
  } else {
    playSound('lose');
  }
  await a.paid;
  if(payout > 0) await addTickets(a.player, payout, `Plinko (x${mult})`);
  render();
}

function renderPlinkoTab(){
  const balance = tickets[casinoPlayer]||0;
  const pegs = [];
  for(let r = 0; r < PLINKO_ROWS; r++){
    for(let k = 0; k <= r; k++){
      const p = plinkoPeg(r, k);
      pegs.push(`<circle class="plinko-peg" id="pg-${r}-${k}" cx="${p.x}" cy="${p.y}" r="3.6"/>`);
    }
  }
  const bw = PL.S - 4;
  const buckets = PLINKO_MULTS.map((m, i) => {
    const x = PL.cx + (i - 5)*PL.S - bw/2;
    const won = plinkoLastResult && !plinkoDropping && plinkoLastResult.bucket === i;
    return `<g class="pl-bucket ${m>=3?'hi':m>=1?'mid':'lo'} ${won?'win':''}"><rect x="${x}" y="${PL.bucketY}" width="${bw}" height="${PL.bucketH}" rx="4"/><text x="${x + bw/2}" y="${PL.bucketY + 21}">${m}x</text></g>`;
  }).join('');
  let chip = '';
  if(plinkoAnim){
    const pos = plinkoPosAt(performance.now() - plinkoAnim.t0);
    chip = `<circle id="plinko-chip" class="plinko-chip" cx="${pos.x.toFixed(1)}" cy="${pos.y.toFixed(1)}" r="7.5"/>`;
  }
  return `
    <div class="casino-mode-line">${casinoModeLine}</div>
    <div class="plinko-wrap">
      <svg class="plinko-svg" viewBox="0 0 ${PL.W} ${PL.H}" role="img" aria-label="Tablero de Plinko">
        <defs><radialGradient id="plChipGrad" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#ff4d3d"/></radialGradient></defs>
        ${pegs.join('')}${buckets}${chip}
      </svg>
      <div class="plinko-hint">Cada clavo es un 50/50 · 10 filas · 11 casillas</div>
    </div>
    <div class="bet-panel" style="max-width:420px;">
      <div class="bet-panel-header">Fichas de ${NAMES[casinoPlayer]} · 🎟️ ${balance}</div>
      <div class="chip-selector">
        ${PLINKO_CHIP_VALUES.map(v=>`<div class="chip-denom ${v===plinkoChipValue?'active':''}" onclick="setPlinkoChip(${v})"><span>${v}</span></div>`).join('')}
      </div>
      <button class="primary" style="width:100%;margin-top:10px;" ${plinkoDropping?'disabled':''} onclick="plinkoDrop()">🔴 Soltar ficha (${plinkoChipValue} tickets)</button>
    </div>
    ${plinkoLastResult ? `<div class="result-banner ${plinkoLastResult.payout>=plinkoChipValue?'win':'lose'}">Cae en x${plinkoLastResult.mult} → ${plinkoLastResult.payout>0?'ganas':'te quedas con'} ${plinkoLastResult.payout} tickets</div>` : ''}
  `;
}

async function buyLotteryTicket(qty){
  if(loteriaDrawing) return;
  const err = document.getElementById('loteria-err');
  const cost = LOTERIA_TICKET_COST * qty;
  if((tickets[casinoPlayer]||0) < cost){
    if(err) err.textContent = `No tienes suficientes tickets (necesitas ${cost}).`;
    return;
  }
  if(err) err.textContent = '';
  playSound('ticket');
  await addTickets(casinoPlayer, -cost, `Compra de ${qty} boleto${qty===1?'':'s'} de lotería`);
  for(let i=0;i<qty;i++){
    loteria.entries.push({ id: crypto.randomUUID(), trainer: casinoPlayer, ts: Date.now() });
  }
  loteria.pot += cost;
  pushHistory(`🎫 ${NAMES[casinoPlayer]} compró ${qty} boleto${qty===1?'':'s'} de lotería`);
  render();
  const ok = await saveLoteria();
  if(!ok) queueRetry('loteria', saveLoteria);
}

async function drawLoteria(){
  if(loteriaDrawing) return;
  if(loteria.entries.length===0) return;

  // Instantánea: aunque después se vacíe loteria.entries, esta referencia y sus cálculos se conservan
  const candidates = loteria.entries;
  const counts = {};
  candidates.forEach(e=>{ counts[e.trainer] = (counts[e.trainer]||0)+1; });
  const total = candidates.length;
  const participants = TRAINERS.filter(t=>counts[t]>0);
  let cursor = 0;
  const segs = participants.map(t=>{
    const width = (counts[t]/total)*360;
    const seg = { trainer: t, start: cursor, width };
    cursor += width;
    return seg;
  });

  const winnerEntry = candidates[Math.floor(Math.random()*candidates.length)];
  const winner = winnerEntry.trainer;
  const winnerSeg = segs.find(s=>s.trainer===winner);
  // Punto aleatorio dentro de la porción del ganador, con un pequeño margen para no caer justo en el borde
  const pad = Math.min(3, winnerSeg.width/4);
  const landAngle = winnerSeg.width > pad*2
    ? winnerSeg.start + pad + Math.random()*(winnerSeg.width - pad*2)
    : winnerSeg.start + winnerSeg.width/2;

  loteriaDrawing = true;
  render();
  playSound('spin');

  const fullSpins = 6 + Math.floor(Math.random()*3); // 6, 7 u 8 vueltas completas
  const target = fullSpins*360 + (360-landAngle);

  const wheelEl = document.getElementById('loteria-wheel');
  if(wheelEl){
    wheelEl.style.transition = 'transform 4.6s cubic-bezier(0.13, 0.82, 0.2, 1)';
    void wheelEl.offsetWidth; // forzar reflow para que la transición arranque desde el ángulo actual
    wheelEl.style.transform = `rotate(${target}deg)`;
  }

  setTimeout(async ()=>{
    const amount = loteria.pot;
    const totalEntries = total;

    loteria.history.unshift({ id: crypto.randomUUID(), winner, amount, totalEntries, ts: Date.now() });
    loteria.entries = [];
    loteria.pot = 0;
    loteriaDrawing = false;

    pushHistory(`🎉 ${NAMES[winner]} ganó la lotería: ${amount} tickets (${totalEntries} boleto${totalEntries===1?'':'s'} en juego)`);

    fireConfetti({ count: 200 });

    if(!ok) queueRetry('loteria', saveLoteria);
  }, 4600);
}

  sancionWheelSpinning = false;

function spinSancionWheel(){
  if(sancionWheelSpinning || sancionState.prize) return;
  const outcomes = SANCION_WHEEL;
  sancionWheelSpinning = true;
  render();

  const idx = Math.floor(Math.random()*outcomes.length);
  const segAngle = 360/outcomes.length;
  const center = idx*segAngle + segAngle/2;
  const fullSpins = 5 + Math.floor(Math.random()*2);
  const target = fullSpins*360 + (360 - center);
  sancionWheelRotation += target;
  playSound('spin');

  const wheelEl = document.getElementById('sancion-wheel');
  if(wheelEl){
    wheelEl.style.transition = 'transform 4.2s cubic-bezier(0.15, 0.85, 0.25, 1)';
    void wheelEl.offsetWidth;
    wheelEl.style.transform = `rotate(${sancionWheelRotation}deg)`;
  }

  setTimeout(async ()=>{
    const outcome = outcomes[idx];
    sancionWheelSpinning = false;
    sancionState.prize = outcome.label;
    playSound('wheelLand');
    render();
    const ok = await saveSancion();
    if(!ok) queueRetry('sancion', saveSancion);
  }, 4300);
}

async function closeSancion(){
  pushHistory(`⚖️ ${NAMES[sancionState.offender]} cometió una infracción y le tocó: ${sancionState.prize}`);
  sancionState = { offender:null, prize:null };
  sancionWheelRotation = 0;
  sancionWheelSpinning = false;
  render();
  const ok = await saveSancion();
  if(!ok) queueRetry('sancion', saveSancion);
}

function toLocalInputValue(date){
  const pad = n => String(n).padStart(2,'0');
  return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
}
function endOfWeek(){
  const d = new Date();
  const day = d.getDay(); // 0=domingo
  const diffToSunday = day === 0 ? 0 : 7 - day;
  const end = new Date(d.getFullYear(), d.getMonth(), d.getDate() + diffToSunday, 23, 59);
  return end;
}

function duelArenaPhase(){
  if((duelState.picks || []).length < 2) return { key:'draw', label:'Sorteo', index:0 };
  if(!duelState.match1Winner) return { key:'match1', label:'Combate 1', index:1 };
  if(duelState.bye && !duelState.finalWinner) return { key:'final', label:'Final', index:2 };
  const rewardsDone = duelState.finalWinnerPrize && duelState.finalLoserPrize
    && (!duelState.bye || duelState.match1LoserPrize);
  if(duelState.finalWinner && !rewardsDone) return { key:'rewards', label:'Recompensas', index:3 };
  return { key:'complete', label:'Torneo cerrado', index:4 };
}

const ARENA_MEDAL_MILESTONES = [2, 4, 6, 8];
function arenaMilestoneKey(medals){ return `medals-${medals}`; }
const ARENA_VOTE_KEYS = ['2','4','6','8','post-league'];
function normalizeArenaJourney(raw){
  const completed = Array.isArray(raw?.completed)
    ? raw.completed.filter(value=>[2,4,6,8].includes(Number(value))).map(Number)
    : [];
  const votes = {};
  ARENA_VOTE_KEYS.forEach(k=>{
    const list = raw?.votes?.[k];
    if(Array.isArray(list)){
      const clean = [...new Set(list.filter(t=>TRAINERS.includes(t)))];
      if(clean.length) votes[k] = clean;
    }
  });
  return {
    completed:[...new Set(completed)].sort((a,b)=>a-b),
    winners:ARENA_MEDAL_MILESTONES.reduce((winners, medals)=>{
      const winner = raw?.winners?.[String(medals)];
      if(TRAINERS.includes(winner)) winners[String(medals)] = winner;
      return winners;
    }, {}),
    postLeagueDone:raw?.postLeagueDone === true,
    postLeagueWinner:TRAINERS.includes(raw?.postLeagueWinner) ? raw.postLeagueWinner : null,
    votes,
  };
}
// Votación para adelantar un combate aunque alguien no tenga las medallas.
// key = '2' | '4' | '6' | '8' | 'post-league'. Se adelanta solo si votan los TRES.
function arenaVotesOf(key){
  const list = arenaJourneyState.votes && arenaJourneyState.votes[key];
  return Array.isArray(list) ? list.filter(t=>TRAINERS.includes(t)) : [];
}
function arenaVotedUnanimously(key){
  const votes = arenaVotesOf(key);
  return TRAINERS.every(t=>votes.includes(t));
}
function arenaAllHaveMedals(medals){
  return TRAINERS.every(t=>trackerBadgesAvailable[t] && badgeCountOf(t) >= medals);
}
function arenaReadyForMilestone(medals){
  const index = ARENA_MEDAL_MILESTONES.indexOf(medals);
  if(index < 0 || (index > 0 && !arenaJourneyState.completed.includes(ARENA_MEDAL_MILESTONES[index-1]))) return false;
  return arenaAllHaveMedals(medals) || arenaVotedUnanimously(String(medals));
}
function arenaPostLeagueReady(){
  return arenaJourneyState.completed.includes(8)
    && (arenaAllHaveMedals(8) || arenaVotedUnanimously('post-league'));
}
function arenaVoteBox(key){
  const votes = arenaVotesOf(key);
  return `
    <div class="arena-vote">
      <div class="arena-vote-title">🗳️ Adelantar sin medallas · ${votes.length}/3 votos</div>
      <div class="arena-vote-row">
        ${TRAINERS.map(t=>{
          const on = votes.includes(t);
          return `<button type="button" class="arena-vote-chip ${on?'on':''}" aria-pressed="${on}" onclick="toggleArenaVote('${key}','${t}')">${on?'✓ ':''}${NAMES[t]}</button>`;
        }).join('')}
      </div>
    </div>`;
}
function arenaClearVotes(key){
  if(!arenaJourneyState.votes || !arenaJourneyState.votes[key]) return;
  const votes = { ...arenaJourneyState.votes };
  delete votes[key];
  arenaJourneyState.votes = votes;
}
async function toggleArenaVote(key, trainer){
  if(!TRAINERS.includes(trainer) || !ARENA_VOTE_KEYS.includes(key)) return;
  if(duelState.scheduled){ toast('Termina el torneo actual antes de votar.'); return; }
  const isPost = key === 'post-league';
  const medals = isPost ? null : Number(key);
  const index = isPost ? -1 : ARENA_MEDAL_MILESTONES.indexOf(medals);
  const blocked = isPost
    ? (arenaJourneyState.postLeagueDone || !arenaJourneyState.completed.includes(8))
    : (arenaJourneyState.completed.includes(medals) || (index > 0 && !arenaJourneyState.completed.includes(ARENA_MEDAL_MILESTONES[index-1])));
  if(blocked){ toast('Este combate todavía no se puede votar.'); render(); return; }

  const wantVote = !arenaVotesOf(key).includes(trainer);
  const applyToggle = (state)=>{
    const set = new Set(((state.votes||{})[key]||[]).filter(t=>TRAINERS.includes(t)));
    if(wantVote) set.add(trainer); else set.delete(trainer);
    const votes = { ...(state.votes||{}) };
    if(set.size) votes[key] = [...set]; else delete votes[key];
    state.votes = votes;
    return state;
  };
  applyToggle(arenaJourneyState);
  if(wantVote && arenaVotedUnanimously(key)){
    toast('¡Los tres habéis votado! Combate adelantado 🔥');
    try{ fireConfetti({ count: 60 }); }catch(e){}
  }
  render();

  // Guardado con fusión: leemos lo que haya en la hoja y solo aplicamos NUESTRO voto,
  // para no pisar el voto que otro haya hecho hace un segundo desde su móvil.
  saveInFlight['arenaJourney'] = (saveInFlight['arenaJourney']||0) + 1;
  let ok = false;
  try{
    const remote = await storeGet('locke:arenaJourney', { completed:[], winners:{}, postLeagueDone:false, postLeagueWinner:null, votes:{} });
    if(remote !== STORE_FETCH_FAILED){
      const merged = applyToggle(normalizeArenaJourney(remote));
      ok = await storeSet('locke:arenaJourney', merged);
      if(ok) arenaJourneyState = merged;
    }
  } finally {
    saveInFlight['arenaJourney'] = Math.max((saveInFlight['arenaJourney']||1) - 1, 0);
  }
  if(!ok) queueRetry('arenaJourney', saveArenaJourney);
  render();
}
function renderArenaJourney(){
  const counts = Object.fromEntries(TRAINERS.map(t=>[
    t,
    trackerBadgesAvailable[t] ? badgeCountOf(t) : null,
  ]));
  const completedCount = arenaJourneyState.completed.length;
  const players = TRAINERS.map(t=>`
    <div class="arena-ready-player">
      <span>${NAMES[t]}</span>
      <strong class="${counts[t] !== null && counts[t] >= 2 ? 'ready' : ''}">
        ${counts[t] === null ? 'Esperando Tracker Sync' : `🏅 ${counts[t]}/8`}
      </strong>
    </div>`).join('');
  const stages = ARENA_MEDAL_MILESTONES.map((medals, index)=>{
    const key = arenaMilestoneKey(medals);
    const done = arenaJourneyState.completed.includes(medals);
    const winner = arenaJourneyState.winners[String(medals)]
      || duelHistory.find(entry=>entry.progressionKey === key)?.champion;
    const active = !!duelState.scheduled && duelState.progressionKey === key;
    const ready = arenaReadyForMilestone(medals);
    const voteKey = String(medals);
    const forcedByVote = !arenaAllHaveMedals(medals) && arenaVotedUnanimously(voteKey);
    const prevDone = index === 0 || arenaJourneyState.completed.includes(ARENA_MEDAL_MILESTONES[index-1]);
    const blockers = TRAINERS.filter(t=>counts[t] === null || counts[t] < medals);
    let voteHtml = '';
    let status;
    if(done) status = `<span class="arena-stage-state done">✓ Ganador: ${winner ? NAMES[winner] : 'completado'}</span>`;
    else if(active) status = `<span class="arena-stage-state ready">◷ Torneo programado</span><div>${fmtTime(new Date(duelState.scheduled.datetime).getTime())}</div>`;
    else if(index > 0 && !arenaJourneyState.completed.includes(ARENA_MEDAL_MILESTONES[index-1])){
      status = `<span class="arena-stage-state">🔒 Completa el combate anterior</span>`;
    }else if(blockers.length && !forcedByVote){
      const waitingSync = blockers.filter(t=>counts[t] === null);
      const notThereYet = blockers.filter(t=>counts[t] !== null);
      const messages = [];
      if(waitingSync.length) messages.push(`esperando Tracker Sync: ${waitingSync.map(t=>NAMES[t]).join(', ')}`);
      if(notThereYet.length) messages.push(`${notThereYet.map(t=>`${NAMES[t]} ${counts[t]}/${medals}`).join(' · ')}`);
      status = `<span class="arena-stage-state">🔒 Faltan medallas</span><div>${messages.join('<br>')}</div>`;
      if(prevDone && !duelState.scheduled) voteHtml = arenaVoteBox(voteKey);
    }else if(duelState.scheduled) status = `<span class="arena-stage-state">🔒 Termina el torneo actual</span>`;
    else if(forcedByVote){
      status = `<span class="arena-stage-state ready">● Adelantado por votación</span><div>Los tres habéis votado adelantarlo.</div>`;
      voteHtml = arenaVoteBox(voteKey);
    }
    else status = `<span class="arena-stage-state ready">● Desbloqueado</span><div>Los tres han llegado a ${medals} medallas.</div>`;
    const canStart = ready && !done && !active && !duelState.scheduled;
    return `
      <article class="arena-journey-stage ${done?'completed':''} ${active?'active':''} ${canStart?'unlocked':''}">
        <div class="arena-stage-medal">${medals} medallas</div>
        <div class="arena-stage-title">Combate ${index+1}</div>
        <div class="arena-stage-status">${status}</div>
        ${voteHtml}
        ${canStart ? `<button class="primary arena-stage-action" type="button" onclick="openScheduleDuel('${key}')">Programar torneo</button>` : ''}
      </article>`;
  }).join('');
  const postActive = !!duelState.scheduled && duelState.progressionKey === 'post-league';
  let postStatus;
  if(arenaJourneyState.postLeagueDone){
    const winner = arenaJourneyState.postLeagueWinner
      || duelHistory.find(entry=>entry.progressionKey === 'post-league')?.champion;
    postStatus = `✓ Ganador: ${winner ? NAMES[winner] : 'completado'}`;
  }
  else if(postActive) postStatus = `Torneo programado · ${fmtTime(new Date(duelState.scheduled.datetime).getTime())}`;
  else if(!arenaJourneyState.completed.includes(8)) postStatus = 'Se habilita al completar el torneo de 8 medallas.';
  else if(!arenaPostLeagueReady()) postStatus = 'Esperando a que los tres tengan las 8 medallas.';
  else if(duelState.scheduled) postStatus = 'Termina el torneo actual para abrir Post-liga.';
  else if(!arenaAllHaveMedals(8)) postStatus = 'Adelantada por votación de los tres. Ya podéis abrir el último torneo.';
  else postStatus = 'Los tres tienen 8 medallas. Ya podéis abrir el último torneo.';
  const postVoteHtml = (arenaJourneyState.completed.includes(8) && !arenaJourneyState.postLeagueDone && !postActive && !duelState.scheduled)
    ? arenaVoteBox('post-league') : '';
  const canStartPostLeague = arenaPostLeagueReady() && !arenaJourneyState.postLeagueDone && !postActive && !duelState.scheduled;
  return `
    <section class="arena-journey" aria-labelledby="arena-journey-title">
      <div class="arena-journey-heading">
        <div><div class="arena-journey-kicker">Camino de la Liga · Radical Red</div><h2 class="arena-journey-title" id="arena-journey-title">El recorrido de los tres</h2></div>
        <div class="arena-journey-count"><strong>${completedCount}/4</strong> torneos</div>
      </div>
      <div class="arena-readiness">${players}</div>
      <div class="arena-journey-track">${stages}</div>
      <div class="arena-postleague">
        <div><h4>🏆 Post-liga</h4><p>${postStatus}</p>${postVoteHtml}</div>
        ${canStartPostLeague ? `<button class="primary" type="button" onclick="openScheduleDuel('post-league')">Post-liga</button>` : ''}
        ${arenaJourneyState.postLeagueDone ? `<span class="arena-stage-state done">✓ Completada</span>` : ''}
      </div>
      <p class="arena-sync-note">Cada torneo se desbloquea cuando los tres alcanzáis el hito y el anterior está completado. Si alguno no llega, los tres podéis votar para adelantarlo: solo se adelanta si votáis los tres. Post-liga requiere las 8 medallas de los tres, o la votación de los tres.</p>
    </section>`;
}

  if(!duelState.scheduled){
    duelLastArenaPhase = '';
    app.innerHTML = `
      ${renderArenaJourney()}
      <div class="duel-empty arena-waiting">
