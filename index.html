        <p>No hay ningún combate en curso. El siguiente torneo aparecerá al desbloquearse el próximo hito de medallas.</p>
      </div>
      ${renderChallengeSection()}
      ${renderDuelTallyAndHistory()}
    `;
    return;
  }

  const scheduled = duelState.scheduled;
  const phase = duelArenaPhase();
  const phaseKey = `${scheduled.datetime}:${phase.key}`;
  const phaseChanged = phaseKey !== duelLastArenaPhase;
  duelLastArenaPhase = phaseKey;
  app.innerHTML = `
    ${renderArenaJourney()}
    <div class="duel-card">
      <div class="duel-name">${scheduled.name}</div>
      ${duelState.progressionKey ? `<div class="arena-stage-state ready">${duelState.progressionKey==='post-league'?'Post-liga':`Hito de ${duelState.progressionKey.replace('medals-','')} medallas`}</div>` : ''}
      <div class="duel-date">${fmtTime(new Date(scheduled.datetime).getTime())}</div>
      <div class="countdown" id="duel-countdown"></div>
      <div class="duel-top-actions">
        <button class="ghost" onclick="resetDuel()">Reiniciar</button>
      </div>
    </div>

    ${renderWheelAndBracket()}
    ${renderChallengeSection()}
    ${renderDuelTallyAndHistory()}
  `;

  updateDuelCountdown();
  duelCountdownInterval = setInterval(updateDuelCountdown, 1000);
  if(phaseChanged){
    requestAnimationFrame(() => {
      document.getElementById('arena-current-phase')?.scrollIntoView({ behavior:'smooth', block:'start' });
    });
  }

  // Si ya se había girado antes de este render, coloca la rueda directamente en su posición final sin animar
  const wheelEl = document.getElementById('duel-wheel');
  if(wheelEl && !duelSpinning && (duelState.picks||[]).length > 0 && duelWheelRotation > 0){
    wheelEl.style.transition = 'none';
    wheelEl.style.transform = `rotate(${duelWheelRotation}deg)`;
  }
}

function updateDuelCountdown(){
  const el = document.getElementById('duel-countdown');
  if(!el || !duelState.scheduled) return;
  const target = new Date(duelState.scheduled.datetime).getTime();
  const now = Date.now();
  let diff = target - now;
  if(diff <= 0){
    el.classList.add('due');
    el.innerHTML = `<div style="font-family:'Rajdhani',sans-serif;font-size:20px;letter-spacing:1.5px;color:var(--gold);">🔔 ¡Es la hora del combate!</div>`;
    return;
  }
  el.classList.remove('due');
  const urgent = diff < 1000*60*60; // menos de 1 hora: se pone en alerta
  el.classList.toggle('urgent', urgent);
  const d = Math.floor(diff/(1000*60*60*24));
  const h = Math.floor((diff/(1000*60*60))%24);
  const m = Math.floor((diff/(1000*60))%60);
  const s = Math.floor((diff/1000)%60);
  el.innerHTML = `
    <div class="unit"><span class="num tick">${d}</span><span class="lbl">días</span></div>
    <div class="unit"><span class="num tick">${String(h).padStart(2,'0')}</span><span class="lbl">horas</span></div>
    <div class="unit"><span class="num tick">${String(m).padStart(2,'0')}</span><span class="lbl">min</span></div>
    <div class="unit"><span class="num tick">${String(s).padStart(2,'0')}</span><span class="lbl">seg</span></div>
  `;
}

function wheelGradientAndSegs(candidates){
  const colors = ['var(--lava)', 'var(--lava-hot)', 'var(--ember)'];
  const segAngle = 360 / candidates.length;
  const stops = candidates.map((t,i)=> `${colors[i%colors.length]} ${i*segAngle}deg ${(i+1)*segAngle}deg`).join(', ');
  const segs = candidates.map((t,i)=>{
    const angle = i*segAngle + segAngle/2;
    const norm = ((angle % 360) + 360) % 360;
    const flip = norm > 90 && norm < 270; // evita texto boca abajo en la mitad inferior
    return `
      <div class="wheel-seg" style="transform: rotate(${angle}deg);">
        <span style="transform: translateX(-50%) ${flip ? 'rotate(180deg)' : ''};">${NAMES[t]}</span>
      </div>
    `;
  }).join('');
  return { gradient: `conic-gradient(${stops})`, segs };
}

function renderArenaPhaseHeader(){
  const phase = duelArenaPhase();
  const labels = ['Sorteo', 'Combate 1', 'Final', 'Recompensas', 'Cierre'];
  return `
    <div class="arena-phase" id="arena-current-phase">
      <div class="arena-phase-kicker">Fase ${phase.index + 1} de ${labels.length}</div>
      <div class="arena-phase-title">${phase.label}</div>
      <div class="arena-progress" aria-label="Progreso del torneo">
        ${labels.map((label, i) => `<span class="arena-progress-step ${i < phase.index ? 'done' : i === phase.index ? 'current' : ''}" title="${label}"></span>`).join('')}
      </div>
    </div>`;
}

function renderWheelAndBracket(){
  const picks = duelState.picks || [];

  // Fase 1: todavía no se han decidido los dos jugadores del Combate 1
  if(picks.length < 2){
    const candidates = TRAINERS.filter(t=> !picks.includes(t));
    const { gradient, segs } = wheelGradientAndSegs(candidates);
    const pickLabel = picks.length === 0 ? 'jugador 1' : 'jugador 2';

    return `
      ${renderArenaPhaseHeader()}
      <div class="bracket">
      <div class="bracket-match">
        <div class="match-label">Combate 1 · sorteo</div>
        <div class="bracket-vs">
          <div class="bracket-player locked ${picks[0]?'winner':''}">${picks[0] ? NAMES[picks[0]] : '?'}</div>
          <div class="bracket-vs-sep">VS</div>
          <div class="bracket-player locked ${picks[1]?'winner':''}">${picks[1] ? NAMES[picks[1]] : '?'}</div>
        </div>
      </div>
      </div>
      <div class="wheel-wrap">
        <div class="spin-note">Gira la rueda para decidir el ${pickLabel} del Combate 1</div>
        <div class="wheel-outer">
          <div class="wheel-pointer"></div>
          <div class="wheel" id="duel-wheel" style="background:${gradient};">${segs}<div class="wheel-center"></div></div>
        </div>
        <button class="primary" onclick="spinWheel()" ${duelSpinning?'disabled':''}>${duelSpinning?'Girando…':'Girar la rueda'}</button>
      </div>
    `;
  }

  // Fase 2: ya sabemos quién juega el Combate 1 y quién pasa directo a la final
  const { bye, match1, match1Games, match1Winner, match1LoserPrize, finalGames, finalWinner, finalWinnerPrize, finalLoserPrize } = duelState;
  const m1Games = match1Games || [];
  const fGames = finalGames || [];

  let match1RewardSection = '';
  if(match1Winner){
    match1RewardSection = bye ? `
      <div class="spin-note" style="margin-top:-4px;">🎁 ${NAMES[match1.p1]} y ${NAMES[match1.p2]} se llevan <strong style="color:var(--silver-bright)">1 captura extra</strong> cada uno por el Combate 1</div>
      <div class="section-sub" style="margin-top:6px;">Ruleta del perdedor del Combate 1</div>
      <div class="final-wheels-row">
        ${renderMatch1LoserWheelBlock()}
      </div>
    ` : `
      <div class="spin-note" style="margin-top:-4px;">🎁 ${NAMES[match1.p1]} y ${NAMES[match1.p2]} se llevan <strong style="color:var(--silver-bright)">1 captura extra</strong> cada uno por jugar</div>
    `;
  }

  let finalPrizeSection = '';
  if(finalWinner){
    const finalLoser = finalLoserOf();
    if(finalWinnerPrize && finalLoserPrize){
      finalPrizeSection = `
        <div class="champion-banner" style="text-align:center;">
          <div class="champion-title" style="font-family:'Rajdhani',sans-serif;font-size:20px;color:var(--gold);letter-spacing:1.5px;margin-bottom:10px;text-shadow:0 0 16px rgba(201,168,106,0.5);">🏆 Campeón: ${NAMES[finalWinner]} 🏆</div>
          <div style="font-size:13px;color:var(--silver-dim);margin-bottom:20px;line-height:1.7;">
            ${NAMES[finalWinner]} se lleva: <strong style="color:var(--silver-bright)">${finalWinnerPrize}</strong><br>
            ${NAMES[finalLoser]} se lleva: <strong style="color:var(--silver-bright)">${finalLoserPrize}</strong>
          </div>
          ${(!bye || match1LoserPrize) ? `<button class="primary" onclick="finishDuel()">Guardar resultado y preparar la próxima semana</button>` : `<div class="spin-note">Falta girar la ruleta del perdedor del Combate 1 para poder cerrar la semana</div>`}
        </div>
      `;
    } else {
      finalPrizeSection = `
        <div class="section-sub" style="margin-top:6px;">Recompensas de la final</div>
        <div class="final-wheels-row">
          ${renderPrizeWheelBlock('winner')}
          ${renderPrizeWheelBlock('loser')}
        </div>
      `;
    }
  }

  const match1Card = `
    <div class="bracket-match ${match1Winner?'':'active'}">
      <div class="match-label">Combate 1 ${m1Games.length>0 && !match1Winner ? `· Juego ${Math.min(m1Games.length+1,3)} de 3` : ''}</div>
      <div class="bracket-vs">
        <div class="bracket-player ${match1Winner===match1.p1?'winner':''} ${match1Winner?'locked':''}" ${match1Winner?'':`onclick="recordBo3Game('match1','${match1.p1}')"`}>${NAMES[match1.p1]}</div>
        <div class="bracket-vs-sep">VS</div>
        <div class="bracket-player ${match1Winner===match1.p2?'winner':''} ${match1Winner?'locked':''}" ${match1Winner?'':`onclick="recordBo3Game('match1','${match1.p2}')"`}>${NAMES[match1.p2]}</div>
      </div>
      ${m1Games.length>0 ? `<div class="bo3-score">${NAMES[match1.p1]} ${m1Games.filter(g=>g===match1.p1).length} - ${m1Games.filter(g=>g===match1.p2).length} ${NAMES[match1.p2]}</div>` : ''}
      ${renderRivalryLine(match1.p1, match1.p2)}
      ${bye ? `<div class="bracket-bye">${NAMES[bye]} pasa directo a la final</div>` : ''}
    </div>`;
  const match1Summary = `
    <details class="arena-completed">
      <summary>Combate 1 · ${NAMES[match1Winner]} gana (${m1Games.filter(g=>g===match1.p1).length}-${m1Games.filter(g=>g===match1.p2).length})</summary>
      <div class="arena-completed-body">${renderRivalryLine(match1.p1, match1.p2)}${bye ? `<div class="bracket-bye">${NAMES[bye]} pasa directo a la final</div>` : ''}</div>
    </details>`;
  const finalCard = bye ? `
    <div class="bracket-match ${finalWinner?'':'active'}">
      <div class="match-label">Final ${fGames.length>0 && !finalWinner ? `· Juego ${Math.min(fGames.length+1,3)} de 3` : ''}</div>
      <div class="bracket-vs">
        <div class="bracket-player ${finalWinner===match1Winner?'winner':''} ${finalWinner?'locked':''}" ${finalWinner?'':`onclick="recordBo3Game('final','${match1Winner}')"`}>${NAMES[match1Winner]}</div>
        <div class="bracket-vs-sep">VS</div>
        <div class="bracket-player ${finalWinner===bye?'winner':''} ${finalWinner?'locked':''}" ${finalWinner?'':`onclick="recordBo3Game('final','${bye}')"`}>${NAMES[bye]}</div>
      </div>
      ${fGames.length>0 ? `<div class="bo3-score">${NAMES[match1Winner]} ${fGames.filter(g=>g===match1Winner).length} - ${fGames.filter(g=>g===bye).length} ${NAMES[bye]}</div>` : ''}
      ${renderRivalryLine(match1Winner, bye)}
    </div>` : '';
  const finalSummary = bye && finalWinner ? `
    <details class="arena-completed">
      <summary>Final · campeón: ${NAMES[finalWinner]} (${fGames.filter(g=>g===match1Winner).length}-${fGames.filter(g=>g===bye).length})</summary>
      <div class="arena-completed-body">${renderRivalryLine(match1Winner, bye)}</div>
    </details>` : '';
  const phase = duelArenaPhase();

  if(phase.key === 'match1'){
    return `${renderArenaPhaseHeader()}<div class="bracket">${match1Card}</div>
      ${m1Games.length>0 ? `<div class="bo3-narration">${currentSeasonNarration(duelState.match1Narration)}<div class="bo3-reader-note">🎙️ Lo tiene que leer el que no está combatiendo</div></div>` : ''}
      ${renderDuelBetPanel('match1', match1.p1, match1.p2)}`;
  }
  if(phase.key === 'final'){
    return `${renderArenaPhaseHeader()}${match1Summary}<div class="bracket">${finalCard}</div>
      ${fGames.length>0 ? `<div class="bo3-narration">${currentSeasonNarration(duelState.finalNarration)}<div class="bo3-reader-note">🎙️ Lo tiene que leer el que no está combatiendo</div></div>` : ''}
      ${renderDuelBetPanel('final', match1Winner, bye)}`;
  }
  if(phase.key === 'rewards'){
    return `${renderArenaPhaseHeader()}${match1Summary}${finalSummary}
      ${match1RewardSection}${finalPrizeSection}`;
  }
  return `${renderArenaPhaseHeader()}${match1Summary}${finalSummary}${finalPrizeSection}`;
}

function finalLoserOf(){
  // con "bye" real (torneo viejo de 3): el perdedor de la final es el que
  // no ganó, entre el ganador del Combate 1 y el que tenía el pase directo.
  // sin "bye" (combate directo nuevo, 1 vs 1): el perdedor es simplemente
  // el otro participante del propio Combate 1.
  const { match1, bye, match1Winner, finalWinner } = duelState;
  if(bye) return [match1Winner, bye].find(p=> p!==finalWinner);
  return [match1.p1, match1.p2].find(p=> p!==match1Winner);
}

function renderPrizeWheelBlock(role){
  const prizeSet = role==='winner' ? duelState.finalWinnerPrize : duelState.finalLoserPrize;
  const finalLoser = finalLoserOf();
  const trainer = role==='winner' ? duelState.finalWinner : finalLoser;
  const prizes = role==='winner' ? WINNER_PRIZES : (duelState.bye ? LOSER_PRIZES : MERGED_LOSER_WHEEL);
  const spinning = role==='winner' ? finalWheelSpinningWinner : finalWheelSpinningLoser;
  const wheelId = role==='winner' ? 'final-wheel-winner' : 'final-wheel-loser';
  const title = role==='winner' ? `🏆 Ruleta del ganador · ${NAMES[trainer]}` : `Ruleta del perdedor · ${NAMES[trainer]}`;

  if(prizeSet){
    return `
      <div class="wheel-wrap">
        <div class="spin-note">${title}</div>
        <div class="prize-result ${role==='winner'?'good':''}">🎁 ${prizeSet}</div>
      </div>
    `;
  }

  const segAngle = 360/prizes.length;
  const stops = prizes.map((p,i)=> `${WHEEL_COLORS[i%WHEEL_COLORS.length]} ${i*segAngle}deg ${(i+1)*segAngle}deg`).join(', ');

  return `
    <div class="wheel-wrap">
      <div class="spin-note">${title}</div>
      <div class="wheel-outer small">
        <div class="wheel-pointer"></div>
        <div class="wheel" id="${wheelId}" style="background: conic-gradient(${stops});"><div class="wheel-center"></div></div>
      </div>
      <div class="prize-legend">
        ${prizes.map((p,i)=>`<div class="prize-legend-item"><span class="prize-swatch" style="background:${WHEEL_COLORS[i%WHEEL_COLORS.length]}"></span>${p}</div>`).join('')}
      </div>
      <button class="primary" onclick="spinFinalWheel('${role}')" ${spinning?'disabled':''}>${spinning?'Girando…':'Girar la rueda'}</button>
    </div>
  `;
}

function renderMatch1LoserWheelBlock(){
  const { match1, match1Winner, match1LoserPrize } = duelState;
  const loser = [match1.p1, match1.p2].find(p=> p!==match1Winner);
  const outcomes = MATCH1_LOSER_WHEEL;
  const title = `💀 Ruleta del perdedor · ${NAMES[loser]}`;

  if(match1LoserPrize){
    return `
      <div class="wheel-wrap">
        <div class="spin-note">${title}</div>
        <div class="prize-result">☠️ ${match1LoserPrize}</div>
      </div>
    `;
  }

  const segAngle = 360/outcomes.length;
  const stops = outcomes.map((o,i)=> `${WHEEL_COLORS[i%WHEEL_COLORS.length]} ${i*segAngle}deg ${(i+1)*segAngle}deg`).join(', ');

  return `
    <div class="wheel-wrap">
      <div class="spin-note">${title}</div>
      <div class="wheel-outer small">
        <div class="wheel-pointer"></div>
        <div class="wheel" id="match1-loser-wheel" style="background: conic-gradient(${stops});"><div class="wheel-center"></div></div>
      </div>
      <div class="prize-legend">
        ${outcomes.map((o,i)=>`<div class="prize-legend-item"><span class="prize-swatch" style="background:${WHEEL_COLORS[i%WHEEL_COLORS.length]}"></span>${o.label}</div>`).join('')}
      </div>
      <button class="primary" onclick="spinMatch1LoserWheel()" ${match1LoserWheelSpinning?'disabled':''}>${match1LoserWheelSpinning?'Girando…':'Girar la rueda'}</button>
    </div>
  `;
}

function spinMatch1LoserWheel(){
  if(match1LoserWheelSpinning || duelState.match1LoserPrize) return;
  const outcomes = MATCH1_LOSER_WHEEL;
  match1LoserWheelSpinning = true;
  render();

  const idx = Math.floor(Math.random()*outcomes.length);
  const segAngle = 360/outcomes.length;
  const center = idx*segAngle + segAngle/2;
  const fullSpins = 5 + Math.floor(Math.random()*2);
  const target = fullSpins*360 + (360 - center);
  match1LoserWheelRotation += target;
  playSound('spin');

  const wheelEl = document.getElementById('match1-loser-wheel');
  if(wheelEl){
    wheelEl.style.transition = 'transform 4.2s cubic-bezier(0.15, 0.85, 0.25, 1)';
    void wheelEl.offsetWidth;
    wheelEl.style.transform = `rotate(${match1LoserWheelRotation}deg)`;
  }

  setTimeout(async ()=>{
    const outcome = outcomes[idx];
    match1LoserWheelSpinning = false;
    duelState.match1LoserPrize = outcome.label;
    playSound('wheelLand');

    const loser = [duelState.match1.p1, duelState.match1.p2].find(p=> p!==duelState.match1Winner);
    pushHistory(`💀 ${NAMES[loser]} perdió el Combate 1 y le tocó: ${outcome.label} (aplicar manualmente si corresponde)`);

    render();
    const ok2 = await saveDuelState();
    if(!ok2) queueRetry('duel', saveDuelState);
  }, 4300);
}

function renderDuelTallyAndHistory(){
  const tally = {}; TRAINERS.forEach(t=> tally[t]=0);
  duelHistory.forEach(d=>{ if(tally[d.champion] !== undefined) tally[d.champion]++; });
  const finalBonus = (finalState && finalState.unlocked && finalState.pointsAwarded) ? finalState.pointsAwarded : {};
  TRAINERS.forEach(t=> tally[t] += (finalBonus[t]||0));
  const maxWins = Math.max(...TRAINERS.map(t=> tally[t]));

  return `
    <div class="section-sub" style="text-align:center;margin-bottom:14px;">Marcador</div>
    <div class="duel-tally">
      ${TRAINERS.map(t=>`
        <div class="t-item ${maxWins>0 && tally[t]===maxWins?'leader':''}">
          <div class="t-wins">${tally[t]}</div>
          <div class="t-name">${NAMES[t]}${finalBonus[t]?` <span class="t-bonus">(+${finalBonus[t]} FINAL)</span>`:''}</div>
        </div>
      `).join('')}
    </div>

    ${renderRivalriesCard()}

    <div class="section-sub" style="text-align:center;margin-bottom:14px;">Historial de combates</div>
    ${duelHistory.length===0 ? '<div class="empty-state">Todavía no se ha jugado ningún combate.</div>' : duelHistory.map(d=>`
      <div class="duel-history-item">
        <div class="dh-name">${d.name}</div>
        <div class="dh-date">${fmtTime(new Date(d.date).getTime())}</div>
        <div>${d.isChallenge
          ? `${NAMES[d.match1.p1]} vs ${NAMES[d.match1.p2]} → <span class="dh-champ">ganó ${NAMES[d.match1.winner]}</span> (desafío 1v1)`
          : d.final
            ? `${NAMES[d.match1.p1]} vs ${NAMES[d.match1.p2]} → ganó ${NAMES[d.match1.winner]} · Final: ${NAMES[d.final.p1]} vs ${NAMES[d.final.p2]} → <span class="dh-champ">campeón ${NAMES[d.champion]}</span>`
            : `${NAMES[d.match1.p1]} vs ${NAMES[d.match1.p2]} → <span class="dh-champ">ganó ${NAMES[d.champion]}</span>`
        }</div>
        ${d.match1WinnerReward ? `<div class="dh-reward">🎁 ${NAMES[d.match1.p1]} y ${NAMES[d.match1.p2]} +${d.match1WinnerReward} cada uno por el Combate 1</div>` : ''}
        ${d.match1LoserPrize ? `<div class="dh-reward">💀 ${NAMES[[d.match1.p1, d.match1.p2].find(p=>p!==d.match1.winner)]} → ${d.match1LoserPrize}</div>` : ''}
        ${d.finalWinnerPrize ? `<div class="dh-reward">🏆 ${NAMES[d.champion]} → ${d.finalWinnerPrize}${d.finalLoserPrize && d.finalLoser ? ` · ${NAMES[d.finalLoser]} → ${d.finalLoserPrize}` : ''}</div>` : ''}
      </div>
    `).join('')}
  `;
}

function openScheduleDuel(progressionKey){
  if(!progressionKey){
    toast('Los torneos de Arena solo se abren desde el recorrido de medallas.');
    return;
  }
  if(duelState.scheduled){
    toast('Termina o reinicia el torneo actual antes de programar otro.');
    return;
  }
  if(progressionKey && progressionKey !== 'post-league'){
    const medals = Number(progressionKey.replace('medals-',''));
    if(!arenaReadyForMilestone(medals) || arenaJourneyState.completed.includes(medals)){
      toast('Este torneo todavía no está desbloqueado para los tres.');
      render();
      return;
    }
  }
  if(progressionKey === 'post-league' && (!arenaPostLeagueReady() || arenaJourneyState.postLeagueDone)){
    toast('Post-liga todavía no está desbloqueada.');
    render();
    return;
  }
  duelScheduleProgressionKey = progressionKey;
  const now = new Date();
  const minStr = toLocalInputValue(now);
  const maxStr = toLocalInputValue(endOfWeek());
  const defaultName = progressionKey === 'post-league'
    ? 'Post-liga'
    : progressionKey
      ? `Combate ${ARENA_MEDAL_MILESTONES.indexOf(Number(progressionKey.replace('medals-','')))+1} · ${progressionKey.replace('medals-','')} medallas`
      : '';
  openModal(`
    <h3>Programar torneo</h3>
    <div class="field">
      <label>Nombre del torneo</label>
      <input type="text" id="duel-name" value="${defaultName}" placeholder="ej: Combate 1 · 2 medallas">
    </div>
    <div class="field">
      <label>Fecha y hora (esta semana)</label>
      <input type="datetime-local" id="duel-datetime" min="${minStr}" max="${maxStr}">
    </div>
    <div class="err-msg" id="duel-err"></div>
    <div class="modal-actions">
      <button class="ghost" onclick="cancelScheduleDuel()">Cancelar</button>
      <button class="primary" onclick="submitScheduleDuel()">Programar</button>
    </div>
  `);
}
function cancelScheduleDuel(){
  duelScheduleProgressionKey = null;
  closeModal();
}
async function submitScheduleDuel(){
  const name = document.getElementById('duel-name').value.trim();
  const dt = document.getElementById('duel-datetime').value;
  const err = document.getElementById('duel-err');
  if(!name || !dt){ err.textContent = 'Rellena el nombre y la fecha.'; return; }
  if(duelState.scheduled){ err.textContent = 'Ya hay un torneo en marcha.'; return; }
  const progressionKey = duelScheduleProgressionKey;
  if(progressionKey && progressionKey !== 'post-league'){
    const medals = Number(progressionKey.replace('medals-',''));
    if(!arenaReadyForMilestone(medals) || arenaJourneyState.completed.includes(medals)){
      err.textContent = 'El hito ya no está desbloqueado para los tres.';
      return;
    }
  }
  if(progressionKey === 'post-league' && (!arenaPostLeagueReady() || arenaJourneyState.postLeagueDone)){
    err.textContent = 'Post-liga ya no está desbloqueada.';
    return;
  }

function resetDuel(){
  if(!confirm('¿Reiniciar el temporizador y el combate actual? (no borra el historial de combates ya jugados)')) return;
  duelState = { scheduled:null, picks:[], bye:null, match1:null, match1Games:[], match1Winner:null, match1LoserPrize:null, finalGames:[], finalWinner:null, finalWinnerPrize:null, finalLoserPrize:null };

  finalWheelSpinningLoser = false;

function spinWheel(){
  if(duelSpinning) return;
  const candidates = TRAINERS.filter(t=> !(duelState.picks||[]).includes(t));
  if(candidates.length < 2) return; // ya está decidido
  duelSpinning = true;
  render();
  const idx = Math.floor(Math.random()*candidates.length);
  const segAngle = 360/candidates.length;
  const center = idx*segAngle + segAngle/2;
  const fullSpins = 5 + Math.floor(Math.random()*2);
  const target = fullSpins*360 + (360 - center);
  duelWheelRotation += target;
  const wheelEl = document.getElementById('duel-wheel');
  wheelEl.style.transition = 'transform 4.2s cubic-bezier(0.15, 0.85, 0.25, 1)';
  // forzar reflow para que la transición se aplique
  void wheelEl.offsetWidth;
  wheelEl.style.transform = `rotate(${duelWheelRotation}deg)`;
  playSound('spin');

  setTimeout(async ()=>{
    duelSpinning = false;
    playSound('wheelLand');
    const picked = candidates[idx];
    duelState.picks = [...(duelState.picks||[]), picked];
    duelWheelRotation = 0; // la siguiente rueda tiene otro número de candidatos, debe arrancar limpia
    if(duelState.picks.length === 2){
      const bye = TRAINERS.find(t=> !duelState.picks.includes(t));
      duelState.bye = bye;
      duelState.match1 = { p1: duelState.picks[0], p2: duelState.picks[1] };
      duelState.match1Winner = null;
      duelState.match1LoserPrize = null;
      duelState.finalWinner = null;
      duelState.finalWinnerPrize = null;
      duelState.finalLoserPrize = null;
    }
    render();
    const ok = await saveDuelState();
    if(!ok) queueRetry('duel', saveDuelState);
  }, 4300);
}

function pickNarrationVariant(category, variants){

// SoulSilver: no tenemos el registro real, se sigue repartiendo a partir del
// marcador total que ya había en la web.
function eloBuildLegacyFromTotals(){
  const sources = [
    ['Pokémon SoulSilver', SOULSILVER_HISTORY],
  ];
  const out = [];
  sources.forEach(([game, table]) => {
    const perPair = Object.entries(table).map(([key, rec]) => {
      const [a, b] = key.split('-');
      const na = rec[a] || 0, nb = rec[b] || 0, n = na + nb;
      const seq = Array(n).fill(a);
      for(let k = 0; k < nb; k++) seq[Math.min(n - 1, Math.floor((k + 0.5) * n / nb))] = b;
      return seq.map(w => ({ game, winner: w, loser: w === a ? b : a }));
    });
    let i = 0, more = true;
    while(more){ // reparto entre parejas por turnos
      more = false;
      perPair.forEach(seq => { if(i < seq.length){ out.push(seq[i]); more = true; } });
      i++;
    }
  });
  return out;
}

function eloExpected(ra, rb){ return 1 / (1 + Math.pow(10, (rb - ra) / 400)); }
function eloScoreOf(games, a, b){
  const s = {}; s[a] = 0; s[b] = 0;
  (games || []).forEach(w => { if(w in s) s[w]++; });
  return s;
}

let _eloCache = null, _eloKey = '';
function computeElo(){
  const hist = duelHistory || [];
  const key = hist.length + ':' + (hist[0] ? hist[0].id : '') + ':' + (hist[hist.length - 1] ? hist[hist.length - 1].id : '') + ':' + JSON.stringify([hearts, medalLog]);
  if(_eloCache && _eloKey === key) return _eloCache;

  const R = {}, series = {}, st = {};
  TRAINERS.forEach(t => {
    R[t] = ELO_START;
    series[t] = [{ elo: ELO_START, label: 'Inicio', type: 'start' }];
    st[t] = { w: 0, l: 0, streak: 0, best: 0, streakVs: {}, peak: ELO_START, lockes: 0, fromCombats: 0, fromLockes: 0, fromRun: 0, curW: 0, curL: 0 };
  });
  const h2h = {}; // 'a-b' (ordenado) -> { a: n, b: n }

  const applyCombat = (game, w, l, m, tag) => {
    if(!(w in R) || !(l in R)) return;
    const e = eloExpected(R[w], R[l]);
    const d = ELO_K_COMBAT * (m || 1) * (1 - e);
    R[w] += d; R[l] -= d;
    st[w].fromCombats += d; st[l].fromCombats -= d;
    st[w].w++; st[l].l++;
    st[w].streak = st[w].streak > 0 ? st[w].streak + 1 : 1;
    st[l].streak = 0;
    // "mejor racha" = seguidas contra EL MISMO rival (no vale encadenar victorias
    // contra gente distinta, ni entre partidas distintas, como pasaba antes).
    TRAINERS.forEach(t => {
      if(t !== w) st[w].streakVs[t] = 0;
      if(t !== l) st[l].streakVs[t] = 0;
    });
    st[w].streakVs[l] = (st[w].streakVs[l] || 0) + 1;
    st[w].best = Math.max(st[w].best, st[w].streakVs[l]);
    if(tag === 'run'){ st[w].curW++; st[l].curL++; }
    const k = [w, l].sort().join('-');
    (h2h[k] = h2h[k] || {})[w] = ((h2h[k] || {})[w] || 0) + 1;
    [w, l].forEach(t => { st[t].peak = Math.max(st[t].peak, R[t]); });
    series[w].push({ elo: R[w], label: `${game}: gana a ${NAMES[l]}`, type: 'combat', d });
    series[l].push({ elo: R[l], label: `${game}: pierde con ${NAMES[w]}`, type: 'combat', d: -d });
  };
  const applyLocke = (game, players, winner) => {
    if(!winner || !(winner in R)) return;
    players.filter(p => p !== winner && p in R).forEach(o => {
      const e = eloExpected(R[winner], R[o]);
      const d = ELO_K_LOCKE * (1 - e);
      R[winner] += d; R[o] -= d;
      st[winner].fromLockes += d; st[o].fromLockes -= d;
    });
    st[winner].lockes++;
    players.filter(p => p in R).forEach(t => {
      st[t].peak = Math.max(st[t].peak, R[t]);
      series[t].push({ elo: R[t], label: `${game}: locke ${t === winner ? 'GANADO' : 'perdido'}`, type: 'locke' });
    });
  };

  ELO_LEGACY_GAMES.forEach(game => {
    // Las rachas (streak y streakVs) no deben saltar de una partida a otra:
    // cada Pokémon/save es una historia distinta, así que se resetean al
    // empezar cada partida. "best" (récord histórico) NUNCA se resetea.
    TRAINERS.forEach(t => { st[t].streak = 0; st[t].streakVs = {}; });
    LEGACY_COMBATS.filter(c => c.game === game).forEach(c => {
      let m = 1;
      if(c.score){ const p = c.score.split('-').map(Number); if(p[0] === 2 && p[1] === 0) m = ELO_MARGIN_20; }
      applyCombat(game, c.winner, c.loser, m);
    });
    const lk = LOCKE_RESULTS.find(x => x.game === game);
    if(lk) applyLocke(game, lk.players, lk.winner);
  });

  // Radical Red es, otra vez, una partida nueva: racha a cero también aquí.
  TRAINERS.forEach(t => { st[t].streak = 0; st[t].streakVs = {}; });
  // Radical Red: duelHistory guarda el más reciente primero → del más antiguo al más nuevo
  [...hist].reverse().forEach(h => {
    const one = (c, score) => {
      if(!c || !c.winner) return;
      const l = c.winner === c.p1 ? c.p2 : c.p1;
      let m = 1;
      if(score && score[c.winner] === 2 && score[l] === 0) m = ELO_MARGIN_20;
      applyCombat('Radical Red', c.winner, l, m, 'run');
    };
    one(h.match1, h.match1Score);
    one(h.final, h.finalScore);
  });

  // Vidas perdidas (resta) y medallas conseguidas con vidas de sobra (suma).
  TRAINERS.forEach(t => {
    const h = Number(hearts[t]);
    const lost = Number.isFinite(h) ? Math.min(Math.max(ELO_LIVES_MAX - h, 0), ELO_LIVES_MAX + 1) : 0;
    let bonus = 0;
    Object.values(medalLog[t] || {}).forEach(v => { bonus += eloMedalBonus(v); });
    const d = bonus - lost * ELO_LIFE_LOSS;
    if(!d) return;
    R[t] += d; st[t].fromRun += d;
    st[t].peak = Math.max(st[t].peak, R[t]);
    series[t].push({ elo: R[t], label: `Radical Red: vidas y medallas (${d > 0 ? '+' : ''}${Math.round(d)})`, type: 'run', d });
  });

  _eloCache = { R, series, st, h2h };
  _eloKey = key;
  return _eloCache;
}
function eloOf(t){ return Math.round(computeElo().R[t] || ELO_START); }
function eloWinProb(a, b){ const E = computeElo().R; return eloExpected(E[a] || ELO_START, E[b] || ELO_START); }

function eloSparkline(t){
  const s = computeElo().series[t];
  const W = 320, H = 92, P = 8;
  const vals = s.map(p => p.elo);
  const lo = Math.min(...vals, ELO_START) - 12, hi = Math.max(...vals, ELO_START) + 12;
  const x = i => P + (s.length === 1 ? 0 : i * (W - 2 * P) / (s.length - 1));
  const y = v => H - P - (v - lo) * (H - 2 * P) / (hi - lo || 1);
  const pts = s.map((p, i) => `${x(i).toFixed(1)},${y(p.elo).toFixed(1)}`).join(' ');
  const base = y(ELO_START).toFixed(1);
  const dots = s.map((p, i) => p.type === 'locke'
      ? `<circle cx="${x(i).toFixed(1)}" cy="${y(p.elo).toFixed(1)}" r="4.2" class="elo-dot locke"><title>${p.label}</title></circle>` : '').join('');
  const last = s[s.length - 1];
  return `<svg class="elo-spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
      <line x1="${P}" x2="${W - P}" y1="${base}" y2="${base}" class="elo-base"/>
      <polyline points="${pts}" class="elo-line"/>${dots}
      <circle cx="${x(s.length - 1).toFixed(1)}" cy="${y(last.elo).toFixed(1)}" r="4" class="elo-dot now"/>
    </svg>`;
}

  return `

    </div>`;
}

function bo3Narration(games, p1, p2, isFinal){
  return bo3NarrationCore(games, p1, p2, isFinal);
}

function currentSeasonNarration(text){
  if(typeof text !== 'string') return 'Resultado registrado en esta temporada.';
  return /ultra\s*sol|pok[eé]mon\s*x|kalos|soulsilver|johto|3\s*(?:pok[eé]mon(?:es)?\s+con\s+)?potencias?/i.test(text)
    ? 'Resultado registrado en esta temporada.'
    : text;
}

async function recordBo3Game(matchKey, gameWinner){
  const isFinal = matchKey === 'final';
  const p1 = isFinal ? duelState.match1Winner : duelState.match1.p1;
  const p2 = isFinal ? duelState.bye : duelState.match1.p2;
  const gamesKey = isFinal ? 'finalGames' : 'match1Games';

  duelState[gamesKey] = [...(duelState[gamesKey]||[]), gameWinner];
  const games = duelState[gamesKey];
  const wins = { [p1]: 0, [p2]: 0 };
  games.forEach(g => wins[g]++);
  const matchDecided = wins[p1] === 2 || wins[p2] === 2;
  const matchWinner = wins[p1] === 2 ? p1 : (wins[p2] === 2 ? p2 : null);

  // La narracion se calcula UNA sola vez aqui (elige variante al azar) y se
  // guarda como texto fijo -- si se recalculara en cada render() cambiaria
  // sola cada pocos segundos y no daria tiempo a leerla.
  duelState[isFinal ? 'finalNarration' : 'match1Narration'] = bo3Narration(games, p1, p2, isFinal);

  playSound(matchDecided ? (isFinal ? 'bigwin' : 'win') : 'reelStop');
  if(matchDecided) fireConfetti({ count: isFinal ? 220 : 70 });
  render();

  if(matchDecided){
    if(isFinal) duelState.finalWinner = matchWinner;
    else {
      duelState.match1Winner = matchWinner;
      // Combate directo (sin "bye" real, ver más abajo en submitScheduleDuel):
      // no hay una segunda ronda que jugar, el ganador del único combate ya
      // es el ganador final -- se pasa directo a las ruletas de recompensa.
      if(!duelState.bye) duelState.finalWinner = matchWinner;
    }
  }
  const ok = await saveDuelState();
  if(!ok) queueRetry('duel', saveDuelState);

  if(matchDecided){
    if(isFinal){
      await addTickets(p1, 10, 'Jugar la Final');
      await addTickets(p2, 10, 'Jugar la Final');
    } else {
      await addTickets(p1, 10, 'Jugar el Combate 1');
      await addTickets(p2, 10, 'Jugar el Combate 1');
    }
    await resolveDuelBets(matchKey, matchWinner);
  }
  render();
}

async function cancelChallenge(){
  if(!challengeState || challengeActionInFlight) return;
  challengeActionInFlight = true;
  challengeRevision++;
  const { challenger, opponent } = challengeState;
  try{
    await addTickets(challenger, CHALLENGE_COST, `Desafío contra ${NAMES[opponent]} cancelado (devolución)`);
    challengeState = null;
    render();
    const ok = await saveChallengeState();
    if(!ok) queueRetry('challenge', saveChallengeState);
  }finally{
    challengeActionInFlight = false;
    challengeRevision++;
    render();
  }
}

async function recordChallengeGame(gameWinner){
  if(!challengeState || challengeActionInFlight) return;
  const { challenger, opponent } = challengeState;
  if(gameWinner !== challenger && gameWinner !== opponent) return;
  const currentGames = challengeState.games || [];
  const currentWins = currentGames.reduce((wins, game) => {
    if(game === challenger || game === opponent) wins[game]++;
    return wins;
  }, { [challenger]:0, [opponent]:0 });
  if(currentWins[challenger] >= 2 || currentWins[opponent] >= 2 || currentGames.length >= 3) return;

  challengeActionInFlight = true;
  challengeRevision++;
  challengeState.games = [...currentGames, gameWinner];
  const games = challengeState.games;
  const wins = { [challenger]:0, [opponent]:0 };
  games.forEach(g=>{ if(g === challenger || g === opponent) wins[g]++; });
  const decided = wins[challenger]===2 || wins[opponent]===2;
  const winner = wins[challenger]===2 ? challenger : (wins[opponent]===2 ? opponent : null);
  challengeState.narration = bo3Narration(games, challenger, opponent, false);
  if(decided && !challengeState.id) challengeState.id = crypto.randomUUID();

  playSound(decided ? 'win' : 'reelStop');
  if(decided) fireConfetti({ count: 90 });
  render();

  try{
    const challengeSaved = await saveChallengeState();
    if(!challengeSaved) queueRetry('challenge', saveChallengeState);

    if(decided){
      const loser = winner===challenger ? opponent : challenger;
      const challengeId = challengeState.id;
      if(!duelHistory.some(entry => entry.isChallenge && entry.id === challengeId)){
        duelHistory.unshift({
          id: challengeId,
          name: `Desafío: ${NAMES[challenger]} vs ${NAMES[opponent]}`,
          date: new Date().toISOString(),
          match1: { p1: challenger, p2: opponent, winner },
          final: null,
          champion: winner,
          isChallenge: true,
        });
        const historySaved = await saveDuelHistory();
        if(!historySaved) queueRetry('duelHistory', saveDuelHistory);
      }
      await resolveChallengeReward(winner, loser);
    }
  }finally{
    challengeActionInFlight = false;
    challengeRevision++;
    render();
  }
}

async function resolveChallengeReward(winner, loser){
  const { stakeId, stakeMonLabel } = challengeState;
  const src = `Desafío ganado a ${NAMES[loser]}`;
  if(stakeId === 'all_tickets'){
    const stolen = tickets[loser]||0;
    await addTickets(loser, -stolen, `Perdió un desafío contra ${NAMES[winner]}`);
    await addTickets(winner, stolen, `Ganó un desafío contra ${NAMES[loser]} (+${stolen} tickets robados)`);
  } else if(stakeId === 'steal_heart'){
    hearts[loser] = Math.max((hearts[loser]??20) - 2, -1);
    hearts[winner] = Math.min((hearts[winner]??20) + 2, 20);
    pushHistory(`💔 ${NAMES[winner]} le robó 2 vidas a ${NAMES[loser]} en un desafío (${NAMES[winner]}: ${hearts[winner]}/20, ${NAMES[loser]}: ${hearts[loser]}/20)`);
    render();
    const ok1 = await saveProfile(winner); if(!ok1) queueRetry('profile:'+winner, ()=>saveProfile(winner));
    const ok2 = await saveProfile(loser); if(!ok2) queueRetry('profile:'+loser, ()=>saveProfile(loser));
  } else if(stakeId === 'capsules'){
    await addPendingPrize(winner, '5 Cápsulas Habilidad', src);
  } else if(stakeId === 'mints'){
    await addPendingPrize(winner, '5 Mentas de Naturaleza', src);
  } else if(stakeId === 'full_restores'){
    await addPendingPrize(winner, '2 Restaurar Todo', src);
  } else if(stakeId === 'steal_money'){
    await addPendingPrize(winner, 'Robar 100.000 monedas (manual en PKHeX: +100k a ti, -100k a él)', src);
  } else if(stakeId === 'steal_pokemon'){
    await addPendingPrize(winner, `Te quedas con ${stakeMonLabel || 'el Pokémon apostado'} de ${NAMES[loser]}`, src);
  } else if(stakeId === 'rename'){
    await addPendingPrize(winner, `Puedes ponerle el apodo que quieras a ${stakeMonLabel || 'el Pokémon apostado'} de ${NAMES[loser]}`, src);
  }
}

function spinFinalWheel(role){
  const spinningFlag = role==='winner' ? finalWheelSpinningWinner : finalWheelSpinningLoser;
  const prizeAlreadySet = role==='winner' ? duelState.finalWinnerPrize : duelState.finalLoserPrize;
  if(spinningFlag || prizeAlreadySet) return;
  const prizes = role==='winner' ? WINNER_PRIZES : (duelState.bye ? LOSER_PRIZES : MERGED_LOSER_WHEEL);
  const wheelId = role==='winner' ? 'final-wheel-winner' : 'final-wheel-loser';

  if(role==='winner') finalWheelSpinningWinner = true; else finalWheelSpinningLoser = true;
  render();

  const idx = Math.floor(Math.random()*prizes.length);
  const segAngle = 360/prizes.length;
  const center = idx*segAngle + segAngle/2;
  const fullSpins = 5 + Math.floor(Math.random()*2);
  const target = fullSpins*360 + (360 - center);
  if(role==='winner'){ finalWheelRotationWinner += target; } else { finalWheelRotationLoser += target; }

  const wheelEl = document.getElementById(wheelId);
  if(wheelEl){
    wheelEl.style.transition = 'transform 4.2s cubic-bezier(0.15, 0.85, 0.25, 1)';
    void wheelEl.offsetWidth;
    wheelEl.style.transform = `rotate(${role==='winner'?finalWheelRotationWinner:finalWheelRotationLoser}deg)`;
  }
  playSound('spin');

  setTimeout(async ()=>{
    const prize = prizes[idx];
    const trainer = role==='winner' ? duelState.finalWinner : finalLoserOf();
    if(role==='winner'){
      finalWheelSpinningWinner = false;
      duelState.finalWinnerPrize = prize;
    } else {
      finalWheelSpinningLoser = false;
      duelState.finalLoserPrize = prize;
    }
    playSound('wheelLand');
    render();
    const ok = await saveDuelState();
    if(!ok) queueRetry('duel', saveDuelState);
    await applyPrizeToTrainer(trainer, prize, role==='winner' ? 'Ruleta del ganador de la final' : 'Ruleta del perdedor de la final');
    render();
  }, 4300);
}

async function finishDuel(){
  const { scheduled, bye, match1, match1Winner, match1LoserPrize, finalWinner, finalWinnerPrize, finalLoserPrize, progressionKey } = duelState;
  const finalLoser = finalLoserOf();
  const historyEntry = {
    id: crypto.randomUUID(),
    name: scheduled.name,
    date: scheduled.datetime,
    match1: { p1: match1.p1, p2: match1.p2, winner: match1Winner },
    final: bye ? { p1: match1Winner, p2: bye, winner: finalWinner } : null,
    champion: finalWinner,
    match1Score: eloScoreOf(duelState.match1Games, match1.p1, match1.p2),
    finalScore: bye ? eloScoreOf(duelState.finalGames, match1Winner, bye) : null,
    match1WinnerReward: '1 captura extra',
    match1LoserPrize,
    finalWinnerPrize,
    finalLoserPrize,
    finalLoser,
    ts: Date.now()
  };
  if(progressionKey) historyEntry.progressionKey = progressionKey;
  duelHistory.unshift(historyEntry);
  let journeyChanged = false;
  if(progressionKey === 'post-league' && !arenaJourneyState.postLeagueDone){
    arenaJourneyState.postLeagueDone = true;
    arenaJourneyState.postLeagueWinner = finalWinner;
    arenaClearVotes('post-league');
    journeyChanged = true;
  }else if(progressionKey && progressionKey.startsWith('medals-')){
    const medals = Number(progressionKey.replace('medals-',''));
    if(ARENA_MEDAL_MILESTONES.includes(medals) && !arenaJourneyState.completed.includes(medals)){
      arenaJourneyState.completed = [...arenaJourneyState.completed, medals].sort((a,b)=>a-b);
      arenaJourneyState.winners = { ...(arenaJourneyState.winners||{}), [String(medals)]:finalWinner };
      arenaClearVotes(String(medals));
      journeyChanged = true;
    }
  }
  duelState = { scheduled:null, picks:[], bye:null, match1:null, match1Games:[], match1Winner:null, match1LoserPrize:null, finalGames:[], finalWinner:null, finalWinnerPrize:null, finalLoserPrize:null };
  duelWheelRotation = 0;
  finalWheelRotationWinner = 0;
  finalWheelRotationLoser = 0;
  finalWheelSpinningWinner = false;
  finalWheelSpinningLoser = false;
  match1LoserWheelRotation = 0;
  match1LoserWheelSpinning = false;
  render();
  const ok1 = await saveDuelHistory();
  if(!ok1) queueRetry('duelHistory', saveDuelHistory);
  const ok2 = await saveDuelState();
  if(!ok2) queueRetry('duel', saveDuelState);
  if(journeyChanged){
    const journeySaved = await saveArenaJourney();
    if(!journeySaved) queueRetry('arenaJourney', saveArenaJourney);
  }
}

function cryptArray(bytes, seed) {
  const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  const n = bytes.length / 2;
  let s = seed >>> 0;
  for (let i = 0; i < n; i++) {
    s = (Math.imul(0x41c64e6d, s) + 0x6073) >>> 0;
    const xor = (s >>> 16) & 0xffff;
    const word = view.getUint16(i * 2, true);
    view.setUint16(i * 2, word ^ xor, true);
  }
  return bytes;
}

  const view = new DataView(dec.buffer);
  let out = '';
  for (let i = 0x40; i < 0x40 + 26; i += 2) {
    const code = view.getUint16(i, true);
    if (code === 0) break;
    out += String.fromCharCode(code);
  }
  return out;
}

function normalizeSpeciesName(name){
  const raw = String(name || '').trim();
  const match = raw.match(/^#?(\d+)$/);
  return match ? (SPECIES_NAMES[Number(match[1])] || raw) : raw;
}

function normalizeTeamSpecies(team){
  return (Array.isArray(team) ? team : []).map(p => {
    const species = normalizeSpeciesName(p && p.species);
    return p && species !== p.species ? { ...p, species } : p;
  });
}

// FIX importante: la especie es la UNICA señal fiable de "vacio". Comprobar
// solo el PID/EC (offset 0) es un error, porque un Pokemon real inyectado con
// un editor puede tener EC=0 y seguir siendo perfectamente valido (confirmado
// con checksum en saves reales). Tampoco vale mirar si el bloque entero es
// cero: las cajas vacias de verdad SI tienen encryption constant en 0 y el
// resto de bytes con contenido "plantilla" (no ceros), asi que hay que
// descifrar siempre y decidir por la especie resultante.
function readPokemon(rawSlot, hasBattleStats) {
  const dec = decryptPk6(rawSlot);
  const view = new DataView(dec.buffer);
  const species = view.getUint16(8, true);
  if (species < 1 || species > 721) return null; // vacio real o trash bytes
  const level = hasBattleStats ? dec[0xec] : null;
  const exp = view.getUint32(0x10, true);
  const pid = view.getUint32(0x18, true);
  const heldItemId = view.getUint16(0x0a, true); // offset estandar PK6 (0x0A); igual que species+2, coherente con el resto del bloque A
  const abilityId = dec[0x14]; // CONFIRMADO por fuerza bruta contra save real (Julio 2026)
  const natureId = dec[0x1c]; // CONFIRMADO por fuerza bruta contra save real (Julio 2026)

  // --- NUEVO (sin verificar contra save real todavia, cotejar como se hizo
  // con nature/ability antes de fiarse del todo): genero/forma/EVs/IVs/moves.
  // Offsets segun estructura PK6 documentada (misma que usa PKHeX).
  const flagsByte = dec[0x1d]; // bit0 encuentro fortuito, bits1-2 genero, bits3-7 forma
  const fatefulEncounter = (flagsByte & 0x01) !== 0;
  const genderRaw = (flagsByte >> 1) & 0x03; // 0 = macho, 1 = hembra, 2 = sin genero
  const gender = genderRaw === 0 ? 'M' : genderRaw === 1 ? 'F' : null;
  const formId = (flagsByte >> 3) & 0x1f;

  // OJO orden real en el PK6: HP/Atk/Def/Spe/SpA/SpD (Speed va ANTES que
  // los especiales aqui, aunque en pantalla siempre se muestre al reves).
  const evs = {
    hp: dec[0x1e], atk: dec[0x1f], def: dec[0x20],
    spe: dec[0x21], spa: dec[0x22], spd: dec[0x23],
  };

  const moves = [
    view.getUint16(0x5a, true),
    view.getUint16(0x5c, true),
    view.getUint16(0x5e, true),
    view.getUint16(0x60, true),
  ];
  const movePP = [dec[0x62], dec[0x63], dec[0x64], dec[0x65]];

  // Mismo orden real que en EVs: HP/Atk/Def/Spe/SpA/SpD dentro del uint32.
  const iv32 = view.getUint32(0x76, true);
  const ivs = {
    hp:  iv32 & 0x1f,
    atk: (iv32 >>> 5) & 0x1f,
    def: (iv32 >>> 10) & 0x1f,
    spe: (iv32 >>> 15) & 0x1f,
    spa: (iv32 >>> 20) & 0x1f,
    spd: (iv32 >>> 25) & 0x1f,
    isEgg: !!((iv32 >>> 30) & 0x1),
    isNicknamed: !!((iv32 >>> 31) & 0x1),
  };
  // Amistad: el offset 0xEE que se probaba antes no era correcto (daba
  // siempre 0). El campo real es OriginalTrainerFriendship (0xCA) mientras
  // el Pokemon no haya cambiado de entrenador; si CurrentHandler (0x93) no
  // es 0 (se ha intercambiado), el valor vivo pasa a estar en
  // HandlingTrainerFriendship (0xA2) en su lugar -- offsets confirmados
  // contra el save real (Grubbin "Cuerno": CurrentHandler=0, amistad=69).
  const currentHandler = dec[0x93];
  const friendship = currentHandler === 0 ? dec[0xca] : dec[0xa2];

  // PS actual/max: solo existen en el bloque de combate que llevan los del
  // equipo (hasBattleStats), las cajas no los tienen -> confirmado contra
  // save real (offset 0xF0 = PS actual, 0xF2 = PS max).
  const hpCurrent = hasBattleStats ? view.getUint16(0xf0, true) : null;
  const hpMax = hasBattleStats ? view.getUint16(0xf2, true) : null;
  return {
    speciesId: species,
    speciesName: SPECIES_NAMES[species] || `#${species}`,
    nickname: readNickname(dec),
    level,
    exp,
    pid: '0x' + pid.toString(16),
    heldItemId,
    abilityId,
    natureId,
    gender,
    formId,
    fatefulEncounter,
    evs,
    ivs,
    moves,
    movePP,
    friendship,
    hpCurrent,
    hpMax,
  };
}

/**
 * @param {ArrayBuffer} buffer - contenido del archivo "main"
 */
function parseORASSave(buffer) {
  if (buffer.byteLength !== EXPECTED_SIZE) {
    throw new Error(
      `Tamaño de archivo inesperado: ${buffer.byteLength} (se esperaban ${EXPECTED_SIZE} bytes). ` +
      `[Importador pendiente de adaptar a Radical Red] Asegúrate de subir el archivo "main" sin modificar.`
    );
  }
  const data = new Uint8Array(buffer);
  const view = new DataView(buffer);

  // Nombre de entrenador (UTF-16LE terminado en 0x0000)
  const nameBytes = data.slice(TRAINER_CARD_BASE + OT_NAME_OFFSET, TRAINER_CARD_BASE + OT_NAME_OFFSET + 24);
  let name = '';
  for (let i = 0; i < nameBytes.length; i += 2) {
    const code = nameBytes[i] | (nameBytes[i + 1] << 8);
    if (code === 0) break;
    name += String.fromCharCode(code);
  }

  const money = view.getUint32(MONEY_OFFSET, true);
  const badgeMask = data[BADGES_OFFSET];
  const badges = Array.from({ length: 8 }, (_, i) => (badgeMask & (1 << i)) !== 0);
  const badgeCount = badges.filter(Boolean).length;

  const party = [];
  for (let slot = 0; slot < PARTY_SLOTS; slot++) {
    const off = PARTY_BASE + slot * PARTY_SLOT_SIZE;
    const raw = data.slice(off, off + PARTY_SLOT_SIZE);
    const p = readPokemon(raw, true);
    if (p) party.push({ slot, ...p });
  }

  const boxes = [];
  for (let box = 0; box < BOXES; box++) {
    const mons = [];
    for (let slot = 0; slot < BOX_SLOTS; slot++) {
      const off = BOX_BASE + box * BOX_STRIDE + slot * BOX_SLOT_SIZE;
      const raw = data.slice(off, off + BOX_SLOT_SIZE);
      const p = readPokemon(raw, false);
      if (p) mons.push({ slot, ...p });
    }
    if (mons.length > 0) boxes.push({ box: box + 1, mons });
  }

  return { trainerName: name, money, badgeMask, badges, badgeCount, party, boxes };
}

const NATURE_NAMES_ES = ['Fuerte','Huraña','Audaz','Firme','Pícara','Osada','Dócil','Plácida','Agitada','Floja','Miedosa','Activa','Seria','Alegre','Ingenua','Modesta','Afable','Mansa','Tímida','Alocada','Serena','Amable','Grosera','Cauta','Rara'];

// Pokemon Showdown, que no entiende nombres en español.
const NATURE_NAMES_EN = ['Hardy','Lonely','Brave','Adamant','Naughty','Bold','Docile','Relaxed','Impish','Lax','Timid','Hasty','Serious','Jolly','Naive','Modest','Mild','Quiet','Bashful','Rash','Calm','Gentle','Sassy','Careful','Quirky'];

/* ================================================================
   FORMATO POKEMON SHOWDOWN — resuelve nombres de habilidad/objeto/
   movimiento contra PokeAPI (cacheados) y monta el texto que se
   pega en el "Import" del team builder de Showdown.

   IMPORTANTE: los offsets de EVs/IVs/movimientos/genero son NUEVOS
   (no verificados contra un save real todavia, a diferencia de
   especie/habilidad/naturaleza que si se cotejaron a mano). Antes
   de fiaros del todo, comparad el resultado de un Pokemon conocido
   contra lo que dice PKHeX para ese mismo Pokemon, igual que se hizo
   con nature/ability.
   ================================================================ */
const __pokeApiNameCache = {}; // "ability:123" -> "Sturdy" (o promesa mientras carga)

async function fetchPokeApiName(kind, id) {
  if (!id) return null;
  const key = `${kind}:${id}`;
  if (__pokeApiNameCache[key]) return __pokeApiNameCache[key];
  const promise = fetch(`https://pokeapi.co/api/v2/${kind}/${id}`)
    .then(r => r.ok ? r.json() : null)
    .then(data => {
      if (!data) return null;
      const en = (data.names || []).find(n => n.language?.name === 'en');
      return en ? en.name : (data.name || null);
    })
    .catch(() => null);
  __pokeApiNameCache[key] = promise;
  const name = await promise;
  __pokeApiNameCache[key] = name; // sustituye la promesa por el valor resuelto
  return name;
}

function toShowdownGender(mon) {
  return mon.gender === 'M' ? ' (M)' : mon.gender === 'F' ? ' (F)' : '';
}

async function pokemonToShowdownText(mon, levelOverride) {
  const [abilityName, itemName, ...moveNames] = await Promise.all([
    fetchPokeApiName('ability', mon.abilityId),
    mon.heldItemId ? fetchPokeApiName('item', mon.heldItemId) : Promise.resolve(null),
    ...mon.moves.map(id => id ? fetchPokeApiName('move', id) : Promise.resolve(null)),
  ]);

  const nickname = mon.nickname && mon.nickname !== mon.speciesName ? mon.nickname : null;
  const header = nickname
    ? `${nickname} (${mon.speciesName})${toShowdownGender(mon)}`
    : `${mon.speciesName}${toShowdownGender(mon)}`;
  const itemLine = itemName ? ` @ ${itemName}` : '';

  const lines = [header + itemLine];
  if (abilityName) lines.push(`Ability: ${abilityName}`);
  // Showdown recalcula las estadisticas segun el nivel que le pongamos aqui;
  // no hace falta tocar nada mas (EVs/IVs/nature ya hacen su efecto solos).
  const effectiveLevel = levelOverride ?? mon.level;
  if (effectiveLevel && effectiveLevel !== 100) lines.push(`Level: ${effectiveLevel}`);
  if (mon.friendship != null) lines.push(`Happiness: ${mon.friendship}`);

  const evParts = ['hp', 'atk', 'def', 'spa', 'spd', 'spe']
    .filter(k => mon.evs[k] > 0)
    .map(k => `${mon.evs[k]} ${({hp:'HP',atk:'Atk',def:'Def',spa:'SpA',spd:'SpD',spe:'Spe'})[k]}`);
  if (evParts.length) lines.push(`EVs: ${evParts.join(' / ')}`);

  const natureName = NATURE_NAMES_EN[mon.natureId] ?? 'Hardy';
  lines.push(`${natureName} Nature`);

  const ivParts = ['hp', 'atk', 'def', 'spa', 'spd', 'spe']
    .filter(k => mon.ivs[k] < 31)
    .map(k => `${mon.ivs[k]} ${({hp:'HP',atk:'Atk',def:'Def',spa:'SpA',spd:'SpD',spe:'Spe'})[k]}`);
  if (ivParts.length) lines.push(`IVs: ${ivParts.join(' / ')}`);

  moveNames.filter(Boolean).forEach(m => lines.push(`- ${m}`));

  return lines.join('\n');
}

async function copyTeamAsShowdown(team, levelOverride) {

    const texts = await Promise.all(team.map(mon => pokemonToShowdownText(mon, levelOverride)));

      ? `Equipo copiado a Nv.${levelOverride} (Showdown) ✅`
      : 'Equipo copiado en formato Showdown ✅');

async function confirmImportTeam(t){

  const btn = document.getElementById('save-import-confirm');

  for(const p of data.result.party.slice(0,6)){
    try{
      const sp = await fetchPokemonSprite(p.speciesName);
      newTeam.push({
        id: crypto.randomUUID(),
        nickname: p.nickname || sp.name,
        species: sp.name,
        sprite: sp.sprite,
        level: p.level ?? null,
        pid: p.pid || null,
        abilityId: p.abilityId || null,
        abilityName: await fetchPokeApiName('ability', p.abilityId),
        fainted: p.hpCurrent === 0,
      });
    }catch(e){

    }

  playSound('win');

/* ---------------- PokeAPI helpers ---------------- */
async function fetchPokemonSprite(name){
  const resolvedName = normalizeSpeciesName(name);
  const slug = resolvedName.toLowerCase().trim().replace(/\s+/g,'-');
  const res = await fetch('https://pokeapi.co/api/v2/pokemon/'+slug);
  if(!res.ok) throw new Error('not found');
  const data = await res.json();
  const sprite = (data.sprites.other && data.sprites.other['official-artwork'] && data.sprites.other['official-artwork'].front_default) || data.sprites.front_default;
  if(!sprite) throw new Error('no sprite');
  return { name: data.name, sprite };
}
async function fetchItemSprite(name){
  const slug = name.toLowerCase().trim().replace(/\s+/g,'-');
  const res = await fetch('https://pokeapi.co/api/v2/item/'+slug);
  if(!res.ok) throw new Error('not found');
  const data = await res.json();
  const sprite = data.sprites && data.sprites.default;
  if(!sprite) throw new Error('no sprite');
  return { name: data.name, sprite };
}

function typeMultiplier(atkType, defTypes){
  return defTypes.reduce((m, d) => m * (TYPE_CHART[atkType] && TYPE_CHART[atkType][d] !== undefined ? TYPE_CHART[atkType][d] : 1), 1);
}
function typeBadge(t, size){
  const c = TYPE_COLORS[t];
  return `<span class="type-badge${size?' '+size:''}" style="background:${c.bg};color:${c.dark?'#1a1408':'#fff'};">${TYPE_EMOJI[t]} ${TYPE_NAMES_ES[t]}</span>`;
}
let _pokeInfoCache = {};
async function fetchPokemonInfo(name){
  const resolvedName = normalizeSpeciesName(name);
  const slug = resolvedName.toLowerCase().trim().replace(/\s+/g,'-');
  if(_pokeInfoCache[slug]) return _pokeInfoCache[slug];
  const res = await fetch('https://pokeapi.co/api/v2/pokemon/'+slug);
  if(!res.ok) throw new Error('not found');
  const data = await res.json();
  const types = data.types.slice().sort((a,b)=>a.slot-b.slot).map(t=>t.type.name);
  const sprite = (data.sprites.other && data.sprites.other['official-artwork'] && data.sprites.other['official-artwork'].front_default) || data.sprites.front_default;
  const stats = Object.fromEntries(data.stats.map(s=>[s.stat.name, s.base_stat]));
  const info = { name: data.name, types, sprite, stats };
  _pokeInfoCache[slug] = info;
  return info;
}
let _moveInfoCache = {};
async function fetchMoveInfo(name){
  // Si lo que se ha escrito/elegido es un nombre en español, lo traducimos
  // al slug en inglés que espera la PokeAPI. Si no está en el diccionario
  // (p.ej. porque ya se escribió en inglés), se usa tal cual.
  const key = normalizeMoveName(name);
  const enName = MOVE_ES_TO_EN[key] || name;
  const slug = enName.toLowerCase().trim().replace(/\s+/g,'-');
  if(_moveInfoCache[slug]) return _moveInfoCache[slug];
  const res = await fetch('https://pokeapi.co/api/v2/move/'+slug);
  if(!res.ok) throw new Error('not found');
  const data = await res.json();
  const meta = data.meta || {};
  const hasSecondaryEffect = !!(
    (meta.ailment && meta.ailment.name !== 'none') ||
    meta.ailment_chance ||
    meta.flinch_chance ||
    meta.stat_chance
  );
  const info = {
    name: data.name, type: data.type.name, power: data.power || 0,
    category: data.damage_class?.name || 'physical',
    hasSecondaryEffect,
    isContact: !!meta.contact,
  };
  _moveInfoCache[slug] = info;
  return info;
}

async function loadTypeCalcPreview(side, name){
  const request = String(name || '').trim();
  if(!request) return;
  try{
    const info = await fetchPokemonInfo(request);
    const current = side === 'mine' ? typeCalcState.mineText : typeCalcState.rivalText;
    if(current.trim().toLowerCase() !== request.toLowerCase()) return;
    typeCalcState[side === 'mine' ? 'minePreview' : 'rivalPreview'] = info;
    render();
  }catch(e){
    typeCalcState[side === 'mine' ? 'minePreview' : 'rivalPreview'] = null;
  }

async function selectTcTeamPokemon(side, id){
  const s = typeCalcState;
  const trainer = side === 'mine' ? s.trainer : (s.rivalTrainer || TRAINERS.find(t=>t!==s.trainer));
  const rivalTeam = trainer ? (teams[trainer] || []).filter(p=>p && !p.isEgg) : [];
  const rivalCollection = trainer && collections[trainer]
    ? Object.values(collections[trainer].pids || collections[trainer])
    : [];
  const source = side === 'rival' && rivalTeam.length
    ? rivalTeam
    : (side === 'rival' ? rivalCollection : (teams[trainer] || []).filter(p=>p && !p.isEgg));
  const mon = source.find(p=>p && String(p.pid)===String(id));
  const key = side === 'mine' ? 'minePreview' : 'rivalPreview';
  typeCalcState[key] = null;
  typeCalcState.result = null;
  if(mon){
    if(side === 'rival' && mon.level) typeCalcState.rivalLevel = mon.level;
    try{
      typeCalcState[key] = await fetchPokemonInfo(mon.species);
      typeCalcState[key].level = typeCalcState.damageMode === 'level50'
        ? 50
        : (mon.level || 50);
    }
    catch(e){ typeCalcState.err = 'No se ha podido cargar la información del Pokémon.'; }
  }
  render();
}

function computeTypeResult(mineInfo, rivalInfo, moveInfo){
  const ability = attackerAbilityEffects(mineInfo.abilityName, moveInfo);
  const effectiveMove = ability.convertedType
    ? { ...moveInfo, type: ability.convertedType }
    : moveInfo;
  const baseMult = typeMultiplier(effectiveMove.type, rivalInfo.types);
  const stab = mineInfo.types.includes(effectiveMove.type);
  const stabMultiplier = stab ? ability.stab : 1;
  const totalMult = baseMult * stabMultiplier * ability.move;
  const damage = computeDamage(mineInfo, rivalInfo, effectiveMove, baseMult, stab, ability);
  return { baseMult, stab, totalMult, mineInfo, rivalInfo, moveInfo: effectiveMove, damage, ability };
}

function statAtLevel(base, level, iv, ev, hp){
  const core = Math.floor(((2 * base + iv + Math.floor(ev / 4)) * level) / 100);
  return hp ? core + level + 10 : core + 5;
}

function tcLevel(value, fallback = 50){
  const level = Number(value);
  return Number.isFinite(level) ? Math.max(1, Math.min(100, Math.floor(level))) : fallback;
}

function normalizeAbilityKey(name){
  return String(name || '').toLowerCase().trim()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
}

function attackerAbilityEffects(abilityName, moveInfo){
  const ability = normalizeAbilityKey(abilityName);
  const move = normalizeAbilityKey(moveInfo.name);
  const effects = { attack:1, move:1, stab:1.5, labels:[] };

  // Habilidades de Gen 6 que modifican directamente el daño. Las que
  // necesitan conocer clima, PS actuales, estado, género o una activación
  // previa no se fuerzan porque la calculadora no dispone de esos datos.
  if(['huge-power', 'pure-power', 'potencia', 'poder-puro'].includes(ability)){
    effects.attack = 2;
    effects.labels.push('Potencia ×2 Ataque');
  }
  if(ability === 'hustle' && moveInfo.category === 'physical'){
    effects.attack *= 1.5;
    effects.labels.push('Entusiasmo: Ataque físico ×1,5');
  }
  if(ability === 'adaptability'){
    effects.stab = 2;
    effects.labels.push('Adaptabilidad: STAB ×2');
  }
  if(ability === 'technician' && moveInfo.power > 0 && moveInfo.power <= 60){
    effects.move *= 1.5;
    effects.labels.push('Experto: potencia ×1,5');
  }
  if(ability === 'iron-fist' && [
    'comet-punch','bullet-punch','ice-punch','fire-punch','thunder-punch',
    'drain-punch','mach-punch','focus-punch','dynamic-punch','hammer-arm',
    'power-up-punch','shadow-punch','meteor-mash','double-iron-bash',
    'plasma-fists'
  ].includes(move)){
    effects.move *= 1.2;
    effects.labels.push('Puño Férreo: movimiento ×1,2');
  }
  if(ability === 'strong-jaw' && [
    'bite','crunch','fire-fang','ice-fang','thunder-fang','poison-fang',
    'hyper-fang','super-fang','psychic-fangs','jaw-lock'
  ].includes(move)){
    effects.move *= 1.5;
    effects.labels.push('Mandíbula Fuerte: movimiento ×1,5');
  }
  if(ability === 'mega-launcher' && [
    'water-pulse','dark-pulse','dragon-pulse','aura-sphere','origin-pulse',
    'terrain-pulse','heal-pulse'
  ].includes(move)){
    effects.move *= 1.5;
    effects.labels.push('Megadisparador: movimiento ×1,5');
  }
  if(ability === 'tough-claws' && moveInfo.isContact){
    effects.move *= 4 / 3;
    effects.labels.push('Garra Dura: contacto ×1,33');
  }
  if(ability === 'reckless' && [
    'double-edge','take-down','submission','jump-kick','high-jump-kick',
    'flare-blitz','brave-bird','head-smash','wood-hammer','volt-tackle',
    'wild-charge'
  ].includes(move)){
    effects.move *= 1.2;
    effects.labels.push('Audaz: movimiento ×1,2');
  }
  if(ability === 'sheer-force' && moveInfo.hasSecondaryEffect){
    effects.move *= 1.3;
    effects.labels.push('Potencia Bruta: movimiento ×1,3');
  }
  if(ability === 'neuroforce' && moveInfo.power > 0){
    // Neuroforce aumenta un 25% los golpes supereficaces. La comprobación
    // exacta de eficacia se hace en computeTypeResult.
    effects.neuroforce = true;
    effects.labels.push('Fuerza Cerebral: golpe supereficaz ×1,25');
  }
  const conversionAbilities = {
    aerilate: ['flying', 'Aerilate: movimiento Normal → Volador ×1,3'],
    pixilate: ['fairy', 'Piel Feérica: movimiento Normal → Hada ×1,3'],
    refrigerate: ['ice', 'Piel Helada: movimiento Normal → Hielo ×1,3'],
  };
  if(conversionAbilities[ability] && moveInfo.type === 'normal'){
    effects.convertedType = conversionAbilities[ability][0];
    effects.move *= 1.3;
    effects.labels.push(conversionAbilities[ability][1]);
  }
  if(['normalize', 'normalidad'].includes(ability)){
    effects.convertedType = 'normal';
    effects.labels.push('Normalidad: movimiento convertido a Normal');
  }
  return effects;
}

function computeDamage(mineInfo, rivalInfo, moveInfo, typeMultiplierValue, stab, ability){
  if(!moveInfo.power || typeMultiplierValue === 0){
    const hp = statAtLevel(rivalInfo.stats.hp, rivalInfo.level || 50, 31, 252, true);
    return { min:0, max:0, hp, minPct:0, maxPct:0, remainingMin:100, remainingMax:100 };
  }
  const attackerStat = moveInfo.category === 'special' ? 'special-attack' : 'attack';
  const defenderStat = moveInfo.category === 'special' ? 'special-defense' : 'defense';
  const attack = Math.floor(statAtLevel(mineInfo.stats[attackerStat], mineInfo.level || 50, 0, 0, false) * ability.attack);
  const defense = statAtLevel(rivalInfo.stats[defenderStat], rivalInfo.level || 50, 31, 252, false);
  const hp = statAtLevel(rivalInfo.stats.hp, rivalInfo.level || 50, 31, 252, true);
  const effectivePower = Math.floor(moveInfo.power * ability.move);
  const base = Math.floor(Math.floor(Math.floor((Math.floor(2 * (mineInfo.level || 50) / 5) + 2) * effectivePower * attack / defense) / 50) + 2);
  const neuroforce = ability.neuroforce && typeMultiplierValue > 1 ? 1.25 : 1;
  const modifier = (stab ? ability.stab : 1) * typeMultiplierValue * neuroforce;
  const values = [0.85, 1].map(random => Math.floor(base * modifier * random));
  const min = Math.min(...values);
  const max = Math.max(...values);
  return { min, max, hp, minPct: min / hp * 100, maxPct: max / hp * 100, remainingMin: Math.max(0, 100 - max / hp * 100), remainingMax: Math.max(0, 100 - min / hp * 100) };
}

function renderTypeResult(r){
  const b = r.baseMult;
  let label, cls;
  if(b === 0){ label = '❌ No afecta'; cls = 'bad'; }
  else if(b >= 4){ label = '💥 ¡Es muchísimo más eficaz!'; cls = 'good'; }
  else if(b === 2){ label = '✅ ¡Es supereficaz!'; cls = 'good'; }
  else if(b === 1){ label = '➖ Eficacia normal'; cls = 'mid'; }
  else { label = '⚠️ No es muy eficaz...'; cls = 'bad'; }
  const fmt = n => (n % 1 === 0 ? n : n.toFixed(2));
  const d = r.damage;
  const damageWidth = d ? Math.min(100, Math.max(0, d.maxPct)) : 0;
  const remainingWidth = d ? Math.min(100, Math.max(0, d.remainingMin)) : 100;
  const koNote = d && d.min >= d.hp
    ? '<div class="tc-ko-note always">✅ MATA SIEMPRE</div>'
    : d && d.max < d.hp
      ? '<div class="tc-ko-note never">❌ NO MATA NUNCA</div>'
      : d
        ? '<div class="tc-ko-note maybe">⚠️ PUEDE MATAR O NO, según el daño aleatorio</div>'
        : '';
  return `
    <div class="type-calc-result ${cls}">
      <div class="tc-mult">x${fmt(b)}</div>
      <div class="tc-label">${label}</div>
      ${r.stab ? `<div class="tc-stab">✨ STAB (mismo tipo que ${r.mineInfo.name}) → con STAB serían <b>x${fmt(r.totalMult)}</b></div>` : ''}
      ${r.ability && r.ability.convertedType === 'normal' ? `<div class="tc-ko-note maybe">⚠️ NORMALIDAD: este movimiento se calcula como <b>tipo Normal</b>.</div>` : ''}
      ${r.ability && r.ability.labels.length ? `<div class="tc-stab">✨ Habilidad de ${r.mineInfo.name}: <b>${r.mineInfo.abilityName}</b> · ${r.ability.labels.join(' · ')}</div>` : ''}
      ${d ? `
        <div class="tc-damage-panel">
          <div class="tc-damage-card">
            <div class="tc-damage-head">
              <div class="tc-damage-title">❤️ Vida máxima del rival</div>
              <div class="tc-damage-value">${d.hp} PS</div>
            </div>
            <div class="tc-hp-total"><span>Antes del golpe</span><span>100%</span></div>
            <div class="tc-hp-bar"><div class="tc-hp-fill remaining" style="width:100%"></div></div>
          </div>
          <div class="tc-damage-card damage">
            <div class="tc-damage-head">
              <div class="tc-damage-title">💥 Daño recibido</div>
              <div class="tc-damage-value">${d.min}–${d.max} PS</div>
            </div>
            <div class="tc-damage-detail">${d.minPct.toFixed(1)}–${d.maxPct.toFixed(1)}% de su vida</div>
            <div class="tc-hp-bar"><div class="tc-hp-fill damage" style="width:${damageWidth}%"></div></div>
          </div>
          <div class="tc-damage-card remaining">
            <div class="tc-damage-head">
              <div class="tc-damage-title">🟢 Vida que le queda</div>
              <div class="tc-damage-value">${d.remainingMin.toFixed(1)}–${d.remainingMax.toFixed(1)}%</div>
            </div>
            <div class="tc-damage-detail">${Math.max(0, d.hp - d.max)}–${Math.max(0, d.hp - d.min)} PS restantes</div>
            <div class="tc-hp-bar"><div class="tc-hp-fill remaining" style="width:${remainingWidth}%"></div></div>
          </div>
        </div>
        ${koNote}
      ` : ''}
      <div class="tc-sub">${typeBadge(r.moveInfo.type)} de <b>${r.mineInfo.name}</b> contra <b>${r.rivalInfo.name}</b> (${r.rivalInfo.types.map(t=>typeBadge(t,'sm')).join(' ')})</div>
    </div>`;
}

async function resolveMineInfo(){
  const s = typeCalcState;
  const myTeam = (teams[s.trainer]||[]).filter(p=>p && !p.fainted && !p.isEgg);
  if(myTeam.length){
    const monId = s.mineId;
    if(!monId) throw new Error('no mine');
    const mon = myTeam.find(p=>String(p.pid)===String(monId));
    const species = s.mineSpecies || mon?.species;
    if(!species) throw new Error('no mine');
    const info = await fetchPokemonInfo(species);
    info.level = s.damageMode === 'level50' ? 50 : (mon?.level || 50);
    info.abilityName = mon?.abilityName || await fetchPokeApiName('ability', mon?.abilityId);
    return info;
  }
  const txt = s.mineText.trim();
  if(!txt) throw new Error('no mine');
  const info = await fetchPokemonInfo(txt);
  info.level = 50;
  return info;
}
async function resolveRivalInfo(){
  const s = typeCalcState;
  if(s.rivalMode === 'team'){
    const rt = s.rivalTrainer || TRAINERS.find(t=>t!==s.trainer);
    const monId = s.rivalId;
    if(!monId) throw new Error('no rival');
    const mon = (teams[rt]||[]).find(p=>String(p.pid)===String(monId) && !p.isEgg);
    const species = s.rivalSpecies || mon?.species;
    if(!species) throw new Error('no rival');
    const info = await fetchPokemonInfo(species);
    info.level = s.damageMode === 'level50' ? 50 : tcLevel(s.rivalLevel);
    return info;
  }
  const txt = s.rivalText.trim();
  if(!txt) throw new Error('no rival');
  const info = await fetchPokemonInfo(txt);
  info.level = s.damageMode === 'level50' ? 50 : tcLevel(s.rivalLevel);
  return info;
}

async function calcTypeMatch(){
  const s = typeCalcState;
  const mineInput = document.getElementById('tc-mine-txt');
  const rivalInput = document.getElementById('tc-rival-txt');
  const mineSelect = document.getElementById('tc-mine-sel');
  const rivalTrainerSelect = document.getElementById('tc-rival-trainer-sel');
  const rivalSelect = document.getElementById('tc-rival-sel');
  const moveInput = document.getElementById('tc-move-txt');
  if(mineInput) s.mineText = mineInput.value.trim();
  if(rivalInput) s.rivalText = rivalInput.value.trim();
  if(mineSelect) s.mineId = mineSelect.value;
  if(rivalTrainerSelect) s.rivalTrainer = rivalTrainerSelect.value;
  if(mineSelect) s.mineSpecies = mineSelect.selectedOptions[0]?.dataset.species || '';
  if(rivalSelect){
    s.rivalId = rivalSelect.value;
    s.rivalSpecies = rivalSelect.selectedOptions[0]?.dataset.species || '';
  }
  if(moveInput) s.moveText = moveInput.value.trim();
  const moveText = s.moveText;
  if(!moveText){ s.err = 'Escribe qué movimiento vas a usar.'; s.result = null; render(); return; }
  s.err = ''; s.loading = true; render();
  try{
    let mineInfo, rivalInfo, moveInfo;
    try{ mineInfo = await resolveMineInfo(); }
    catch(e){ throw new Error('Elige tu Pokémon.'); }
    try{ rivalInfo = await resolveRivalInfo(); }
    catch(e){ throw new Error('Elige el Pokémon rival.'); }
    try{ moveInfo = await fetchMoveInfo(moveText); }
    catch(e){ throw new Error(`No he encontrado el movimiento "${moveText}". Prueba a escribirlo en español (ej: terremoto) o en inglés (ej: earthquake).`); }
    s.result = computeTypeResult(mineInfo, rivalInfo, moveInfo);
  }catch(e){
    s.result = null;
    s.err = e.message || 'Revisa que hayas elegido los dos Pokémon y un movimiento que exista.';
  }
  s.loading = false;
  render();
}


/* ---------------- Autocomplete ---------------- */
function attachAutocomplete(inputEl, dropdownEl, getList){
  inputEl.addEventListener('input', ()=>{
    const val = inputEl.value.trim().toLowerCase();
    if(val.length < 3){ dropdownEl.classList.remove('show'); dropdownEl.innerHTML=''; return; }
    const list = getList();
    const matches = list.filter(n=> n.startsWith(val)).slice(0, 8);
    if(matches.length === 0){ dropdownEl.classList.remove('show'); dropdownEl.innerHTML=''; return; }
    dropdownEl.innerHTML = matches.map(n=>`<div class="autocomplete-item">${n.replace(/-/g,' ')}</div>`).join('');
    dropdownEl.classList.add('show');
    [...dropdownEl.children].forEach((el,i)=>{
      el.onmousedown = event => event.preventDefault();
      el.onclick = ()=>{
        inputEl.value = matches[i];
        inputEl.dispatchEvent(new Event('input', { bubbles: true }));
        if(inputEl.id === 'tc-mine-txt') loadTypeCalcPreview('mine', inputEl.value);
        if(inputEl.id === 'tc-rival-txt') loadTypeCalcPreview('rival', inputEl.value);
        dropdownEl.classList.remove('show'); dropdownEl.innerHTML='';
        inputEl.focus();
      };
    });
  });
  inputEl.addEventListener('blur', ()=> setTimeout(()=>{ dropdownEl.classList.remove('show'); }, 150));
}

  if(closable){

async function confirmRevealAbility(targetTrainer){
  const payer = document.getElementById('reveal-payer-select').value;
  const err = document.getElementById('reveal-err');
  if((tickets[payer]||0) < ABILITY_REVEAL_COST){
    err.textContent = `${NAMES[payer]} no tiene suficientes tickets.`;
    return;
  }
  const pool = allMonsOf(targetTrainer).filter(m=>m.inTeam && !m.isEgg);
  if(pool.length === 0){
    err.textContent = `${NAMES[targetTrainer]} no tiene ningún Pokémon del que se pueda revelar la habilidad en el equipo activo.`;
    return;
  }
  const mon = pool[Math.floor(Math.random()*pool.length)];
  await addTickets(payer, -ABILITY_REVEAL_COST, `Revelar habilidad (Pokémon de ${NAMES[targetTrainer]})`);
  pushHistory(`🔍 ${NAMES[payer]} pagó ${ABILITY_REVEAL_COST} tickets y descubrió que el ${mon.nickname} de ${NAMES[targetTrainer]} tiene ${mon.abilityName || 'una habilidad desconocida'}`);
  openModal(`

    <div style="text-align:center;margin:12px 0;">
      <img loading="lazy" src="${mon.sprite}" style="width:96px;height:96px;">

}
