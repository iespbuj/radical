<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#12060a">
<title>Locke Navideño · Radical Red</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎄%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Outfit:wght@400;500;600&family=Space+Mono:wght@400;700&family=Unbounded:wght@500;700;800&display=swap');
:root{
  /* --- paleta fija de Cueva Celeste / Guarida Rocket: propia, nadie la pisa --- */
  --lava: #e8405a;
  --lava-hot: #ff6b7f;
  --lava-deep: #7a0f24;
  --ember: #ffdf80;
  --obsidian: #0a0a0c;
  --obsidian-2: #141418;
  --ash: #6b6b76;
  --rockcrack: #ff4d63;
  --bg: #0e0a0b;
  --bg-elev: #1c1516;
  --panel: #241c1d;
  --panel-2: #26262f;
  --border: #3a3a46;
  --silver: #d8d8e0;
  --silver-dim: #8c8c99;
  --silver-bright: #faf6f5;
  --accent: #e8405a;
  --accent-dim: #8c1428;
  --danger: #ff3b30;
  --danger-dim: #7a1810;
  --gold: #d4af37;
}
*{ box-sizing: border-box; }
html, body{ margin:0; padding:0; }
body{
  background: radial-gradient(ellipse at 50% -10%, #2a0a14 0%, var(--bg) 55%);
  color: var(--silver);
  font-family: var(--f-body);
  min-height: 100vh;
  padding-bottom: 60px;
}
::selection{ background: var(--accent-dim); color: var(--silver-bright); }
@keyframes shimmer{
  0%{ background-position: 200% 0; }
  100%{ background-position: -50% 0; }
}
@keyframes breakGem{
  0%{ transform: scale(1) rotate(0deg); }
  40%{ transform: scale(1.4) rotate(10deg); opacity: .6; }
  100%{ transform: scale(1) rotate(0deg); opacity: .5; }
}
.pick-mon-item{
  background: var(--panel); border:1px solid var(--border); border-radius: 4px;
  padding: 8px 12px; margin-bottom:6px; transition: border-color .15s ease, background .15s ease;
}
.pick-mon-item:hover{ border-color: var(--accent-dim); background: var(--panel-2); }
.pick-mon-item .n-text{ color: var(--silver-bright); font-size:13px; font-weight:600; }
.pick-mon-item .n-meta{ color: var(--silver-dim); font-size: 11px; text-transform:capitalize; }
.trade-toolbar{
  display:flex; align-items:center; justify-content:center; gap: 14px;
  margin: 18px 0 30px; flex-wrap:wrap;
}
.trade-count-pill{
  font-family:var(--f-mono); font-size:12px; color: var(--silver-dim);
  border:1px solid var(--border); border-radius:999px; padding:9px 18px;
  background: var(--panel);
}
.trade-count-pill strong{ color: var(--silver-bright); font-weight:600; }
.trade-card{
  background: linear-gradient(165deg, var(--panel) 0%, var(--bg-elev) 100%);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 20px 22px 20px;
  max-width: 640px; margin: 0 auto 18px;
  position:relative; overflow:hidden;
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.trade-card::before{
  content:''; position:absolute; top:0; left:0; right:0; height:3px;
  background: linear-gradient(90deg, var(--accent), var(--gold));
}
.trade-card:hover{ transform: translateY(-2px); box-shadow: 0 10px 26px rgba(0,0,0,0.35); border-color: var(--accent-dim); }
.trade-card.closed{ opacity: .88; }
.trade-card.closed::before{ background: linear-gradient(90deg, var(--silver-dim), var(--border)); }
.trade-card-top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:18px; gap:10px; flex-wrap:wrap; }
.trade-offerer-name{ font-family:var(--f-ui); font-weight:700; color: var(--silver-bright); font-size:17px; letter-spacing:.5px; }
.trade-offerer-tag{ font-size:11px; color: var(--silver-dim); text-transform:uppercase; letter-spacing:1.5px; margin-top:2px; }
.trade-top-right{ display:flex; align-items:center; gap:12px; }
.trade-time{ font-family:var(--f-mono); font-size:11px; color: var(--silver-dim); }
.trade-icon-cancel{
  background:none; border:1px solid var(--border); color: var(--silver-dim); cursor:pointer;
  font-size:13px; width:26px; height:26px; border-radius:50%; line-height:1;
  display:flex; align-items:center; justify-content:center;
  transition: color .15s ease, border-color .15s ease;
}
.trade-icon-cancel:hover{ color: var(--danger); border-color: var(--danger-dim); }
.trade-closed-tag{
  font-family:var(--f-ui); font-size:10.5px; font-weight:700; letter-spacing:1.5px;
  color: var(--gold); border:1px solid var(--gold); border-radius:999px; padding:3px 11px;
}
.trade-lane{ display:flex; align-items:stretch; gap: 12px; }
.trade-side{ flex:1; min-width:0; }
.trade-side-label{
  font-family:var(--f-ui); font-size:10.5px; font-weight:700; letter-spacing:1.5px;
  text-transform:uppercase; color: var(--silver-dim); margin-bottom:9px; display:block;
}
.trade-link{
  flex: 0 0 auto; display:flex; align-items:center; justify-content:center;
  width: 36px; position:relative;
}
.trade-link::before, .trade-link::after{
  content:""; position:absolute; left:50%; width:1px;
  background: linear-gradient(var(--border), transparent);
}
.trade-link::before{ top:0; height: calc(50% - 14px); }
.trade-link::after{ bottom:0; height: calc(50% - 14px); transform: rotate(180deg); }
.trade-link svg{ width:22px; height:22px; position:relative; z-index:1; filter: drop-shadow(0 0 6px rgba(255,77,61,0.45)); }
.trade-side.empty-side{
  border: 1px dashed var(--border); border-radius: 5px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:9px;
  padding: 14px 12px; min-height: 66px; text-align:center;
}
.trade-side.empty-side .empty-txt{ font-size:11.5px; color: var(--silver-dim); line-height:1.4; }
.trade-counters{ margin-top: 18px; padding-top: 16px; border-top: 1px dashed var(--border); }
.trade-counters-label{
  font-family:var(--f-ui); font-size:11px; font-weight:700; letter-spacing:1.5px;
  text-transform:uppercase; color: var(--silver-dim); margin-bottom: 14px;
}
.trade-counter-row{
  margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--border);
}
.trade-counter-row:last-child{ margin-bottom:0; padding-bottom:0; border-bottom:none; }
.trade-counter-accept{ display:flex; justify-content:flex-end; margin-top:10px; }
.trade-card-foot{ display:flex; gap:8px; margin-top: 18px; flex-wrap:wrap; }
.chip-row{ display:flex; flex-wrap:wrap; gap: 8px; }
.chip{
  display:flex; align-items:center; gap: 6px;
  background: linear-gradient(160deg, var(--bg-elev) 0%, var(--panel-2) 100%);
  border:1px solid var(--border); border-radius: 999px;
  padding: 4px 12px 4px 4px; font-size: 12px;
  box-shadow: 0 3px 8px rgba(0,0,0,0.25);
  transition: transform .12s ease, border-color .12s ease;
}
.chip:hover{ transform: translateY(-1px); border-color: var(--accent-dim); }
.chip img{ width: 22px; height:22px; object-fit:contain; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.4)); }
.chip span{ text-transform:capitalize; font-weight:600; color: var(--silver-bright); }
@media (max-width: 480px){
.trade-lane{ flex-direction:column; gap: 14px; }
.trade-link{ width:100%; height: 22px; }
.trade-link::before, .trade-link::after{ display:none; }
}
.countdown-screen{
  position:fixed; inset:0; z-index:10000; display:grid; place-items:center; overflow:hidden;
  color:#e7d5ce; background:#030101;
  font-family:'Outfit',sans-serif;
  isolation:isolate;
  transition:opacity 1.2s ease, visibility 1.2s ease;
}
.countdown-screen::before,.countdown-screen::after{
  content:''; position:absolute; inset:-35%; z-index:-1; pointer-events:none;
}
.countdown-screen::before{
  background:
    radial-gradient(ellipse at 50% 52%,#000 0%,#030101 22%,rgba(9,3,4,.82) 32%,transparent 53%),
    radial-gradient(ellipse at 50% 52%,transparent 31%,rgba(76,33,40,.09) 36%,transparent 44%),
    radial-gradient(ellipse at 50% 52%,#0a0405 0%,#030101 57%,#000 100%);
  animation:countdown-breathe 11s ease-in-out infinite alternate;
}
.countdown-screen::after{
  inset:-10%; opacity:.17;
  background:
    radial-gradient(1px 1px at 14% 27%,#e7d4cc 98%,transparent),
    radial-gradient(1px 1px at 73% 18%,#e77881 98%,transparent),
    radial-gradient(1px 1px at 83% 69%,#e7d4cc 98%,transparent),
    radial-gradient(1px 1px at 23% 78%,#e77881 98%,transparent),
    radial-gradient(1px 1px at 56% 88%,#e7d4cc 98%,transparent),
    repeating-conic-gradient(from 0deg at 50% 52%,transparent 0deg 11deg,rgba(201,35,49,.045) 12deg,transparent 14deg 29deg);
  background-size:31% 37%,43% 49%,37% 41%,47% 43%,39% 51%,100% 100%;
  animation:countdown-turn 150s linear infinite;
}
.countdown-vortex{
  position:absolute; width:min(88vw,900px); aspect-ratio:1; border-radius:50%; z-index:-1;
  background:
    radial-gradient(circle at 50% 50%,#000 0 18%,rgba(4,1,2,.98) 24%,transparent 37%),
    radial-gradient(ellipse,transparent 37%,rgba(67,31,37,.13) 43%,rgba(212,37,52,.12) 44%,transparent 44.5%,transparent 54%,rgba(72,38,44,.13) 55%,rgba(208,37,51,.08) 56%,transparent 56.5%,transparent 67%,rgba(103,56,64,.1) 68%,transparent 68.5%);
  filter:blur(2px); animation:countdown-turn 68s linear infinite;
}
.countdown-vortex::before,.countdown-vortex::after{
  content:''; position:absolute; inset:10%; border:1px solid rgba(223,73,86,.075);
  border-radius:42% 58% 61% 39% / 42% 38% 62% 58%;
  box-shadow:0 0 70px rgba(99,48,56,.09),inset 0 0 70px rgba(94,44,52,.075);
  animation:countdown-morph 20s ease-in-out infinite alternate;
}
.countdown-vortex::after{ inset:21%; animation-duration:28s; animation-direction:alternate-reverse; }
.countdown-content{
  width:min(880px,100%); padding:32px 22px; text-align:center; position:relative;
  animation:countdown-arrive 2s cubic-bezier(.18,.72,.22,1) both;
}
.countdown-eyebrow{
  color:#756a83; font:700 9px 'Space Mono',monospace; letter-spacing:.48em;
  text-transform:uppercase; margin-bottom:26px; opacity:.82;
}
.countdown-title{
  margin:0; color:#eee1db; font:800 clamp(42px,10vw,98px) 'Unbounded',sans-serif;
  letter-spacing:.16em; text-indent:.16em;
  background:linear-gradient(180deg,#f8f2ef 8%,#d0ad9e 56%,#6d647b 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 0 24px rgba(214,38,52,.19));
}
.countdown-subtitle{
  margin:17px 0 44px; color:#777080; font:500 clamp(12px,2vw,15px) 'Chakra Petch',sans-serif;
  letter-spacing:.38em; text-transform:uppercase;
}
.countdown-clock{display:flex; justify-content:center; align-items:flex-start; gap:clamp(8px,3vw,30px);}
.countdown-unit{min-width:clamp(58px,12vw,110px);}
.countdown-value{
  display:block; color:#e9d9d2; font:700 clamp(31px,7vw,62px) 'Space Mono',monospace;
  line-height:1.05; text-shadow:0 0 22px rgba(227,99,109,.18);
}
.countdown-label{display:block; margin-top:11px; color:#625a6c; font:700 8px 'Space Mono',monospace; letter-spacing:.25em;}
.countdown-separator{padding-top:4px; color:#5d4246; font:700 clamp(24px,5vw,46px) 'Space Mono',monospace; opacity:.64;}
.countdown-date{
  display:inline-block; margin-top:38px; padding:12px 20px;
  border-top:1px solid rgba(223,76,88,.13); color:#746c7e;
  font:500 10px 'Chakra Petch',sans-serif; letter-spacing:.2em;
}
.countdown-gate{
  position:fixed; right:0; bottom:0; z-index:2; width:52px; height:52px;
  border:0; padding:0; background:transparent; opacity:0; cursor:pointer;
}
.countdown-gate:focus-visible{opacity:1; outline:2px solid #d2afa0; outline-offset:-5px; border-radius:50%;}
.countdown-screen.unlocking{opacity:0; visibility:hidden; pointer-events:none;}
@keyframes countdown-turn{to{transform:rotate(360deg)}}
@keyframes countdown-breathe{from{transform:scale(.97);opacity:.78}to{transform:scale(1.035);opacity:1}}
@keyframes countdown-morph{to{transform:rotate(24deg) scale(1.045);border-radius:58% 42% 39% 61% / 38% 62% 42% 58%}}
@keyframes countdown-arrive{from{opacity:0;transform:translateY(18px) scale(.985);filter:blur(7px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
@media(max-width:480px){.countdown-content{padding:20px 10px}.countdown-subtitle{margin-bottom:34px}.countdown-date{font-size:10px}}
@media(prefers-reduced-motion:reduce){.countdown-screen::before,.countdown-screen::after,.countdown-vortex,.countdown-vortex::before,.countdown-vortex::after{animation:none}}
.modal-overlay{
  position:fixed; inset:0; background: rgba(11,6,7,0.72);
  display:flex; align-items:center; justify-content:center; z-index: 100;
  padding: 20px;
}
.modal{
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 26px;
  width: 100%; max-width: 420px;
  max-height: 85vh; overflow-y:auto;
}
.modal h3{
  font-family:var(--f-ui); letter-spacing:1px; color: var(--silver-bright);
  margin: 0 0 16px; font-size: 20px;
}
.field{ margin-bottom: 14px; }
.duel-bet-panel{
  max-width: 360px; margin: -6px auto 18px;
  background: linear-gradient(160deg, var(--panel) 0%, var(--bg-elev) 100%);
  border: 1px solid var(--border); border-top: 3px solid var(--neon-green);
  border-radius: 6px; padding: 16px 18px;
}
.duel-bet-title{
  font-family:var(--f-ui); font-weight:800; letter-spacing:.5px; font-size:14px;
  color: var(--silver-bright); margin-bottom: 10px; text-align:center;
}
.duel-bet-list{ display:flex; flex-direction:column; gap:6px; margin-bottom: 12px; }
.duel-bet-row{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  background: rgba(255,255,255,0.03); border:1px solid var(--border); border-radius: 3px;
  padding: 6px 10px; font-size: 12px; color: var(--silver-bright);
}
.duel-bet-row .dbr-arrow{ color: var(--silver-dim); flex:1; text-align:center; }
.duel-bet-row .dbr-amount{ color: var(--neon-green); font-weight:700; }
.field label{ display:block; font-size: 12px; color: var(--silver-dim); margin-bottom:6px; letter-spacing:0.5px; }
.field input, .field select{
  width:100%; background: var(--panel); border:1px solid var(--border); border-radius: 3px;
  padding: 10px 12px; color: var(--silver-bright); font-family:var(--f-body); font-size: 14px;
}
.field textarea{
  width:100%; background: var(--panel); border:1px solid var(--border); border-radius: 3px;
  padding: 10px 12px; color: var(--silver-bright); font-family:var(--f-body); font-size: 14px;
  min-height: 90px; resize: vertical; font-family:var(--f-body);
}
.field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color: var(--gold); box-shadow: 0 0 8px rgba(255,200,60,0.25); }
.modal-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top: 18px; }
.news-list{ max-height: 320px; overflow-y:auto; display:flex; flex-direction:column; gap:2px; }
.news-item{
  display:flex; justify-content:space-between; align-items:center; gap:10px;
  padding: 9px 4px; border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.news-item:last-child{ border-bottom:none; }
.news-text{ color: var(--silver-bright); line-height:1.4; }
.news-time{ font-size: 11px; color: var(--silver-dim); white-space:nowrap; flex-shrink:0; }
.poke-detail-hero{
  position:relative; text-align:center; padding: 22px 16px 16px;
  border-radius: 6px; margin-bottom: 14px;
  background: radial-gradient(circle at 50% 0%, var(--accent-dim) 0%, var(--bg-elev) 75%);
  border: 1px solid var(--border);
}
.poke-detail-hero img{ width: 104px; height: 104px; image-rendering: pixelated; filter: drop-shadow(0 6px 10px rgba(0,0,0,.35)); }
.poke-detail-name{ font-family:var(--f-ui); font-size: 20px; font-weight:700; color: var(--silver-bright); letter-spacing:.3px; margin-top:2px; }
.poke-detail-species{ font-size: 12px; color: var(--silver-dim); text-transform:capitalize; }
.poke-detail-tag{
  position:absolute; top:10px; left:10px; font-size:10px; font-weight:600;
  padding: 3px 9px; border-radius:999px; letter-spacing:.3px;
  background: rgba(255,77,61,0.16); color:#ffd0c8; border:1px solid rgba(255,77,61,0.4);
}
.poke-detail-tag.fainted{ background: rgba(224,92,92,0.16); color:#ff9a9a; border-color:rgba(224,92,92,0.4); }
.poke-detail-grid{
  display:grid; grid-template-columns: 1fr 1fr; gap:8px;
}
.poke-detail-stat{
  background: var(--panel); border:1px solid var(--border); border-radius: 4px;
  padding: 8px 12px; display:flex; flex-direction:column; gap:2px;
}
.pd-label{ font-size:10px; letter-spacing:.5px; text-transform:uppercase; color: var(--silver-dim); }
.pd-value{ font-size:14px; font-weight:600; color: var(--silver-bright); }
.cemetery-grid{
  display:grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap:12px;
}
.tomb{
  background: linear-gradient(160deg, var(--panel) 0%, var(--bg-elev) 100%);
  border:1px solid var(--border); border-radius: 6px; padding:14px 10px;
  text-align:center; position:relative;
}
.tomb::before{ content:'🪦'; position:absolute; top:8px; right:10px; font-size:14px; opacity:.5; }
.tomb img{ width:56px; height:56px; filter: grayscale(1) brightness(.85); image-rendering:pixelated; }
.tomb-name{ font-size:13px; font-weight:700; color: var(--silver-bright); margin-top:2px; }
.tomb-species{ font-size:10px; color: var(--silver-dim); text-transform:capitalize; }
.tomb-meta{ font-size:10px; color: var(--silver-dim); margin-top:4px; }
.tomb-date{ font-size:9px; color: var(--silver-dim); opacity:.6; margin-top:4px; }
.tomb-stack-wrap{
  position:relative; max-width:340px; height:420px; margin: 24px auto 10px;
}
.tomb-stack-hint{
  text-align:center; font-family:var(--f-ui); font-size:12px; color: var(--silver-dim);
  letter-spacing:.5px; margin-top:6px;
}
.tomb-card{
  position:absolute; inset:0; border-radius: 8px; cursor:pointer; user-select:none;
  background: linear-gradient(165deg, #280b10 0%, #18070a 100%);
  border:1px solid var(--border);
  box-shadow: 0 14px 34px rgba(0,0,0,.5);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding: 26px 20px; text-align:center;
  transition: transform .4s cubic-bezier(.22,1,.36,1), opacity .4s ease;
}
.tomb-card.exiting{
  transition: transform .45s cubic-bezier(.5,-0.2,.7,.3), opacity .4s ease .05s;
  transform: translateX(140%) rotate(24deg) !important;
  opacity: 0;
}
.tomb-card-rip{
  font-family:var(--f-display); font-size:13px; letter-spacing:4px; color: var(--danger);
  text-shadow: 0 0 10px rgba(255,46,99,0.4); margin-bottom:10px;
}
.tomb-card img{ width:96px; height:96px; filter: grayscale(1) brightness(.9); image-rendering:pixelated; margin-bottom:8px; }
.tomb-card-name{ font-family:var(--f-display); font-size:20px; font-weight:700; color: var(--silver-bright); }
.tomb-card-species{ font-size:12px; color: var(--silver-dim); text-transform:capitalize; margin-top:2px; }
.tomb-card-trainer{ font-size:11px; color: var(--gold); margin-top:8px; letter-spacing:.5px; }
.tomb-card-divider{ width:60%; height:1px; background: var(--border); margin:12px 0; }
.tomb-card-line{ font-size:11px; color: var(--silver-dim); line-height:1.7; }
.tomb-card-line b{ color: var(--silver-bright); font-weight:600; }
.tomb-card-tap{
  position:absolute; bottom:14px; font-size:9px; color: var(--silver-dim); opacity:.5;
  letter-spacing:1px; text-transform:uppercase;
}
.err-msg{ color: var(--danger); font-size: 12px; margin-top: 6px; min-height: 14px; }
.item-row-add{ display:flex; gap:8px; align-items:flex-end; margin-bottom: 12px; }
.item-row-add .field{ margin-bottom:0; flex:1; }
.pending-chips{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom: 14px; }
.autocomplete-wrap{ position: relative; }
.autocomplete-list{
  position:absolute; top: calc(100% + 4px); left:0; right:0;
  background: var(--panel-2); border: 1px solid var(--border); border-radius: 4px;
  max-height: 180px; overflow-y:auto; z-index: 20;
  display:none;
}
.autocomplete-list.show{ display:block; }
.autocomplete-item{
  padding: 8px 12px; font-size: 13px; cursor:pointer; text-transform:capitalize; color: var(--silver);
}
.autocomplete-item:hover{ background: var(--bg-elev); color: var(--silver-bright); }
.loading-dot{ display:inline-block; }
/* ================================================================
   EL CRÁTER — rework total de la Arena (obsidiana + magma viva)
   ================================================================ */
.duel-empty{
  position:relative; text-align:center; padding: 70px 20px 50px;
  animation: floatIn .4s ease both;
  background:
    radial-gradient(ellipse at 50% 120%, rgba(255,106,45,0.16), transparent 60%),
    repeating-linear-gradient(115deg, rgba(0,0,0,0.25) 0 2px, transparent 2px 26px);
  border-radius: 10px;
  border: 1px solid var(--border);
}
.duel-empty-icon{
  font-size: 44px; margin-bottom: 14px; opacity:.75;
  filter: drop-shadow(0 0 14px rgba(255,140,60,0.5));
  animation: emberBreathe 2.6s ease-in-out infinite;
}
.duel-empty p{ color: var(--ash); margin-bottom: 22px; font-size: 14px; }
@keyframes arenaGlow{
  0%,100%{ opacity:.55; }
  50%{ opacity:1; }
}
@keyframes arenaSpin{
  from{ transform: rotate(0deg); }
  to{ transform: rotate(360deg); }
}
@keyframes floatIn{
  from{ opacity:0; transform: translateY(14px) scale(.97); }
  to{ opacity:1; transform: translateY(0) scale(1); }
}
@keyframes pulseRing{
  0%{ box-shadow: 0 0 0 0 rgba(235,201,115,0.45); }
  70%{ box-shadow: 0 0 0 14px rgba(235,201,115,0); }
  100%{ box-shadow: 0 0 0 0 rgba(235,201,115,0); }
}
@keyframes vsShake{
  0%,100%{ transform: translateY(0) scale(1); }
  50%{ transform: translateY(-1px) scale(1.06); }
}
@keyframes crownBob{
  0%,100%{ transform: translateY(0) rotate(-6deg); }
  50%{ transform: translateY(-3px) rotate(6deg); }
}
@keyframes sparkTwinkle{
  0%,100%{ opacity:.25; transform: scale(.8); }
  50%{ opacity:1; transform: scale(1.15); }
}
@keyframes numTick{
  0%{ transform: scale(1.14); color: var(--lava-hot); }
  100%{ transform: scale(1); color: var(--ember); }
}
@keyframes urgentPulse{
  0%,100%{ border-color: var(--border); }
  50%{ border-color: #c94a4a; box-shadow: 0 0 14px rgba(200,80,80,0.35); }
}
/* ---- nuevas animaciones exclusivas de El Cráter ---- */
@keyframes emberBreathe{
  0%,100%{ box-shadow: 0 0 14px rgba(255,150,70,0.55), inset 0 0 6px rgba(0,0,0,0.4); }
  50%{ box-shadow: 0 0 22px rgba(255,150,70,0.95), inset 0 0 6px rgba(0,0,0,0.4); }
}
@keyframes emberRise{
  0%{ transform: translateY(0) translateX(0) scale(1); opacity:0; }
  10%{ opacity:1; }
  100%{ transform: translateY(-140px) translateX(var(--ex,10px)) scale(.3); opacity:0; }
}
@keyframes magmaCrawl{
  0%{ background-position: 0% 50%; }
  100%{ background-position: 200% 50%; }
}
@keyframes crackFlicker{
  0%,100%{ opacity:.5; filter:brightness(1); }
  45%{ opacity:1; filter:brightness(1.6); }
  55%{ opacity:.85; filter:brightness(1.2); }
}
@keyframes obsidianFloat{
  0%,100%{ transform: translateY(0) rotate(-0.4deg); }
  50%{ transform: translateY(-4px) rotate(0.4deg); }
}
.duel-card{
  position:relative;
  background:
    radial-gradient(ellipse at 20% -20%, rgba(255,120,60,0.14), transparent 55%),
    linear-gradient(160deg, var(--panel) 0%, var(--bg-elev) 75%, #0c0503 100%);
  border: 1px solid var(--border);
  clip-path: polygon(2.5% 0%, 97% 0%, 100% 12%, 100% 88%, 97.5% 100%, 3% 100%, 0% 88%, 0% 12%);
  padding: 34px 22px 30px; text-align:center; margin-bottom: 30px;
  overflow:hidden;
  animation: floatIn .5s ease both, obsidianFloat 7s ease-in-out infinite;
}
.duel-card::before{
  content:''; position:absolute; left:0; right:0; top:0; height:4px;
  background: linear-gradient(90deg, transparent, var(--lava) 20%, var(--lava-hot) 50%, var(--lava) 80%, transparent);
  background-size: 220% 100%;
  animation: magmaCrawl 3.5s linear infinite;
  filter: drop-shadow(0 0 6px rgba(255,120,60,0.7));
}
.duel-card::after{
  content:''; position:absolute; inset:0;
  box-shadow: inset 0 0 50px rgba(255,106,45,0.08), inset 0 0 2px rgba(255,200,140,0.25);
  pointer-events:none;
}
.duel-card > *{ position:relative; z-index:1; }
.duel-name{
  font-family:var(--f-ui); font-size: 22px; letter-spacing:1.5px;
  color: var(--ember); margin-bottom: 4px;
  text-shadow: 0 0 18px rgba(255,120,60,0.45);
}
.duel-name::before{ content:'🌋 '; }
.duel-name::after{ content:' 🌋'; }
.duel-date{ font-size: 12px; color: var(--ash); letter-spacing:.5px; margin-bottom: 20px; }
.countdown{
  display:flex; justify-content:center; gap: 14px; flex-wrap:wrap;
}
.countdown .unit{ min-width: 64px; }
.countdown .num{
  font-family:var(--f-mono); font-size: 34px; font-weight:600;
  color: var(--ember);
  background: linear-gradient(160deg, #1a0d06, #0a0503);
  border:1px solid var(--border);
  clip-path: polygon(12% 0,88% 0,100% 18%,100% 100%,0 100%,0 18%);
  padding: 10px 4px; display:block;
  box-shadow: inset 0 0 10px rgba(0,0,0,.6);
  transition: box-shadow .3s ease, border-color .3s ease;
}
.countdown .unit:hover .num{ border-color: var(--lava); box-shadow: inset 0 0 10px rgba(0,0,0,.6), 0 0 16px rgba(255,120,60,0.3); }
.countdown .num.tick{ animation: numTick .4s ease-out; }
.countdown.urgent .num{ animation: urgentPulse 1s ease-in-out infinite; }
.countdown .lbl{ font-size: 10px; letter-spacing:1.5px; color: var(--ash); margin-top:6px; display:block; text-transform:uppercase; }
.countdown.due .num{ color: var(--lava-hot); border-color: var(--lava-hot); animation: pulseRing 1.4s ease-out infinite; }
.duel-top-actions{ display:flex; justify-content:center; gap:10px; margin-top:20px; flex-wrap:wrap; }
/* ---- La rueda pasa a ser un SIGILO DE MAGMA giratorio ---- */
.wheel-wrap{
  position:relative;
  display:flex; flex-direction:column; align-items:center; margin: 14px 0 34px;
  animation: floatIn .5s ease both;
}
.wheel-wrap::before, .wheel-wrap::after{
  content:''; position:absolute; width:4px; height:4px; border-radius:50%;
  background: var(--lava); top:70%; left:50%;
  box-shadow: 0 0 8px 2px rgba(255,140,60,0.8);
  animation: emberRise 3.2s ease-in infinite;
  pointer-events:none;
}
.wheel-wrap::after{ left:42%; animation-delay: 1.3s; --ex:-16px; }
.wheel-wrap::before{ --ex:14px; animation-delay:.4s; }
.wheel-outer{
  position:relative; width: 226px; height: 226px; margin-bottom: 18px;
}
.wheel-outer.small{ width: 174px; height: 174px; }
.wheel-outer::before{
  content:''; position:absolute; inset:-16px; border-radius:50%;
  border: 2px solid transparent;
  background: conic-gradient(var(--lava), var(--lava-hot), var(--rockcrack), var(--lava-hot), var(--lava)) border-box;
  -webkit-mask: linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
  opacity:.65;
  animation: arenaSpin 9s linear infinite;
  filter: drop-shadow(0 0 10px rgba(255,120,60,0.5));
  pointer-events:none;
}
.wheel-pointer{
  position:absolute; top:-10px; left:50%; transform:translateX(-50%);
  width:0; height:0; z-index:5;
  border-left: 9px solid transparent; border-right: 9px solid transparent;
  border-top: 22px solid var(--lava);
  filter: drop-shadow(0 0 10px rgba(255,120,60,0.9)) drop-shadow(0 0 3px var(--lava-hot));
}
.wheel{
  width:100%; height:100%; border-radius:50%;
  border: 4px solid #150b08;
  position:relative; overflow:hidden;
  transition: transform 4.2s cubic-bezier(0.15, 0.85, 0.25, 1);
  box-shadow:
    0 0 0 3px var(--lava-hot),
    0 0 0 8px var(--bg-elev),
    0 10px 34px rgba(0,0,0,0.55),
    0 0 46px rgba(255,120,60,0.35),
    inset 0 0 30px rgba(0,0,0,0.4);
  background: var(--panel-2);
}
.wheel::after{
  content:''; position:absolute; inset:0; border-radius:50%; z-index:2; pointer-events:none;
  background:
    repeating-conic-gradient(from 0deg, rgba(0,0,0,0.35) 0deg 1.2deg, transparent 1.2deg 13deg),
    radial-gradient(circle at 50% 50%, transparent 55%, rgba(0,0,0,0.45) 100%),
    radial-gradient(circle at 38% 30%, rgba(255,255,255,0.22), transparent 40%);
  mix-blend-mode: overlay;
}
.wheel-seg{
  position:absolute; inset:0;
  transform-origin: 50% 50%;
}
.wheel-seg span{
  position:absolute; top: 18px; left:50%;
  font-family:var(--f-ui); font-weight:700; font-size: 14px;
  letter-spacing:1px; color: #1a0a04;
  text-shadow: 0 1px 0 rgba(255,255,255,0.25);
  white-space:nowrap;
}
.wheel-seg-inner{
  position:absolute; top: 10px; left:50%;
  display:flex; flex-direction:column; align-items:center; gap:2px;
}
.wheel-seg-inner img{
  width: 34px; height: 34px; object-fit: contain; border-radius: 50%;
  background: var(--bg); border: 2px solid var(--lava-hot); box-shadow: 0 0 8px rgba(255,120,60,0.5);
}
.wheel-seg-inner span{
  font-family:var(--f-ui); font-weight:700; font-size: 10px;
  letter-spacing:0.5px; color: var(--bg); white-space:nowrap;
  background: rgba(255,255,255,0.55); padding: 0 3px; border-radius: 3px;
}
.wheel-center{
  position:absolute; inset:0; margin:auto;
  width:38px; height:38px; border-radius:50%;
  background: radial-gradient(circle at 35% 30%, var(--lava-hot), var(--lava) 60%, var(--lava-deep) 100%);
  border:2px solid #1a0a04; z-index:4;
  box-shadow: 0 0 18px rgba(255,150,70,0.85), inset 0 0 6px rgba(0,0,0,0.4);
  animation: emberBreathe 2s ease-in-out infinite;
}
.final-wheels-row{
  display:flex; justify-content:center; gap: 36px; flex-wrap:wrap; margin-top: 6px;
  animation: floatIn .5s ease both;
}
.prize-legend{
  max-width: 220px; margin: 0 auto 14px; display:flex; flex-direction:column; gap:5px;
}
.prize-legend-item{
  display:flex; align-items:center; gap:8px; font-size:11px; color: var(--ash); text-align:left;
}
.prize-swatch{ width:10px; height:10px; border-radius:2px; flex-shrink:0; transform:rotate(45deg); }
.prize-result{
  font-family:var(--f-ui); font-size: 16px; font-weight:700; color: var(--ember);
  background: linear-gradient(160deg, var(--panel), #140a06);
  border: 1px solid var(--border);
  clip-path: polygon(6% 0,100% 0,94% 100%,0 100%);
  padding: 14px 22px; max-width: 220px; text-align:center;
  animation: floatIn .4s ease both;
}
.prize-result.good{ border-color: var(--lava-hot); color: var(--lava-hot); box-shadow: 0 0 22px rgba(255,180,90,0.3); }
.final-gate{
  max-width: 420px; margin: 50px auto 0; text-align:center;
  position: relative; padding: 40px 28px 34px;
  border-radius: 9px;
  background:
    radial-gradient(circle at 50% -10%, rgba(255,200,60,0.18), transparent 60%),
    linear-gradient(160deg, var(--panel) 0%, var(--bg-elev) 100%);
  border: 1px solid var(--border);
  overflow: hidden;
  animation: floatIn .5s ease both;
  box-shadow: 0 0 0 1px rgba(255,200,60,0.08), 0 20px 60px rgba(0,0,0,0.5);
}
.final-gate::before{
  content:''; position:absolute; inset:-2px; border-radius: 9px; padding: 2px;
  background: conic-gradient(from var(--gate-angle,0deg), var(--lava-hot), var(--lava), var(--rockcrack), var(--lava-hot));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
  animation: gateSpin 6s linear infinite;
  opacity: .8;
}
@keyframes gateSpin{
  0%{ --gate-angle: 0deg; }
  100%{ --gate-angle: 360deg; }
}
@property --gate-angle{ syntax: '<angle>'; inherits: false; initial-value: 0deg; }
.final-gate-eyebrow{
  font-family:var(--f-ui); font-weight:700; font-size: 11px; letter-spacing: 5px;
  color: var(--lava-hot); text-transform: uppercase; margin-bottom: 10px;
  animation: sparkTwinkle 1.8s ease-in-out infinite;
}
.final-gate-icon{
  font-size: 60px; margin-bottom: 4px;
  filter: drop-shadow(0 0 18px rgba(255,200,60,0.7));
  animation: gateIconFloat 2.8s ease-in-out infinite;
}
@keyframes gateIconFloat{
  0%,100%{ transform: translateY(0) scale(1); }
  50%{ transform: translateY(-6px) scale(1.06); }
}
.final-gate-title{
  font-family:var(--f-ui); font-weight:800; font-size: 38px; letter-spacing:6px;
  background: linear-gradient(100deg, var(--lava-hot) 0%, var(--ember) 25%, var(--lava) 50%, var(--ember) 75%, var(--lava-hot) 100%);
  background-size: 250% auto;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  text-transform:uppercase;
  animation: final-title-shine 3.5s linear infinite;
  text-shadow: 0 0 30px rgba(255,200,60,0.35);
}
@keyframes final-title-shine{
  0%{ background-position: 0% center; }
  100%{ background-position: 250% center; }
}
.final-gate-sub{
  font-size: 13px; color: var(--ash); margin-top: 12px; line-height:1.6;
  max-width: 320px; margin-left:auto; margin-right:auto;
}
.final-gate-hype{
  margin-top: 18px; display:flex; justify-content:center; gap: 18px;
  font-family:var(--f-mono); font-size: 10px; letter-spacing:1.5px;
  color: var(--ash); text-transform:uppercase;
}
.final-gate-hype span{ color: var(--lava-hot); }
.final-gate input[type="password"]{
  text-align:center; letter-spacing: 3px; font-size: 15px;
}
.final-gate .primary{
  margin-top: 14px; font-size: 15px; letter-spacing:2px; padding: 12px 34px;
  box-shadow: 0 0 24px rgba(255,77,61,0.35);
}
.final-header{ text-align:center; margin-bottom: 26px; animation: floatIn .4s ease both; }
.final-header .final-gate-icon{ font-size: 40px; }
@keyframes shakeX{
  0%,100%{ transform: translateX(0); }
  20%,60%{ transform: translateX(-6px); }
  40%,80%{ transform: translateX(6px); }
}
.shake{ animation: shakeX .4s ease; border-color: var(--rockcrack) !important; }
.final-cat-card{
  max-width: 460px; margin: 0 auto 22px;
  background: linear-gradient(160deg, var(--panel) 0%, var(--bg-elev) 100%);
  border: 1px solid var(--border); border-radius: 7px;
  padding: 20px 22px;
  text-align:center;
  animation: floatIn .5s ease both;
  position:relative; overflow:hidden;
}
.final-cat-card::before{
  content:''; position:absolute; top:0; left:0; right:0; height:3px;
  background: linear-gradient(90deg, var(--lava-deep), var(--lava-hot));
}
.final-cat-icon{ font-size: 30px; margin-bottom: 4px; animation: sparkTwinkle 2.2s ease-in-out infinite; }
.final-cat-label{
  font-family:var(--f-ui); font-weight:700; font-size: 18px; letter-spacing:1px;
  color: var(--ember);
}
.final-cat-unit{ font-size: 11px; color: var(--ash); letter-spacing:1px; margin-bottom: 16px; text-transform:uppercase; }
.final-cat-row{
  display:flex; align-items:center; gap: 10px; margin-bottom: 10px;
}
.final-cat-name{
  width: 70px; text-align:right; font-family:var(--f-ui); font-weight:600;
  font-size: 13px; color: var(--ash); letter-spacing:.5px; flex-shrink:0;
}
.final-cat-row.winner .final-cat-name{ color: var(--lava-hot); }
.final-cat-bar-track{
  flex:1; height:10px; border-radius: 3px; background: var(--bg);
  border: 1px solid var(--border); overflow:hidden;
}
.final-cat-bar{
  height:100%; border-radius: 3px;
  background: linear-gradient(90deg, var(--lava-deep), var(--lava));
  animation: growBar .9s cubic-bezier(.16,.84,.44,1) both;
  width: var(--pct);
}
.final-cat-row.winner .final-cat-bar{
  background: linear-gradient(90deg, #e6ba4c, var(--lava-hot));
  box-shadow: 0 0 12px rgba(235,201,115,0.5);
}
@keyframes growBar{
  from{ width:0%; }
  to{ width: var(--pct); }
}
.final-cat-value{
  width: 56px; text-align:left; font-family:var(--f-mono); font-size: 13px;
  color: var(--ember); flex-shrink:0;
}
.final-cat-winner-line{
  margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border);
  font-family:var(--f-ui); font-weight:600; letter-spacing:.5px;
  color: var(--lava-hot); font-size: 14px;
  animation: sparkTwinkle 2.4s ease-in-out infinite;
}
.final-controls{ text-align:center; margin: 10px 0 30px; }
.final-done-note{
  color: var(--ash); font-size: 13px; letter-spacing:.5px;
}
.final-podium-wrap{ animation: floatIn .5s ease both; margin-top: 8px; }
.final-podium{ margin-top: 14px; }
.final-podium-card{ cursor:default; }
.final-podium-card:hover{ transform:none; box-shadow:none; }
.final-summary-note{
  text-align:center; color: var(--ash); font-size: 12px; margin-top: 18px; letter-spacing:.5px;
}
.t-bonus{ color: var(--lava-hot); }
.final-intro-card{
  max-width:480px; margin: 0 auto 24px; text-align:center; padding: 34px 24px;
  border-radius: 8px; border:1px solid var(--lava-hot); background: linear-gradient(160deg, #2f0e13, #18070a);
  box-shadow: 0 0 40px rgba(255,200,60,0.18), inset 0 0 30px rgba(255,200,60,0.06);
  animation: floatIn .5s ease both;
}
.final-intro-icon{ font-size:46px; margin-bottom:10px; animation: pulseGlow 2s ease-in-out infinite; }
@keyframes pulseGlow{ 0%,100%{ filter: drop-shadow(0 0 6px rgba(255,200,60,.4)); } 50%{ filter: drop-shadow(0 0 22px rgba(255,200,60,.8)); } }
.final-intro-title{
  font-family:var(--f-display); font-size:26px; font-weight:700; letter-spacing:3px;
  color: var(--lava-hot); margin-bottom:10px;
}
.final-intro-sub{ color: var(--ash); font-size:13px; line-height:1.6; max-width:360px; margin:0 auto; }
.final-intro-deco{ margin-top:16px; letter-spacing:14px; color: var(--lava-hot); opacity:.6; font-size:11px; }
.final-cat-mystery{ text-align:center; }
.spin-slow{ display:inline-block; animation: spin3d 3s linear infinite; }
@keyframes spin3d{ from{ transform: rotateY(0deg); } to{ transform: rotateY(360deg); } }
.final-mystery-row{ display:flex; justify-content:center; gap:10px; margin:14px 0 4px; }
.final-mystery-slot{
  width:34px; height:34px; border-radius: 3px; display:flex; align-items:center; justify-content:center;
  font-family:var(--f-mono); font-weight:800; font-size:16px;
  background: var(--panel-2); border:1px dashed var(--border); color: var(--ash);
  animation: mysteryPulse 1.6s ease-in-out infinite;
}
.final-mystery-slot:nth-child(2){ animation-delay:.2s; }
.final-mystery-slot:nth-child(3){ animation-delay:.4s; }
@keyframes mysteryPulse{ 0%,100%{ opacity:.4; } 50%{ opacity:1; } }
.final-cat-opened{ animation: cardFlipOpen .5s cubic-bezier(.2,.9,.3,1) both; }
@keyframes cardFlipOpen{ 0%{ transform: rotateX(90deg); opacity:0; } 100%{ transform: rotateX(0deg); opacity:1; } }
.final-mentions-wrap{ margin: 6px 0 10px; animation: floatIn .4s ease both; }
.final-mentions-grid{
  display:grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap:12px; margin-top:14px;
}
.final-mention-badge{
  background: var(--panel); border:1px solid var(--border); border-radius: 6px;
  padding:14px 10px; text-align:center; animation: floatIn .4s ease both;
}
.final-mention-icon{ font-size:24px; margin-bottom:6px; }
.final-mention-label{ font-size:11px; color: var(--ash); letter-spacing:.3px; }
.final-mention-winner{ font-size:14px; font-weight:700; color: var(--ember); margin-top:6px; }
.final-mention-value{ font-size:10px; color: var(--lava-hot); margin-top:2px; }
.final-champion-wrap{
  max-width:460px; margin: 10px auto 20px; text-align:center; padding: 40px 24px;
  border-radius: 8px; border:1px solid var(--lava-hot);
  background: radial-gradient(circle at 50% 0%, rgba(255,200,60,0.14), transparent 65%), linear-gradient(160deg, #280b10, #18070a);
  box-shadow: 0 0 50px rgba(255,200,60,0.22);
  animation: floatIn .5s ease both;
}
.final-champion-eyebrow{
  font-family:var(--f-ui); font-weight:800; letter-spacing:2px; font-size:12px;
  color: var(--ash); margin-bottom:14px; text-transform:uppercase;
}
.final-champion-mystery-name{
  font-family:var(--f-display); font-size:34px; letter-spacing:10px; color: var(--ash);
  margin-bottom:20px; animation: mysteryPulse 1.4s ease-in-out infinite;
}
.final-champion-crown{ font-size:48px; margin-bottom:6px; animation: crownDrop .6s cubic-bezier(.3,1.4,.4,1) both; }
@keyframes crownDrop{ 0%{ transform: translateY(-40px) scale(.5); opacity:0; } 100%{ transform: translateY(0) scale(1); opacity:1; } }
.final-champion-name{
  font-family:var(--f-display); font-size:30px; font-weight:700; color: var(--lava-hot);
  text-shadow: 0 0 18px rgba(255,200,60,0.5); letter-spacing:2px;
}
.final-champion-name span{ display:inline-block; opacity:0; animation: letterPop .35s ease both; }
@keyframes letterPop{ 0%{ opacity:0; transform: translateY(10px) scale(.6); } 100%{ opacity:1; transform: translateY(0) scale(1); } }
.final-champion-sub{ margin-top:14px; color: var(--ash); font-size:13px; letter-spacing:.5px; }
.champion-glow{

/* --- La Final: campeón más espectacular + clasificación final --- */
.final-champion-wrap.revealed{
  position:relative; overflow:hidden; border-color:rgba(255,215,106,.7);
  background:radial-gradient(circle at 50% 0%,rgba(255,200,90,.2),transparent 62%),linear-gradient(160deg,#16120a,#100a0b 70%);
  box-shadow:0 0 70px rgba(255,200,90,.28),inset 0 0 0 1px rgba(255,215,106,.22);
}
.final-champion-wrap.revealed::before{
  content:''; position:absolute; left:50%; top:-90%; width:240%; aspect-ratio:1; transform:translateX(-50%);
  background:repeating-conic-gradient(from 0deg,rgba(255,215,106,.1) 0 7deg,transparent 7deg 20deg);
  -webkit-mask-image:radial-gradient(circle,#000 0,transparent 62%); mask-image:radial-gradient(circle,#000 0,transparent 62%);
  animation:championRays 30s linear infinite; pointer-events:none;
}
.final-champion-wrap.revealed > *{ position:relative; z-index:1; }
@keyframes championRays{ to{ transform:translateX(-50%) rotate(360deg); } }
.final-champion-wrap.revealed .final-champion-eyebrow{ color:#ffd76a; }
.final-champion-wrap.revealed .final-champion-crown{ font-size:64px; filter:drop-shadow(0 0 18px rgba(255,200,80,.7)); }
.final-champion-wrap.revealed .final-champion-name{
  color:#ffe29a; font-size:clamp(30px,7vw,44px); letter-spacing:3px;
  text-shadow:0 0 22px rgba(255,200,80,.55),0 2px 0 rgba(0,0,0,.4);
}
.final-champion-wrap.revealed .final-champion-sub{ color:#d9c58a; }
.final-sparkles{ position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
.final-sparkles span{
  position:absolute; bottom:-14px; color:#ffd76a; opacity:0; font-size:14px;
  animation:sparkleUp 4.2s ease-in infinite;
}
.final-sparkles span:nth-child(1){ left:8%;  animation-delay:0s;   font-size:12px; }
.final-sparkles span:nth-child(2){ left:22%; animation-delay:1.1s; font-size:18px; }
.final-sparkles span:nth-child(3){ left:38%; animation-delay:2.2s; font-size:11px; }
.final-sparkles span:nth-child(4){ left:55%; animation-delay:.6s;  font-size:16px; }
.final-sparkles span:nth-child(5){ left:71%; animation-delay:1.8s; font-size:13px; }
.final-sparkles span:nth-child(6){ left:86%; animation-delay:2.9s; font-size:17px; }
@keyframes sparkleUp{
  0%{ transform:translateY(0) scale(.6); opacity:0; }
  15%{ opacity:.95; }
  100%{ transform:translateY(-330px) scale(1.1) rotate(40deg); opacity:0; }
}
.final-standings{
  max-width:460px; margin:0 auto 24px; padding:16px 14px 12px; border-radius:12px;
  border:1px solid rgba(255,255,255,.09); background:linear-gradient(155deg,#220d11,#13080a);
  animation:floatIn .5s ease .25s both;
}
.final-standings-title{

}
.final-standings-row{

}
.final-standings-row:first-of-type{ border-top:0; }
.final-standings-row.first{ background:linear-gradient(90deg,rgba(255,200,90,.14),transparent); border-radius:8px; }
.final-standings-row.lost{ opacity:.55; }

@media (prefers-reduced-motion:reduce){
  .final-champion-wrap.revealed::before,.final-sparkles span{ animation:none; }
  .final-sparkles{ display:none; }
}

/* ---- El bracket ahora es una GRIETA DE MAGMA que conecta las losas ---- */
.bracket{
  position:relative;
  display:flex; flex-direction:column; align-items:center; gap: 22px; margin: 14px 0 22px;
}
.bracket::before{
  content:''; position:absolute; left:50%; top:0; bottom:0; width:2px; transform:translateX(-50%);
  background: linear-gradient(180deg, transparent, var(--lava) 15%, var(--lava-hot) 50%, var(--lava) 85%, transparent);
  opacity:.55; filter: drop-shadow(0 0 6px rgba(255,120,60,0.6));
  animation: crackFlicker 2.4s ease-in-out infinite;
  pointer-events:none;
}
.bracket-match{
  position:relative;
  background:
    radial-gradient(ellipse at 80% 0%, rgba(255,120,60,0.10), transparent 60%),
    linear-gradient(165deg, var(--panel) 0%, var(--bg-elev) 100%);
  border:1px solid var(--border);
  clip-path: polygon(0 6%, 4% 0, 96% 0, 100% 6%, 100% 94%, 96% 100%, 4% 100%, 0 94%);
  padding: 18px 18px 16px; width: 100%; max-width: 360px;
  animation: floatIn .45s ease both;
  transition: border-color .2s ease, box-shadow .2s ease, transform .2s ease;
  overflow:hidden;
}
.bracket-match::before{
  content:''; position:absolute; top:0; left:0; right:0; height:3px;
  background: linear-gradient(90deg, var(--lava-deep), var(--lava-hot), var(--lava-deep));
  background-size: 200% 100%;
  animation: magmaCrawl 4s linear infinite;
}
.bracket-match:hover{ transform: translateY(-2px); }
.bracket-match.active{ border-color: var(--lava); box-shadow: 0 0 26px rgba(255,120,60,0.22), 0 10px 24px rgba(0,0,0,0.35); }
.bracket-match .match-label{
  font-size: 11px; letter-spacing:1.5px; color: var(--ash); text-transform:uppercase;
  text-align:center; margin-bottom: 10px;
}
.bracket-match .match-label::before{ content:'🌋 '; }
.bracket-vs{ display:flex; align-items:center; justify-content:center; gap: 14px; }
.bracket-player{
  flex:1; text-align:center; padding: 12px 8px; position:relative;
  background: linear-gradient(160deg, rgba(255,255,255,0.02), transparent);
  border: 1px solid var(--border);
  clip-path: polygon(10% 0,100% 0,90% 100%,0 100%);
  cursor:pointer; transition: all .15s ease;
  font-family:var(--f-ui); font-weight:600; letter-spacing:.5px; color: var(--ember);
}
.bracket-player:not(.locked):hover{
  border-color: var(--lava); color: var(--ember);
  transform: translateY(-2px) scale(1.03);
  box-shadow: 0 6px 18px rgba(255,120,60,0.25);
}
.bracket-player:not(.locked){ animation: pulseRing 2.2s ease-out infinite; }
.bracket-player.winner{
  border-color: var(--lava-hot); color: var(--lava-hot); background: rgba(255,150,70,0.1);
  box-shadow: 0 0 18px rgba(255,150,70,0.3);
}
.bracket-player.winner::before{
  content:'🔥'; position:absolute; top:-17px; left:50%; transform:translateX(-50%);
  font-size:15px; animation: crownBob 1.6s ease-in-out infinite;
}
.bracket-player.locked{ cursor:default; }
.bracket-vs-sep{
  font-family:var(--f-ui); font-size: 15px; font-weight:800; letter-spacing:2px;
  color: var(--lava-hot); text-shadow: 0 0 12px rgba(255,150,70,0.6);
  animation: vsShake 1.4s ease-in-out infinite;
}
.bracket-bye{ font-size: 11px; color: var(--ash); text-align:center; margin-top:8px; }
.bracket-bye::before{ content:'🗿 '; }

.arena-vote-chip.on{border-color:var(--lava-hot);background:rgba(255,106,44,.14);color:var(--lava-hot)}
.arena-postleague .arena-vote{margin-top:9px;padding-top:0;border-top:0}
.arena-stage-state{display:inline-flex;align-items:center;gap:5px;color:var(--silver-dim);font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.arena-stage-state.ready{color:var(--lava-hot)}
.arena-stage-state.done{color:var(--neon-green)}
.arena-postleague{
  display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:12px;padding:14px 16px;
  border:1px solid rgba(255,135,145,.26);border-radius:10px;background:linear-gradient(110deg,rgba(218,47,61,.11),rgba(255,255,255,.018));
}
.arena-postleague h4{margin:0 0 4px;color:var(--silver-bright);font-family:var(--f-display);font-size:14px}
.arena-postleague p{margin:0;color:var(--silver-dim);font-size:11px;line-height:1.45}
.arena-postleague .primary{flex:none;background:linear-gradient(135deg,#e04d5a,#b01f2b);border-color:#e77680}
.arena-sync-note{margin:12px 0 0;color:var(--silver-dim);font-size:10px;line-height:1.5}
.arena-challenge-card{
  width:100%;max-width:620px;margin:10px auto 18px;padding:0;overflow:hidden;position:relative;
  border:1px solid rgba(255,179,71,.3);border-radius:14px;
  background:radial-gradient(ellipse at 50% 0,rgba(255,106,44,.12),transparent 55%),linear-gradient(160deg,var(--panel),var(--bg-elev));
  box-shadow:0 16px 42px rgba(0,0,0,.24);
}
.arena-challenge-card::before{content:'';display:block;height:3px;background:linear-gradient(90deg,transparent,var(--lava-hot),var(--lava),transparent)}
.arena-challenge-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:17px 18px 8px}
.arena-challenge-kicker{color:var(--lava-hot);font-size:9px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase}
.arena-challenge-stake{margin-top:5px;color:var(--silver-bright);font-size:15px;font-weight:800}
.arena-challenge-game{flex:none;padding:6px 8px;border:1px solid var(--border);border-radius:7px;color:var(--silver-dim);font:700 9px var(--f-mono);white-space:nowrap}
.arena-challenge-score{display:flex;align-items:center;justify-content:center;gap:13px;padding:5px 16px 15px;color:var(--silver-bright);font:800 23px var(--f-mono)}
.arena-challenge-score .score-dash{color:var(--lava-hot);font-size:13px}
.arena-challenge-score .score-name{color:var(--silver);font:700 10px var(--f-ui);letter-spacing:.04em}
.arena-contenders{display:grid;grid-template-columns:minmax(0,1fr) 34px minmax(0,1fr);align-items:stretch;gap:8px;padding:0 16px}
.arena-contender{
  min-width:0;min-height:78px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  border:1px solid rgba(255,255,255,.1);border-radius:10px;background:rgba(255,255,255,.025);color:var(--silver-bright);
  font-family:var(--f-ui);font-weight:800;transition:transform .16s,border-color .16s,background .16s,box-shadow .16s;
}
button.arena-contender:not(:disabled){cursor:pointer}
button.arena-contender:not(:disabled):hover{transform:translateY(-2px);border-color:var(--lava-hot);background:rgba(255,106,44,.09);box-shadow:0 8px 20px rgba(255,106,44,.1)}
.arena-contender:disabled{opacity:.8}
.arena-contender.winner{border-color:var(--lava-hot);background:rgba(255,150,70,.11);color:var(--lava-hot);box-shadow:inset 0 0 22px rgba(255,150,70,.07)}
.arena-contender-name{font-size:13px}
.arena-contender-hint{color:var(--silver-dim);font-size:9px;font-weight:600}
.arena-contender.winner .arena-contender-hint{color:var(--lava-hot)}
.arena-contenders-vs{display:grid;place-items:center;color:var(--lava-hot);font:800 10px var(--f-mono);letter-spacing:.08em}
.arena-game-pips{display:flex;justify-content:center;gap:6px;margin:14px 0 0}
.arena-game-pip{width:29px;height:4px;border-radius:9px;background:rgba(255,255,255,.12)}
.arena-game-pip.won{background:var(--lava-hot);box-shadow:0 0 8px rgba(255,179,71,.45)}
.arena-challenge-note{margin:13px 17px 0;padding:12px 14px;border-left:2px solid var(--lava);border-radius:0 7px 7px 0;background:rgba(0,0,0,.16);color:var(--ember);font-size:12px;line-height:1.6}
.arena-challenge-reader{margin:9px 17px 0;text-align:center;color:var(--ash);font-size:10px;font-style:italic}
.arena-challenge-actions{display:flex;justify-content:center;gap:8px;margin:14px 0 17px}
.arena-challenge-saving{padding:10px;color:var(--silver-dim);text-align:center;font-size:11px}
@media(max-width:700px){.arena-journey-track{grid-template-columns:repeat(2,minmax(0,1fr))}.arena-journey-stage:last-child{grid-column:1/-1}.arena-journey-stage::after{display:none}}
@media(max-width:480px){.arena-readiness{grid-template-columns:1fr}.arena-ready-player{padding:8px 10px}.arena-journey-heading{align-items:flex-start}.arena-journey-count{font-size:9px}.arena-postleague{align-items:flex-start;flex-direction:column}.arena-postleague .primary{width:100%}.arena-challenge-top{padding:14px 13px 7px}.arena-contenders{padding:0 12px;gap:5px}.arena-contender{min-height:70px}.arena-challenge-score{gap:8px}.arena-challenge-score .score-name{font-size:9px}}
/* ---- Marcador BO3 → medidor de erupción ---- */
.bo3-score{
  text-align:center; font-family:var(--f-mono); font-weight:700; font-size:15px;
  margin: 8px 0 2px; letter-spacing:.5px;
  background: linear-gradient(90deg, var(--ember), var(--lava-hot), var(--lava), var(--lava-hot), var(--ember));
  background-size: 220% auto;
  -webkit-background-clip:text; background-clip:text; color:transparent;
  animation: magmaCrawl 5s linear infinite;
}
/* ---- Narración → losa tallada en piedra ---- */
.bo3-narration{
  position:relative;
  max-width: 360px; margin: 4px auto 14px; text-align:center;
  background: linear-gradient(160deg, var(--panel) 0%, var(--bg-elev) 100%);
  border: 1px solid var(--border);
  clip-path: polygon(0 0, 96% 0, 100% 22%, 100% 100%, 4% 100%, 0 78%);
  padding: 16px 18px 14px; font-size: 13px; line-height:1.6;
  color: var(--ember); animation: floatIn .35s ease both;
}
.bo3-narration::before{
  content:''; position:absolute; left:0; top:0; bottom:0; width:3px;
  background: linear-gradient(180deg, var(--lava), var(--lava-hot), var(--lava));
  filter: drop-shadow(0 0 5px rgba(255,150,70,0.6));
}
.bo3-narration strong{ color: var(--lava-hot); }
.bo3-reader-note{
  margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--border);
  font-size: 11px; color: var(--ash); font-style: italic; text-align:center;
}
.spin-note{ font-size: 12px; color: var(--ash); text-align:center; margin-bottom: 14px; }
.champion-banner{
  animation: floatIn .5s ease both;
}
.champion-banner .champion-title{
  animation: sparkTwinkle 1.8s ease-in-out infinite;
}
/* ---- Tally → tótems de obsidiana ---- */
.duel-tally{ display:flex; justify-content:center; gap: 16px; margin: 6px 0 32px; flex-wrap:wrap; }
.duel-tally .t-item{
  position:relative; text-align:center;
  background: linear-gradient(180deg, var(--panel), #140a06);
  border:1px solid var(--border);
  clip-path: polygon(15% 0,85% 0,100% 15%,100% 100%,0 100%,0 15%);
  padding: 16px 22px 14px; min-width: 88px;
  transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
}
.duel-tally .t-item::after{
  content:''; position:absolute; left:8px; right:8px; bottom:0; height:3px;
  background: var(--border); border-radius:2px;
}
.duel-tally .t-item:hover{ transform: translateY(-3px); border-color: var(--lava-deep); }
.duel-tally .t-item.leader{ border-color: var(--lava-hot); box-shadow: 0 0 22px rgba(255,150,70,0.22); }
.duel-tally .t-item.leader::after{ background: linear-gradient(90deg, var(--lava), var(--lava-hot), var(--lava)); box-shadow: 0 0 10px rgba(255,150,70,0.7); }
.duel-tally .t-item.leader::before{
  content:'🔥'; position:absolute; top:-15px; left:50%; transform:translateX(-50%);
  font-size:16px; animation: crownBob 1.8s ease-in-out infinite;
}
.duel-tally .t-name{ font-size: 12px; color: var(--ash); letter-spacing:.5px; margin-top:4px; }
.duel-tally .t-wins{
  font-family:var(--f-mono); font-size: 26px; color: var(--ember);
  text-shadow: 0 0 0 transparent; transition: text-shadow .2s ease;
}
.duel-tally .t-item.leader .t-wins{ color: var(--lava-hot); text-shadow: 0 0 14px rgba(255,150,70,0.5); }
/* ---- Historial → registro de ceniza ---- */
.duel-history-item{
  position:relative;
  background: linear-gradient(100deg, var(--panel), #140a06 85%);
  border:1px solid var(--border);
  clip-path: polygon(0 0, 100% 0, 100% 92%, 98% 100%, 0 100%);
  padding: 14px 16px 14px 24px; margin-bottom: 10px; font-size: 13px;
  transition: transform .15s ease, border-color .15s ease;
  animation: floatIn .35s ease both;
}
.duel-history-item::before{
  content:''; position:absolute; left:6px; top:50%; transform:translateY(-50%);
  width:7px; height:7px; border-radius:50%;
  background: var(--lava); box-shadow: 0 0 8px 2px rgba(255,120,60,0.7);
}
.duel-history-item:hover{ transform: translateX(2px); border-color: var(--lava-deep); }
.duel-history-item .dh-name{ color: var(--ember); font-weight:600; }
.duel-history-item .dh-name::before{ content:'🌋 '; }
.duel-history-item .dh-date{ color: var(--ash); font-size: 11px; margin-bottom:4px; }
.duel-history-item .dh-champ{ color: var(--lava-hot); font-weight:700; }
.duel-history-item .dh-reward{ margin-top:6px; font-size: 12px; color: var(--ash); }
.h2h-line{ font-size: 11px; color: var(--ash); text-align:center; margin-top:8px; letter-spacing:.3px; }
:root{
  --neon-pink: #ff5c7a;
  --neon-cyan: #ffc83c;
  --neon-yellow: #ffc233;
  --neon-green: #39e6a0;
  --roulette-red: #c23b4a;
  --roulette-black: #261c1e;
}
.casino-topbar{
  display:flex; align-items:center; justify-content:center; gap: 16px; flex-wrap:wrap;
  background: var(--panel); border:1px solid var(--border); border-radius: 7px;
  padding: 16px 20px; max-width: 520px; margin: 0 auto 22px;
  box-shadow: 0 0 0 1px rgba(212,179,165,0.05), 0 10px 26px rgba(0,0,0,0.35);
  position: relative; overflow:hidden;
}
.casino-topbar::before{
  content:""; position:absolute; inset:0; border-radius: 7px; padding:1px;
  background: linear-gradient(120deg, var(--accent), var(--gold), var(--accent));
  background-size: 300% 100%;
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
  animation: hallBorderFlow 6s linear infinite; opacity:.55; pointer-events:none;
}
.casino-topbar select{
  background: var(--panel-2); border:1px solid var(--border); border-radius: 3px;
  padding: 8px 12px; color: var(--silver-bright); font-family:var(--f-ui); font-weight:600; font-size:14px;
}
.casino-balance{
  font-family:var(--f-mono); font-size: 20px; color: var(--gold);
  text-shadow: 0 0 10px rgba(255,180,90,0.5);
  animation: coinGlow 2.4s ease-in-out infinite;
}
@keyframes coinGlow{ 0%,100%{ text-shadow: 0 0 8px rgba(255,180,90,0.4); } 50%{ text-shadow: 0 0 18px rgba(255,180,90,0.85); } }
.mascot{
  display:flex; flex-direction:column; align-items:center; gap:10px;
  max-width: 260px; margin: 0 auto 24px;
  animation: hallEnter .5s cubic-bezier(.2,.85,.3,1) forwards;
}
.mascot-img{
  width: 130px; height:auto;
  filter: drop-shadow(0 10px 16px rgba(0,0,0,0.5)) drop-shadow(0 0 12px rgba(255,90,60,0.35));
  animation: croupierBob 3s ease-in-out infinite;
}
@keyframes croupierBob{ 0%,100%{ transform: translateY(0) rotate(-2deg); } 50%{ transform: translateY(-6px) rotate(2deg); } }
.comic-bubble{
  position:relative;
  background:#fefcf6; color:#1a1a1a; font-weight:600; line-height:1.35;
  border-radius: 8px; border: 2.5px solid #17181d;
  padding: 10px 16px; font-size: 12.5px; text-align:center;
  box-shadow: 0 8px 16px rgba(0,0,0,0.4);
}
.comic-bubble::after{
  content:""; position:absolute; left:50%; bottom:-13px; transform:translateX(-50%);
  width:0; height:0;
  border-left:10px solid transparent; border-right:10px solid transparent;
  border-top:15px solid #17181d;
}
.comic-bubble::before{
  content:""; position:absolute; left:50%; bottom:-9px; transform:translateX(-50%);
  width:0; height:0; z-index:1;
  border-left:7px solid transparent; border-right:7px solid transparent;
  border-top:11px solid #fefcf6;
}
.mascot-bubble{ max-width: 260px; }
.hall-mascot{
  position: relative;
  display:flex; flex-direction:column; align-items:center; gap:10px;
  z-index: 0;
  margin-bottom: -78px;
}
.hall-mascot-img{
  width: 230px; height:auto;
  filter: drop-shadow(0 14px 26px rgba(0,0,0,0.55)) drop-shadow(0 0 22px rgba(255,90,60,0.4));
  animation: hallMascotFloat 4.2s ease-in-out infinite;
}
@keyframes hallMascotFloat{ 0%,100%{ transform: translateY(0) rotate(-1.5deg); } 50%{ transform: translateY(-10px) rotate(1.5deg); } }
.hall-mascot-bubble{ max-width: 300px; }
@media (max-width: 640px){
.hall-mascot-img{ width: 150px; }
.hall-mascot{ margin-bottom: -46px; }
}
.casino-hall{
  position: relative;
  max-width: 940px; margin: 0 auto;

    radial-gradient(circle at 85% 90%, rgba(255,120,60,0.08), transparent 45%),

@keyframes hallTitleShimmer{ 0%{ background-position: 0% 0; } 100%{ background-position: 300% 0; } }
.hall-grid{

}
.hall-grid > .hall-card:nth-child(3n+2){ transform: translateY(14px); }
@media (max-width: 720px){

.hall-grid > .hall-card:nth-child(3n+2){ transform: none; }
}
.hall-card{
  position: relative;

.hall-card.g-roulette{ margin-top: -14px; }

.hall-card-inner::before{

.hall-card.g-roulette .hall-card-icon{ font-size: 60px; filter: drop-shadow(0 0 18px var(--neon-cyan)); }
.hall-card.g-loteria .hall-card-icon{ filter: drop-shadow(0 0 18px var(--neon-green)); }
@keyframes hallFloat{ 0%,100%{ transform: translateY(0) rotate(-2deg); } 50%{ transform: translateY(-7px) rotate(2deg); } }
.hall-card-title{

.hall-card-sub{ font-size: 11px; color: var(--silver-dim); letter-spacing:.4px; }
.hall-card-bulbs{ display:flex; justify-content:center; gap:5px; margin-top: 14px; }
.hall-card-bulbs .slot-bulb{ width:6px; height:6px; }

.casino-floor-hint{

/* =====================================================================
   TRIOLOCKE · RADICAL RED — capa de diseño nueva (Kanto)
   Concepto: "Pokénav" — carril lateral de navegación, cuadro de mando de
   la Liga, cartas con esquinas-corchete y una paleta índigo/cian propia de Radical Red.
   Todo lo de abajo se aplica DESPUÉS de las reglas heredadas
   (ya recoloreadas), así que manda sobre ellas.
   ===================================================================== */
:root{
  --bg:#140608; --bg-elev:#260b10; --panel:#350f16; --panel-2:#4e1720; --border:#671e2a;
  --silver:#f7e8c4; --silver-dim:#e6ba4c; --silver-bright:#fffcf4;
  --lava:#ffd771; --lava-hot:#ffca45; --lava-deep:#a41d28; --ember:#ffbbc1; --rockcrack:#ffda7c;
  --accent:#ffd771; --accent-dim:#e6ba4c; --danger:#ff557d; --danger-dim:#7d2348; --gold:#ffd363;
  --ruby:#ffd771; --ruby-deep:#a41d28;   --magma:#ff838d; --sapphire:#ffca45; --sapphire-deep:#eabc48;
  --sand:#ffd9dc; --abyss:#0e0406;
  --neon-pink:#ff8c96; --neon-cyan:#ffca45; --neon-yellow:#ffbbc1; --neon-green:#39e6a0;
  --f-display:'Unbounded','Chakra Petch',sans-serif; --f-ui:'Chakra Petch',sans-serif;
  --f-body:'Outfit',system-ui,sans-serif; --f-mono:'Space Mono',monospace;
  --r:6px;
}
::selection{ background:var(--accent-dim); color:#fff; }
::-webkit-scrollbar-thumb{ background:linear-gradient(180deg,var(--ruby-deep),var(--sapphire)); }
.rail::after{ background:linear-gradient(180deg,var(--ruby),var(--sapphire),var(--sapphire-deep),var(--ruby)); }
.orb{ background:conic-gradient(from 200deg,var(--ruby) 0 50%,var(--sapphire) 50% 100%); box-shadow:0 0 0 2px #0e0406,0 0 0 3px rgba(255,255,255,.18),0 0 22px rgba(255,91,105,.35),0 0 26px rgba(255,200,60,.3); }
.nav-btn.active .ni,.history-chip.active{ background:linear-gradient(135deg,var(--ruby),var(--ruby-deep)); }
.nav-badge{ background:var(--ruby); box-shadow:0 0 8px rgba(255,91,105,.5); }
.rs-bar i{ background:linear-gradient(90deg,var(--ruby-deep),var(--ruby),var(--sapphire)); }
button.primary{ border-color:rgba(255,218,124,.6); box-shadow:0 4px 0 #60202b,0 0 0 rgba(255,91,105,0); }
button.primary:hover{ box-shadow:0 4px 0 #60202b,0 0 22px rgba(255,91,105,.4); border-color:rgba(255,228,160,.8); }
button.primary:active{ box-shadow:0 1px 0 #60202b; }
.section-label::before{ background:linear-gradient(135deg,var(--ruby),var(--sapphire)); }
.section-label::after{ background:linear-gradient(90deg,rgba(255,200,60,.5),transparent); }
.prof-glow{ background:radial-gradient(circle at 50% 100%,rgba(255,91,105,.25),transparent 65%); }
.rs-row.ret .rs-name{ text-decoration-color:var(--danger); }
.hero-title{ background:linear-gradient(90deg,var(--ruby) 0%,#fff 48%,var(--sapphire) 100%); -webkit-background-clip:text; background-clip:text; }
html{ scroll-behavior:smooth; background:#100507; }
body{
  background:
    radial-gradient(1000px 620px at 8% -10%, rgba(255,91,105,.23), transparent 62%),
    radial-gradient(900px 640px at 108% 110%, rgba(255,200,60,.17), transparent 62%),
    linear-gradient(180deg,#17070a 0%,#100507 100%);
  background-attachment:fixed;
  color:var(--silver); font-family:var(--f-body); padding-bottom:0; min-height:100vh;
}
::selection{ background:var(--ruby-deep); color:#fff; }
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-track{ background:var(--abyss); }
::-webkit-scrollbar-thumb{ background:linear-gradient(180deg,var(--ruby-deep),var(--sapphire-deep)); border-radius:8px; }

/* ------------------------------------------------ shell (carril + escenario) */
.shell{ display:grid; grid-template-columns:248px minmax(0,1fr); min-height:100vh; }
.rail{
  position:sticky; top:0; align-self:start; height:100vh; z-index:60;
  display:flex; flex-direction:column; gap:18px; padding:20px 14px 16px;
  background:linear-gradient(180deg,rgba(39,11,16,.96),rgba(16,5,7,.98));
  border-right:1px solid var(--border);
}
.rail::after{
  content:""; position:absolute; top:0; right:-1px; width:2px; height:100%;
  background:linear-gradient(180deg,var(--ruby),var(--magma),var(--sapphire),var(--sapphire-deep),var(--ruby));
  background-size:100% 300%; animation:seam 9s linear infinite; opacity:.85;
}
@keyframes seam{ to{ background-position:0 300%; } }
.rail-brand{ display:flex; align-items:center; gap:12px; cursor:pointer; padding:4px 6px 10px; border-bottom:1px dashed rgba(255,200,60,.22); }
.orb{ position:relative; flex:0 0 46px; width:46px; height:46px; border-radius:50%;
  background:conic-gradient(from 200deg,var(--ruby) 0 50%,var(--sapphire) 50% 100%);
  box-shadow:0 0 0 2px #0e0406,0 0 0 3px rgba(255,255,255,.18),0 0 22px rgba(255,77,61,.35),0 0 26px rgba(255,200,60,.3);
  animation:orbSpin 14s linear infinite; }
.orb::before{ content:""; position:absolute; inset:15px; border-radius:50%; background:#0e0406; box-shadow:0 0 0 3px rgba(255,255,255,.85) inset; }
.orb::after{ content:""; position:absolute; left:50%; top:50%; width:8px; height:8px; margin:-4px 0 0 -4px; border-radius:50%; background:#fff; box-shadow:0 0 10px #fff; }
@keyframes orbSpin{ to{ transform:rotate(360deg); } }
.brand-txt{ display:flex; flex-direction:column; line-height:1.1; }
.brand-txt b{ font-family:var(--f-display); font-weight:800; font-size:17px; letter-spacing:1px; color:var(--silver-bright); }
.brand-txt small{ white-space:nowrap; font-family:var(--f-ui); font-size:10px; letter-spacing:1.7px; color:var(--sapphire); margin-top:4px; }
.rail-nav{ display:flex; flex-direction:column; gap:5px; }
.nav-btn{
  position:relative; display:flex; align-items:center; gap:12px; width:100%; text-align:left;
  background:transparent; border:1px solid transparent; border-radius:var(--r); cursor:pointer;
  padding:10px 12px; color:var(--silver-dim);
  font-family:var(--f-ui); font-weight:600; font-size:14px; letter-spacing:1.2px; text-transform:uppercase;
  transition:background .16s,color .16s,transform .16s,border-color .16s;
}
.nav-btn .ni{ flex:0 0 30px; height:30px; display:grid; place-items:center; font-size:15px;
  clip-path:polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%); background:var(--panel-2); transition:background .16s; }
.nav-btn:hover{ color:var(--silver-bright); transform:translateX(3px); border-color:rgba(255,200,60,.25); }
.nav-btn:hover .ni{ background:var(--sapphire-deep); }
.nav-btn.active{ color:#fff; background:linear-gradient(90deg,rgba(255,200,60,.20),rgba(255,200,60,0)); border-color:rgba(255,200,60,.35); }
.nav-btn.active::before{ content:""; position:absolute; left:-14px; top:20%; height:60%; width:4px; border-radius:0 4px 4px 0; background:var(--sapphire); box-shadow:0 0 12px var(--sapphire); }
.nav-btn.active .ni{ background:linear-gradient(135deg,var(--ruby),var(--ruby-deep)); box-shadow:0 0 14px rgba(255,77,61,.6); }
.nav-btn.n-final{ color:var(--magma); }
.nav-btn.n-final.active{ color:#fff; }
.nav-badge{ display:inline-flex; align-items:center; justify-content:center; min-width:18px; height:18px; padding:0 5px; margin-left:auto; border-radius:9px;
  background:var(--ruby); color:#fff; font-size:10px; font-weight:800; font-family:var(--f-mono); box-shadow:0 0 8px rgba(255,77,61,.7); }
.rail-status{ margin-top:auto; display:flex; flex-direction:column; gap:7px; padding-top:12px; border-top:1px dashed rgba(255,200,60,.22); }
.rs-title{ font-family:var(--f-ui); font-size:10.5px; letter-spacing:2.5px; color:var(--silver-dim); text-transform:uppercase; }
.rs-row{ position:relative; display:grid; grid-template-columns:minmax(74px,auto) 1fr 26px; align-items:center; gap:8px; cursor:pointer; font-family:var(--f-ui); font-size:13px; font-weight:600; color:var(--silver); }
.rs-row:hover .rs-name{ color:var(--sapphire); }
.rs-name-wrap{ display:flex; align-items:center; gap:4px; min-width:0; }
.rs-bar{ height:6px; border-radius:3px; background:rgba(255,255,255,.08); overflow:hidden; }
.rs-bar i{ display:block; height:100%; background:linear-gradient(90deg,var(--ruby-deep),var(--ruby),var(--magma)); border-radius:3px; }
.rs-num{ font-family:var(--f-mono); font-size:12px; text-align:right; color:var(--silver-bright); }
.rs-row.ret .rs-name{ text-decoration:line-through; text-decoration-color:var(--ruby); opacity:.75; }
.rs-row.ret .rs-bar i{ background:repeating-linear-gradient(45deg,#4a1320,#4a1320 4px,#2a0a12 4px,#2a0a12 8px); }
.rs-tag{ grid-column:1/-1; font-style:normal; font-family:var(--f-ui); font-size:9.5px; letter-spacing:2px; color:#fff; background:var(--ruby-deep); padding:1px 6px; width:max-content; border-radius:2px; margin-top:-3px; }

.stage{ position:relative; min-width:0; display:flex; flex-direction:column; }
.stage::before{ content:""; position:fixed; inset:0 0 0 248px; pointer-events:none; z-index:0;
  background-image:linear-gradient(rgba(255,200,60,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,200,60,.045) 1px,transparent 1px);
  background-size:46px 46px; -webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 10%,transparent 78%); mask-image:radial-gradient(ellipse at 50% 30%,#000 10%,transparent 78%); }
.topbar{ position:sticky; top:0; z-index:40; display:flex; align-items:center; justify-content:space-between; gap:14px;
  padding:13px 28px; background:rgba(16,5,7,.72); backdrop-filter:blur(10px); border-bottom:1px solid rgba(255,200,60,.16); }
.crumb{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-family:var(--f-ui); font-size:12px; letter-spacing:3px; text-transform:uppercase; color:var(--silver-dim); }
.crumb b{ color:var(--sapphire); font-weight:700; margin-left:8px; }
.top-vs{ display:flex; align-items:center; gap:8px; font-family:var(--f-display); font-size:11px; letter-spacing:2px; }
.top-vs .r{ color:var(--ruby); text-shadow:0 0 12px rgba(255,77,61,.7); } .top-vs .s{ color:var(--sapphire); text-shadow:0 0 12px rgba(255,200,60,.7); } .top-vs .v{ color:var(--silver-dim); font-size:9px; }
main{ position:relative; z-index:1; width:100%; max-width:1180px; margin:0 auto; padding:26px 28px 60px; flex:1; }
footer{ position:relative; z-index:1; text-align:center; padding:18px; font-family:var(--f-mono); font-size:11px; letter-spacing:1px; color:var(--silver-dim); opacity:.6; }

@media (max-width:900px){
  .shell{ grid-template-columns:1fr; }
  .stage::before{ inset:0; }
  .rail{ position:fixed; top:auto; bottom:0; left:0; right:0; height:auto; flex-direction:row; padding:6px 8px calc(6px + env(safe-area-inset-bottom)); gap:6px; border-right:0; border-top:1px solid var(--border); }
  .rail::after{ top:-1px; right:0; left:0; width:auto; height:2px; background:linear-gradient(90deg,var(--ruby),var(--magma),var(--sapphire),var(--ruby)); background-size:300% 100%; animation:seamH 9s linear infinite; }
  @keyframes seamH{ to{ background-position:300% 0; } }
  .rail-brand,.rail-status{ display:none; }
  .rail-nav{ flex-direction:row; width:100%; justify-content:space-between; gap:2px; }
  .nav-btn{ flex-direction:column; gap:3px; padding:6px 2px; font-size:9.5px; letter-spacing:.4px; justify-content:center; text-align:center; flex:1 1 0; min-width:0; }
  .nav-btn .ni{ flex-basis:auto; width:30px; }

/* =====================================================================
   SALÓN DE JUEGOS · CIUDAD MALVALONA — rework del casino
   Mauville = ciudad eléctrica: neón amarillo/cian/magenta sobre violeta
   oscuro, marquesinas de bombillas y máquinas de arcade. Solo se aplica
   dentro del casino (body.casino-mode / #app.in-casino).
   ===================================================================== */
body.casino-mode{
  --cz-bg:#17070a; --cz-panel:#2a0c11; --cz-panel2:#3f121a; --cz-edge:#a71d29;
  --cz-yellow:#ffd23f; --cz-cyan:#ffc533; --cz-pink:#ff3d9a; --cz-green:#39ff88; --cz-orange:#ff8a2b; --cz-red:#ff3b4a;
  --cz-text:#ffe9eb; --cz-dim:#e7747e;
  --f-sign:'Bungee','Unbounded',sans-serif;
  background:
    radial-gradient(900px 520px at 12% -6%, rgba(255,61,154,.22), transparent 62%),
    radial-gradient(900px 560px at 100% 100%, rgba(255,197,51,.16), transparent 62%),
    linear-gradient(180deg,#20090d 0%,#130508 100%);
}
body.casino-mode .stage::before{
  background-image:
    linear-gradient(rgba(255,61,154,.06) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,197,51,.05) 1px,transparent 1px);
  background-size:56px 56px;
}
body.casino-mode .topbar{ border-bottom-color:rgba(255,61,154,.28); }
body.casino-mode main{ max-width:1320px; }

/* ---------------------------------------------------------- bombillas */
.cz-bulbs-base, .cz-marquee-bulbs, .cz-cab-bulbs{ display:flex; gap:8px; justify-content:center; }
.cz-marquee-bulbs i, .cz-cab-bulbs i{
  width:9px; height:9px; border-radius:50%; background:var(--cz-yellow);
  box-shadow:0 0 8px var(--cz-yellow),0 0 16px rgba(255,210,63,.6); animation:czBulb 1.2s ease-in-out infinite;
}
.cz-marquee-bulbs i:nth-child(3n+2), .cz-cab-bulbs i:nth-child(3n+2){ background:var(--cz-pink); box-shadow:0 0 8px var(--cz-pink),0 0 16px rgba(255,61,154,.6); }
.cz-marquee-bulbs i:nth-child(3n), .cz-cab-bulbs i:nth-child(3n){ background:var(--cz-cyan); box-shadow:0 0 8px var(--cz-cyan),0 0 16px rgba(255,197,51,.6); }
@keyframes czBulb{ 0%,100%{ opacity:1; transform:scale(1); } 50%{ opacity:.25; transform:scale(.8); } }

/* ---------------------------------------------------------- HALL */
.cz-hall{ position:relative; }
.cz-marquee{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:18px; padding:22px 12px 8px; }
.cz-marquee-title{ text-align:center; line-height:1; }
.cz-marquee-title small{ display:block; font-family:var(--f-ui); font-size:12px; letter-spacing:8px; color:var(--cz-cyan); text-shadow:0 0 12px rgba(255,197,51,.8); margin-bottom:8px; }
.cz-marquee-title b{ font-family:var(--f-sign); font-weight:400; font-size:clamp(28px,5vw,58px); color:var(--cz-yellow); letter-spacing:3px;
  text-shadow:0 0 6px #fff4b0,0 0 18px var(--cz-yellow),0 0 42px rgba(255,138,43,.9),0 4px 0 #b06a00; animation:czNeon 3.4s infinite; }
@keyframes czNeon{ 0%,18%,22%,25%,53%,57%,100%{ opacity:1; } 20%,24%,55%{ opacity:.55; } }
@media (max-width:700px){ .cz-marquee{ grid-template-columns:1fr; } .cz-marquee-bulbs{ display:none; } }

.cz-hero{ display:grid; grid-template-columns:minmax(0,1.3fr) minmax(280px,.8fr); gap:24px; align-items:end; margin:10px 0 34px; }
@media (max-width:900px){ .cz-hero{ grid-template-columns:1fr; } }
.cz-croupier{ position:relative; min-height:250px; display:flex; align-items:flex-end; justify-content:center; padding-top:70px;
  border:1px solid var(--cz-edge); border-radius:14px; overflow:hidden;
  background:radial-gradient(420px 260px at 50% 100%, rgba(255,61,154,.32), transparent 70%),
             repeating-linear-gradient(90deg, rgba(255,255,255,.03) 0 2px, transparent 2px 46px), linear-gradient(180deg,#330f15,#1e090c); }
.cz-croupier::after{ content:""; position:absolute; left:0; right:0; bottom:0; height:46px; background:repeating-conic-gradient(#41131b 0 25%, #2a0c11 0 50%) 0 0/34px 34px; opacity:.9; }
.cz-croupier-img{ position:relative; z-index:2; height:250px; width:auto; object-fit:contain; margin-bottom:6px; filter:drop-shadow(0 12px 26px rgba(0,0,0,.65)) drop-shadow(0 0 30px rgba(255,120,60,.45)); animation:czFloat 5s ease-in-out infinite; }

.cz-zone{ margin-bottom:34px; }

.cz-zone-head b{ font-family:var(--f-sign); font-weight:400; font-size:22px; letter-spacing:2px; color:var(--cz-cyan); text-shadow:0 0 12px rgba(255,197,51,.6); text-transform:uppercase; }
.cz-zone-head span{ font-family:var(--f-ui); font-size:12px; letter-spacing:2px; color:var(--cz-dim); text-transform:uppercase; }
