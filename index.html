async function addPendingItem(){
  const type = document.getElementById('it-type').value;
  const name = document.getElementById('it-name').value.trim();
  const err = document.getElementById('offer-err');
  err.textContent = '';
  if(!name) return;
  err.textContent = 'Buscando…';
  try{
    const res = type==='pokemon' ? await fetchPokemonSprite(name) : await fetchItemSprite(name);
    pendingItems.push({ type, name: res.name, sprite: res.sprite });
    document.getElementById('it-name').value = '';
    err.textContent = '';
    renderPendingChips();
  }catch(e){
    err.textContent = 'No se encontró eso. Prueba el nombre en inglés.';
  }
}
function renderPendingChips(){
  document.getElementById('pending-chips').innerHTML = pendingItems.map((it,i)=>
    `<div class="chip"><img loading="lazy" src="${it.sprite}"><span>${it.name.replace(/-/g,' ')}</span> <button class="ghost" style="padding:0 6px;" onclick="removePendingItem(${i})">✕</button></div>`
  ).join('');
}
function removePendingItem(i){ pendingItems.splice(i,1); renderPendingChips(); }

async function submitOffer(mode, offerId){
  const trainer = document.getElementById('tr-select').value;
  const err = document.getElementById('offer-err');
  if(pendingItems.length === 0){ err.textContent = 'Añade al menos una cosa a la oferta.'; return; }

  if(mode === 'offer'){
    tradesActive.unshift({ id: crypto.randomUUID(), trainer, items: pendingItems, ts: Date.now(), counters: [] });
    pushHistory(`🔁 ${NAMES[trainer]} publicó una oferta de trade`);
  } else {
    const offer = tradesActive.find(o=>o.id===offerId);
    if(offer){
      offer.counters.push({ id: crypto.randomUUID(), trainer, items: pendingItems, ts: Date.now() });
      pushHistory(`🔁 ${NAMES[trainer]} ofreció algo a cambio en un trade`);
    }
  }
  closeModal();
  render();
  const ok = await saveTrades();
  if(!ok) queueRetry('trades', saveTrades);
}

async function acceptTrade(offerId, counterId){
  const offer = tradesActive.find(o=>o.id===offerId);
  if(!offer) return;
  const counter = offer.counters.find(c=>c.id===counterId);
  if(!counter) return;
  if(!confirm(`¿Aceptar que ${NAMES[offer.trainer]} dé sus cosas a cambio de lo de ${NAMES[counter.trainer]}?`)) return;

  tradesHistory.unshift({
    id: crypto.randomUUID(),
    offerTrainer: offer.trainer, offerItems: offer.items,
    counterTrainer: counter.trainer, counterItems: counter.items,
    ts: Date.now()
  });
  tradesActive = tradesActive.filter(o=>o.id!==offerId);
  pushHistory(`🤝 Trade cerrado entre ${NAMES[offer.trainer]} y ${NAMES[counter.trainer]}`);
  render();
  const ok = await saveTrades();
  if(!ok) queueRetry('trades', saveTrades);
}

async function cancelOffer(offerId){
  if(!confirm('¿Cancelar esta oferta?')) return;
  tradesActive = tradesActive.filter(o=>o.id!==offerId);
  render();
  const ok = await saveTrades();
  if(!ok) queueRetry('trades', saveTrades);
}

async function deleteTradeRecord(id){
  if(!confirm('¿Eliminar este trade del historial? (Úsalo cuando ya esté pagado)')) return;
  tradesHistory = tradesHistory.filter(r=>r.id!==id);
  render();
  const ok = await saveTrades();
  if(!ok) queueRetry('trades', saveTrades);
}

/* ---------------- Cuenta atrás de inicio de temporada ---------------- */
const SEASON_COUNTDOWN_STORAGE_KEY = 'locke_season_countdown_target_v2';
const DEFAULT_SEASON_COUNTDOWN_TARGET = new Date('2026-10-06T17:54:00+02:00');
let seasonCountdownTarget = DEFAULT_SEASON_COUNTDOWN_TARGET;
let seasonCountdownInterval = null;

function getSeasonCountdownTarget(){
  const saved = localStorage.getItem(SEASON_COUNTDOWN_STORAGE_KEY);
  if(!saved) return DEFAULT_SEASON_COUNTDOWN_TARGET;
  const parsed = new Date(saved);
  return Number.isFinite(parsed.getTime()) ? parsed : DEFAULT_SEASON_COUNTDOWN_TARGET;
}

function formatSeasonCountdownDate(date){
  return new Intl.DateTimeFormat('es-ES', {
    weekday:'long', day:'numeric', month:'long', hour:'2-digit', minute:'2-digit',
  }).format(date).replace(',', ' ·').toUpperCase();
}

function releaseSeasonCountdown(){
  const screen = document.getElementById('season-countdown');
  if(!screen || screen.classList.contains('unlocking')) return;
  screen.classList.add('unlocking');
  document.body.classList.remove('countdown-open');
  document.querySelector('.shell')?.removeAttribute('inert');
  document.querySelector('.shell')?.removeAttribute('aria-hidden');
  document.getElementById('settings-fab')?.removeAttribute('inert');
  document.getElementById('settings-panel')?.removeAttribute('inert');
  if(seasonCountdownInterval){
    clearInterval(seasonCountdownInterval);
    seasonCountdownInterval = null;
  }
  setTimeout(()=>screen.remove(), 1300);
}

function updateSeasonCountdown(){
  const remaining = seasonCountdownTarget.getTime() - Date.now();
  if(remaining <= 0){
    releaseSeasonCountdown();
    return;
  }
  const totalSeconds = Math.floor(remaining / 1000);
  const values = {
    'countdown-days': Math.floor(totalSeconds / 86400),
    'countdown-hours': Math.floor((totalSeconds % 86400) / 3600),
    'countdown-minutes': Math.floor((totalSeconds % 3600) / 60),
    'countdown-seconds': totalSeconds % 60,
  };
  Object.entries(values).forEach(([id, value])=>{
    const element = document.getElementById(id);
    if(element) element.textContent = String(value).padStart(2, '0');
  });
}

function startSeasonCountdown(){
  seasonCountdownTarget = getSeasonCountdownTarget();
  const dateLabel = document.getElementById('countdown-date');
  if(dateLabel) dateLabel.textContent = formatSeasonCountdownDate(seasonCountdownTarget);
  if(seasonCountdownTarget.getTime() <= Date.now()){
    releaseSeasonCountdown();
    return;
  }
  document.body.classList.add('countdown-open');
  const shell = document.querySelector('.shell');
  if(shell){
    shell.setAttribute('inert', '');
    shell.setAttribute('aria-hidden', 'true');
  }
  document.getElementById('settings-fab')?.setAttribute('inert', '');
  document.getElementById('settings-panel')?.setAttribute('inert', '');
  updateSeasonCountdown();
  seasonCountdownInterval = setInterval(updateSeasonCountdown, 1000);
}

function changeSeasonCountdownDate(){
  const current = `${seasonCountdownTarget.getFullYear()}-${String(seasonCountdownTarget.getMonth()+1).padStart(2,'0')}-${String(seasonCountdownTarget.getDate()).padStart(2,'0')} ${String(seasonCountdownTarget.getHours()).padStart(2,'0')}:${String(seasonCountdownTarget.getMinutes()).padStart(2,'0')}`;
  const value = prompt('Nueva fecha y hora local (formato AAAA-MM-DD HH:mm):', current);
  if(value === null) return;
  const match = value.trim().match(/^(\d{4})-(\d{2})-(\d{2})\s+(\d{2}):(\d{2})$/);
  if(!match){
    alert('Formato no válido. Usa AAAA-MM-DD HH:mm, por ejemplo: 2026-10-06 18:00');
    return;
  }
  const [, year, month, day, hour, minute] = match;
  const next = new Date(Number(year), Number(month)-1, Number(day), Number(hour), Number(minute), 0, 0);
  if(next.getFullYear() !== Number(year) || next.getMonth() !== Number(month)-1
      || next.getDate() !== Number(day) || next.getHours() !== Number(hour)
      || next.getMinutes() !== Number(minute)){
    alert('Esa fecha y hora no existen. Revísalas e inténtalo otra vez.');
    return;
  }
  seasonCountdownTarget = next;
  localStorage.setItem(SEASON_COUNTDOWN_STORAGE_KEY, next.toISOString());
  const dateLabel = document.getElementById('countdown-date');
  if(dateLabel) dateLabel.textContent = formatSeasonCountdownDate(next);
  updateSeasonCountdown();
}

  if(fresh){for(let i=0;i<22;i++){const s=document.createElement('i'),a=Math.random()*6.283,r=90+Math.random()*130;s.className='sp';s.style.setProperty('--x',Math.cos(a)*r+'px');s.style.setProperty('--y',Math.sin(a)*r+'px');rv.appendChild(s);setTimeout(()=>s.remove(),1400)}

function closeCard(){const rv=$('#rv'),st=$('#cs');if(rv)rv.classList.remove('on');clearZoom();if(st)st.style.transform='';setTimeout(()=>{cbusy=false;paintCal()},1150)}
/* ---------- tienda ---------- */
const TABS={skins:['Skins','characters','character'],fondos:['Fondos','backgrounds','background'],titulos:['Títulos','titles','title'],paletas:['Paletas','palettes','palette']};
window.renderShop=a=>{
  const [,kind,field]=TABS[tab],own=inv[kind]||{},av=(FBS.profiles[me]||{}).avatar||{},cur=String(av[field]),P=cfg.prices||{},tk=+((FBS.profiles[me]||{}).tickets)||0;
  let items=[];
  if(kind==='characters')items=Array.from({length:cfg.counts?.characters||0},(_,i)=>{const n=i+1;return{id:String(n),price:P.characters,nm:'Personaje '+n,vis:own[n]?`personajes/personaje_${n}.png`:`personajes_siluetas/personaje_${n}_silueta.png`}});
  if(kind==='backgrounds')items=Array.from({length:cfg.counts?.backgrounds||0},(_,i)=>{const n=i+1;return{id:String(n),price:P.backgrounds,nm:'Fondo '+n,w:1,vis:own[n]?`fondos/fondo_${n}.png`:`fondos_siluetas/fondo_${n}_silueta.png`}});
  if(kind==='palettes')items=Object.keys(cfg.palettes||{}).sort((x,y)=>x-y).map(id=>{const p=cfg.palettes[id];return{id,price:P.palettes,nm:`${esc(p.name)}<small>${esc(p.rarity)}</small>`,sw:p.colors}});
  if(kind==='titles')items=Object.keys(cfg.titles||{}).sort((x,y)=>cfg.titles[x].stars-cfg.titles[y].stars).map(id=>{const t=cfg.titles[id];return{id,price:(P.titleByStars||{})[t.stars],nm:`${'★'.repeat(t.stars)}<small>${esc(t.name)}</small>`,tt:esc(t.name)}});
  const cards=items.map(it=>{const has=!!own[it.id],now=cur===it.id;
    const vis=it.sw?`<div class="sw">${Object.values(it.sw).map(c=>`<i style="background:${esc(c)}"></i>`).join('')}</div>`:it.tt?`<div class="tt">${it.tt}</div>`:`<img class="vis${it.w?' w':''}" src="${it.vis}" alt="">`;
    const btn=has?`<button class="sm" data-eq="${it.id}" ${now?'disabled':''} type="button">${now?'Puesto':'Ponerme'}</button>`:`<button class="btn" data-buy="${it.id}" data-price="${it.price}" ${tk<it.price?'disabled':''} type="button">Comprar ${it.price}</button>`;
    return `<div class="it${has?' own':''}${has&&isNew(kind,it.id)?' lk-new':''}">${vis}<div class="nm">${it.sw?it.nm:it.tt?it.nm.split('<small>')[0]:it.nm}</div>${btn}</div>`}).join('');
  a.innerHTML=`<div class="lk"><h2>Tienda</h2><p class="mu">Tienes <b>${tk} tickets</b></p><div style="display:flex;gap:8px;flex-wrap:wrap">${Object.keys(TABS).map(k=>`<button class="sm${k===tab?' on':''}" data-tab="${k}" type="button">${TABS[k][0]}</button>`).join('')}</div><div class="shop">${cards}</div></div>`};
async function act(fn){if(busy)return;busy=true;try{await fn()}catch{say('Error de conexión. Inténtalo otra vez.')}finally{busy=false}}
document.addEventListener('click',e=>{const b=e.target.closest('.lk button');if(!b)return;
  if(b.dataset.tab){tab=b.dataset.tab;window.render()}
  if(b.dataset.eq)act(()=>set(ref(db,`profiles/${me}/avatar/${TABS[tab][2]}`),b.dataset.eq));
  if(b.dataset.buy)act(async()=>{const id=b.dataset.buy,pr=+b.dataset.price,kind=TABS[tab][1],tk=ref(db,`profiles/${me}/tickets`);
    const r=await runTransaction(tk,c=>(+c||0)>=pr?(+c||0)-pr:undefined);
    if(!r.committed){say('No tienes tickets suficientes.');return}
    try{await set(ref(db,`inventory/${me}/${kind}/${id}`),true)}catch{await runTransaction(tk,c=>(+c||0)+pr);say('No se pudo completar la compra. Te hemos devuelto los tickets.')}});
  if(b.dataset.life)act(async()=>{const k=b.dataset.life;if(((FBS.profiles[me]||{}).lives??20)>=20){say('Ya tienes 20 vidas. Cóbrala cuando pierdas alguna.');return}
    await set(ref(db,`claims/${me}/${k}`),{at:serverTimestamp()});await runTransaction(ref(db,`profiles/${me}/lives`),c=>Math.min(20,(+c||0)+1))})});
addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#rv')&&$('#rv').classList.contains('on'))closeCard()});
/* ---------- helpers de perfil / taquilla / bonus diario ---------- */
window.LK={
  pal(a){const c=cfg.palettes&&a&&cfg.palettes[a.palette];return c&&c.colors?`--bg:${esc(c.colors.fondo)};--sf:${esc(c.colors.superficie)};--pr:${esc(c.colors.primario)};--ac:${esc(c.colors.acento)};--tx:${esc(c.colors.texto)}`:''},
  title(a){return (cfg.titles&&a&&cfg.titles[a.title])||null},
  today(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Madrid'}).format(new Date(Date.now()+off))},
  daily(){act(async()=>{const day=LK.today(),n=+cfg.dailyBonus||10;
    const r=await runTransaction(ref(db,'profiles/'+me+'/lastDaily'),c=>c===day?undefined:day);
    if(!r.committed){say('Hoy ya has cobrado el bonus.');return}
    await runTransaction(ref(db,'profiles/'+me+'/tickets'),c=>(+c||0)+n);
    say('🎁 +'+n+' tickets');dirty()})}
};
window.renderLocker=a=>{
  const [,kind,field]=TABS[tab],own=inv[kind]||{},av=(FBS.profiles[me]||{}).avatar||{},cur=String(av[field]);
  const total={characters:cfg.counts?.characters||0,backgrounds:cfg.counts?.backgrounds||0,palettes:Object.keys(cfg.palettes||{}).length,titles:Object.keys(cfg.titles||{}).length};
  const nOwn=k=>Object.keys(inv[k]||{}).filter(i=>(inv[k]||{})[i]).length;
  const ids=Object.keys(own).filter(i=>own[i]);let items=[];
  if(kind==='characters')items=ids.sort((x,y)=>x-y).map(n=>({id:n,nm:'Personaje '+n,vis:`personajes/personaje_${n}.png`}));
  if(kind==='backgrounds')items=ids.sort((x,y)=>x-y).map(n=>({id:n,nm:'Fondo '+n,w:1,vis:`fondos/fondo_${n}.png`}));
  if(kind==='palettes')items=ids.filter(i=>cfg.palettes&&cfg.palettes[i]).map(id=>{const p=cfg.palettes[id];return{id,nm:`${esc(p.name)}<small>${esc(p.rarity)}</small>`,sw:p.colors}});
  if(kind==='titles')items=ids.filter(i=>cfg.titles&&cfg.titles[i]).sort((x,y)=>cfg.titles[x].stars-cfg.titles[y].stars).map(id=>{const t=cfg.titles[id];return{id,nm:`${'★'.repeat(t.stars)}<small>${esc(t.name)}</small>`,tt:esc(t.name)}});
  const cards=items.map(it=>{const now=cur===String(it.id);
    const vis=it.sw?`<div class="sw">${Object.values(it.sw).map(c=>`<i style="background:${esc(c)}"></i>`).join('')}</div>`:it.tt?`<div class="tt">${it.tt}</div>`:`<img class="vis${it.w?' w':''}" src="${it.vis}" alt="">`;
    return `<div class="it own${isNew(kind,it.id)?' lk-new':''}">${vis}<div class="nm">${it.sw?it.nm:it.tt?it.nm.split('<small>')[0]:it.nm}</div><button class="sm${now?' on':''}" data-eq="${it.id}" ${now?'disabled':''} type="button">${now?'Puesto ✓':'Ponerme'}</button></div>`}).join('');
  a.innerHTML=`<div class="lk lk-locker" style="max-width:1000px"><button class="sm" type="button" onclick="go('home')">← Volver al inicio</button>
    <h2>🔐 Tu taquilla</h2><p class="mu">Todo lo que has conseguido. Lo que te pongas se ve en tu perfil.</p>
    <div class="pf-wrap">${window.lkProfileCard(me,true)}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin:6px 0">${Object.keys(TABS).map(k=>`<button class="sm${k===tab?' on':''}" data-tab="${k}" type="button">${TABS[k][0]} ${nOwn(TABS[k][1])}/${total[TABS[k][1]]}</button>`).join('')}</div>
    ${items.length?`<div class="shop">${cards}</div>`:`<p class="mu" style="margin-top:16px">Aún no tienes nada en esta categoría. <a href="#" onclick="go('shop');return false" style="color:var(--ac)">Ir a la tienda</a> o abre las puertas del calendario.</p>`}</div>`};

setInterval(()=>{if(me&&$('#cg'))paintCal()},30000);

/* ---------- cosméticos de las ruedas y brillo de lo nuevo ---------- */
Object.assign(window.FBD,{
  async grantCosmetic(t,kind){
    const kinds=kind==='any'?['characters','backgrounds','palettes','titles']:[kind],owned=(FBS.inventory||{})[t]||{},pool=[];
    const range=n=>Array.from({length:n},(_,i)=>String(i+1));
    for(const k of kinds){
      const all=k==='characters'?range(cfg.counts?.characters||0):k==='backgrounds'?range(cfg.counts?.backgrounds||0):k==='palettes'?Object.keys(cfg.palettes||{}):Object.keys(cfg.titles||{});
      all.forEach(id=>{if(!(owned[k]&&owned[k][id]))pool.push([k,String(id)])})}
    if(!pool.length)return null;
    const [k,id]=pool[Math.floor(Math.random()*pool.length)];
    await set(ref(db,`inventory/${t}/${k}/${id}`),true);return{kind:k,id}},
  cosmeticName(k,id){return k==='characters'?'Personaje '+id:k==='backgrounds'?'Fondo '+id:k==='palettes'?'Paleta '+((cfg.palettes[id]||{}).name||id):'Título '+((cfg.titles[id]||{}).name||id)}});
function seenSet(){let s=null;try{s=JSON.parse(localStorage.getItem('locke_seen_'+me)||'null')}catch{}
  if(!s){s={};for(const k of Object.keys(inv))for(const id of Object.keys(inv[k]||{}))(s[k]=s[k]||{})[id]=1;localStorage.setItem('locke_seen_'+me,JSON.stringify(s))}return s}
function isNew(k,id){return !((seenSet()[k]||{})[id])}
let seenT=null;
function scheduleSeen(){clearTimeout(seenT);seenT=setTimeout(()=>{const s={};for(const k of Object.keys(inv))for(const id of Object.keys(inv[k]||{}))(s[k]=s[k]||{})[id]=1;localStorage.setItem('locke_seen_'+me,JSON.stringify(s))},6000)}
for(const n of ['renderLocker','renderShop']){const f=window[n];window[n]=a=>{f(a);scheduleSeen()}}

</script>
<script>
(function(){
  const fmt=new Intl.DateTimeFormat('es-ES',{timeZone:'Europe/Madrid',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
  function tick(){
    const c=document.getElementById('live-clock'); if(!c) return;
    const now=new Date(); c.textContent=fmt.format(now);
    const y=now.getFullYear(); let x=new Date(y,11,25); if(now>new Date(y,11,26)) x=new Date(y+1,11,25);
    const d=Math.ceil((x-now)/864e5), el=document.getElementById('live-xmas');
    if(el) el.textContent = d<=0 ? '🎄 ¡Feliz Navidad!' : '🎄 '+d+' d';
    const b=document.getElementById('live-box'); if(b) b.classList.toggle('off',!navigator.onLine);
  }
  tick(); setInterval(tick,1000);
})();
</script>
